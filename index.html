      <g data-b="skip" style="cursor:pointer"><path d="M130 85 L430 85 M200 140 L360 140" stroke="var(--hi)" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#ua)"/><text x="280" y="80" text-anchor="middle" style="fill:var(--ink-2);font:11px var(--f-mono)">skip connections</text></g>
      <path d="M280 56 L280 172" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="3 3" fill="none" marker-end="url(#ua)"/>
    </svg><div class="readout info">Click any block.</div>`);
    b.querySelectorAll("[data-b]").forEach((g) => (g.onclick = () => { const [t, d] = blocks[g.dataset.b]; b.querySelector(".info").innerHTML = `<b>${t}</b><br>${d}`; }));
  };

  /* 20. Word embeddings */
  W.w2v = (el) => {
    const b = U.box(el, "Word vectors and analogies", "Toy 2-D embeddings arranged the way Word2Vec/GloVe arrange real ones: directions carry meaning. Compute A − B + C and find the nearest word.");
    const E = { king: [4.2, 3.6], queen: [4.0, 1.2], man: [1.6, 3.4], woman: [1.4, 1.0], prince: [3.2, 3.9], princess: [3.0, 1.5], boy: [0.8, 3.7], girl: [0.6, 1.3], paris: [-3.2, 2.8], france: [-1.6, 3.6], delhi: [-3.4, 0.2], india: [-1.8, 1.0], apple: [-0.6, -2.6], mango: [-1.4, -2.9] };
    const ws = Object.keys(E); const opt = (v) => ws.map((w) => `<option ${w === v ? "selected" : ""}>${w}</option>`).join("");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls"><div class="ctrl"><label>A</label><select data-k="a">${opt("king")}</select></div><div class="ctrl"><label>− B</label><select data-k="b">${opt("man")}</select></div><div class="ctrl"><label>+ C</label><select data-k="c">${opt("woman")}</select></div></div><div class="plot"></div><div class="readout"></div>`);
    const cos = (u, v) => (u[0] * v[0] + u[1] * v[1]) / (Math.hypot(...u) * Math.hypot(...v));
    const draw = (s) => {
      const t = [E[s.a][0] - E[s.b][0] + E[s.c][0], E[s.a][1] - E[s.b][1] + E[s.c][1]];
      const ranked = ws.filter((w) => ![s.a, s.b, s.c].includes(w)).map((w) => [w, cos(E[w], t)]).sort((x, y) => y[1] - x[1]);
      const p = U.plot({ x0: -5, x1: 6, y0: -4, y1: 5, h: 260 });
      let g = p.frame([-4, -2, 0, 2, 4, 6], [-4, -2, 0, 2, 4]);
      ws.forEach((w) => { const [x, y] = E[w]; const on = [s.a, s.b, s.c].includes(w) || w === ranked[0][0]; g += `<circle cx="${p.X(x)}" cy="${p.Y(y)}" r="${on ? 6 : 4}" fill="${w === ranked[0][0] ? C3 : on ? C1 : "var(--ink-2)"}"/><text x="${p.X(x) + 8}" y="${p.Y(y) + 4}" style="fill:var(--ink)">${w}</text>`; });
      g += `<circle cx="${p.X(t[0])}" cy="${p.Y(t[1])}" r="8" fill="none" stroke="${C2}" stroke-width="3"/>`;
      b.querySelector(".plot").innerHTML = p.svg(g);
      b.querySelector(".readout").innerHTML = `${s.a} − ${s.b} + ${s.c} = [${U.f(t[0], 2)}, ${U.f(t[1], 2)}] (amber ring)<br>Nearest by cosine similarity: <b>${ranked[0][0]}</b> (${U.f(ranked[0][1], 3)}), then ${ranked[1][0]} (${U.f(ranked[1][1], 3)})<br><span class="muted">Word2Vec learns these from local context windows (CBOW predicts the word from its context; skip-gram predicts the context from the word). GloVe learns them from global co-occurrence counts. Both give one static vector per word, so "bank" (river) and "bank" (money) share a vector. Contextual models like BERT fix that.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 21. LSTM cell */
  W.lstm = (el) => {
    const b = U.box(el, "Inside an LSTM cell", "Set the gate values (outputs of sigmoids, so 0–1) and see how the cell state and hidden state update. Then compare gradient flow through an RNN and an LSTM.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("c0", "Previous cell state c_{t−1}", -2, 2, 0.1, 1.5)}${U.range("f", "Forget gate f_t", 0, 1, 0.05, 0.9)}${U.range("i", "Input gate i_t", 0, 1, 0.05, 0.3)}${U.range("g", "Candidate g_t = tanh(·)", -1, 1, 0.05, 0.8)}${U.range("o", "Output gate o_t", 0, 1, 0.05, 0.7)}${U.range("n", "Sequence length (gradient demo)", 5, 100, 5, 40)}</div><div class="readout"></div>`);
    const draw = (s) => {
      const c = s.f * s.c0 + s.i * s.g, h = s.o * Math.tanh(c);
      b.querySelector(".readout").innerHTML = `c_t = f_t ⊙ c_{t−1} + i_t ⊙ g_t = ${s.f}×${s.c0} + ${s.i}×${s.g} = <b>${U.f(c, 4)}</b><br>h_t = o_t ⊙ tanh(c_t) = ${s.o}×tanh(${U.f(c, 3)}) = <b>${U.f(h, 4)}</b><br>
        ${s.f > 0.95 && s.i < 0.1 ? "Memory preserved: forget ≈ 1, input ≈ 0, so the cell carries information forward almost unchanged." : s.f < 0.2 ? "Memory wiped: the forget gate erased c_{t−1}." : ""}<br>
        Gradient through ${s.n} steps · vanilla RNN with factor 0.9 per step: 0.9^${s.n} = <b>${(0.9 ** s.n).toExponential(2)}</b> (vanishes); with 1.1: <b>${(1.1 ** s.n).toExponential(2)}</b> (explodes)<br>
        LSTM cell path with f_t = ${s.f}: ${s.f}^${s.n} = <b>${(s.f ** s.n).toExponential(2)}</b>. The gate learns to sit near 1 when long memory matters.<br><span class="muted">That additive cell-state path, controlled by gates, is the LSTM's fix for vanishing gradients. Gradient clipping handles explosions.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 22. Self-attention */
  W.attention = (el) => {
    const b = U.box(el, "Self-attention, computed", "Click a word to see where it looks. Scores are q·k/√d, turned into weights with softmax. Toggle the causal mask a decoder uses.");
    const words = ["The", "animal", "didn't", "cross", "the", "street", "because", "it", "was", "tired"];
    const v = [[0.1, 0.0, 0.2], [0.9, 0.2, 0.1], [0.1, 0.8, 0.0], [0.2, 0.9, 0.3], [0.1, 0.0, 0.25], [0.3, 0.2, 0.9], [0.0, 0.5, 0.1], [0.85, 0.25, 0.3], [0.2, 0.6, 0.1], [0.8, 0.5, 0.1]];
    b.insertAdjacentHTML("beforeend", `<div class="row">${U.seg("m", [["enc", "Encoder (bidirectional)"], ["dec", "Decoder (causal mask)"]], "enc")}</div><div class="tokens">${words.map((w, i) => `<span class="tok ${i === 7 ? "on" : ""}" data-i="${i}" tabindex="0" role="button">${w}</span>`).join("")}</div><div class="plot"></div><div class="readout"></div>`);
    let sel = 7, st;
    const draw = () => {
      const d = 3, q = v[sel];
      let sc = v.map((k, j) => (st.m === "dec" && j > sel ? -Infinity : (q[0] * k[0] + q[1] * k[1] + q[2] * k[2]) * 4 / Math.sqrt(d)));
      const mx = Math.max(...sc); const ex = sc.map((s) => (s === -Infinity ? 0 : Math.exp(s - mx))); const Z = ex.reduce((a, c) => a + c, 0); const w = ex.map((e) => e / Z);
      const W_ = 560, H = 150, bw = W_ / words.length;
      let g = ""; words.forEach((t, j) => { const hgt = w[j] * 110; g += `<rect x="${j * bw + 6}" y="${118 - hgt}" width="${bw - 12}" height="${hgt}" rx="4" fill="${j === sel ? C2 : C1}" opacity="${st.m === "dec" && j > sel ? 0.15 : 1}"/><text x="${j * bw + bw / 2}" y="${136}" text-anchor="middle" style="fill:var(--ink)">${t}</text><text x="${j * bw + bw / 2}" y="${112 - hgt}" text-anchor="middle">${w[j] < 0.005 ? "" : w[j].toFixed(2)}</text>`; });
      b.querySelector(".plot").innerHTML = `<svg class="chart" viewBox="0 0 ${W_} ${H}">${g}</svg>`;
      b.querySelector(".readout").innerHTML = `Attention(Q, K, V) = softmax(QKᵀ / √d_k) · V · here d_k = ${d}<br>Query "<b>${words[sel]}</b>" puts its largest weight on "<b>${words[w.indexOf(Math.max(...w))]}</b>" (${Math.max(...w).toFixed(2)}). The weights in the row sum to 1.<br><span class="muted">${st.m === "dec" ? "Causal mask: scores for future positions are set to −∞ before the softmax, so a token can only attend to itself and earlier tokens. That is what makes GPT-style generation autoregressive." : "Encoder self-attention is bidirectional: every token sees every other token. BERT uses this. Multi-head attention runs several of these in parallel with different learned projections and concatenates the results."}</span>`;
    };
    st = U.bind(b, draw);
    b.querySelectorAll(".tok").forEach((t) => { const pick = () => { sel = +t.dataset.i; b.querySelectorAll(".tok").forEach((x) => x.classList.toggle("on", x === t)); draw(); }; t.onclick = pick; t.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } }; });
    draw();
  };

  /* 23. Positional encoding */
  W.posenc = (el) => {
    const b = U.box(el, "Sinusoidal positional encoding", "PE(pos, 2i) = sin(pos / 10000^(2i/d)), PE(pos, 2i+1) = cos(pos / 10000^(2i/d)). Each row is one position; low dimensions oscillate fast, high dimensions slowly.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("d", "d_model", 16, 128, 16, 64)}${U.range("pos", "Highlight position", 0, 49, 1, 10)}</div><canvas width="640" height="250" class="wcanvas cv" style="aspect-ratio:640/250"></canvas><div class="readout"></div>`);
    const draw = (s) => {
      const cv = b.querySelector(".cv"), ctx = cv.getContext("2d"); const P = 50, D = s.d; const cw = 640 / D, ch = 250 / P;
      for (let pos = 0; pos < P; pos++) for (let k = 0; k < D; k++) { const i = Math.floor(k / 2); const ang = pos / Math.pow(10000, (2 * i) / D); const v = k % 2 ? Math.cos(ang) : Math.sin(ang); const r = v > 0 ? Math.round(35 + 50 * v) : 35, gg = 70 + Math.round(30 * (1 - Math.abs(v))), bb = v < 0 ? Math.round(120 - 80 * v) : 90; ctx.fillStyle = `rgb(${v > 0 ? 40 + 200 * v : 40},${gg},${v < 0 ? 60 - 190 * v : 60 + 20 * (1 - v)})`; ctx.fillRect(k * cw, pos * ch, cw + 0.5, ch + 0.5); }
      ctx.strokeStyle = U.css("--hi"); ctx.lineWidth = 3; ctx.strokeRect(1, s.pos * ch, 638, ch);
      const vec = []; for (let k = 0; k < 6; k++) { const i = Math.floor(k / 2); const ang = s.pos / Math.pow(10000, (2 * i) / D); vec.push((k % 2 ? Math.cos(ang) : Math.sin(ang)).toFixed(3)); }
      b.querySelector(".readout").innerHTML = `Rows = positions 0–49, columns = ${D} dimensions (red = +1, blue = −1).<br>PE(${s.pos}) starts [${vec.join(", ")}, …]<br><span class="muted">Self-attention alone is order-blind (permuting the input permutes the output). Adding PE to the token embeddings injects order. Every position gets a unique pattern, values stay within [−1, 1], and PE(pos + k) is a linear function of PE(pos), which makes relative offsets easy to learn.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 24. BPE */
  W.bpe = (el) => {
    const b = U.box(el, "Byte-pair encoding, one merge at a time", "Start from characters plus an end-of-word marker (_). Each step merges the most frequent adjacent pair into a new token. Watch the corpus get shorter as the vocabulary grows.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrl"><label>Corpus (space-separated words)</label><input type="text" data-k="c" value="low lower lowest slow slower"></div><div class="row"><button class="btn small" data-act="step">Merge next pair</button><button class="btn quiet small" data-act="reset">Reset</button></div><div class="readout"></div>`);
    let words, merges, st;
    const reset = () => { words = st.c.trim().split(/\s+/).map((w) => w.split("").concat("_")); merges = []; draw(); };
    const count = () => words.reduce((a, w) => a + w.length, 0);
    const pairs = () => { const m = new Map(); words.forEach((w) => { for (let i = 0; i < w.length - 1; i++) { const k = w[i] + "\u0001" + w[i + 1]; m.set(k, (m.get(k) || 0) + 1); } }); return m; };
    const step = () => { const P = pairs(); if (!P.size) return; let best = null, bc = 0; for (const [k, c] of P) if (c > bc) { best = k; bc = c; } if (bc < 2) { merges.push(["—", "no pair occurs twice; stop", count()]); draw(); return; } const [a, bb] = best.split("\u0001"); words = words.map((w) => { const o = []; for (let i = 0; i < w.length; i++) { if (i < w.length - 1 && w[i] === a && w[i + 1] === bb) { o.push(a + bb); i++; } else o.push(w[i]); } return o; }); merges.push([`${a} + ${bb} → ${a + bb}`, `appears ${bc}×`, count()]); draw(); };
    const draw = () => {
      b.querySelector(".readout").innerHTML = `<div class="tokens" style="margin-bottom:8px">${words.map((w) => w.map((t) => `<span class="tok">${t}</span>`).join("")).join('<span style="width:12px"></span>')}</div>Tokens needed for the corpus: <b>${count()}</b><br>${merges.map((m, i) => `Merge ${i + 1}: ${m[0]} (${m[1]}) → ${m[2]} tokens`).join("<br>")}<br><span class="muted">Frequent strings become single tokens; rare words split into several subwords, so no word is ever out-of-vocabulary. GPT models use BPE; BERT uses WordPiece, a close cousin that picks merges by likelihood gain instead of raw frequency.</span>`;
    };
    st = U.bind(b, reset);
    b.querySelector('[data-act="step"]').onclick = step; b.querySelector('[data-act="reset"]').onclick = reset;
    reset();
  };

  /* 25. Decoding: temperature, top-k, top-p */
  W.sampler = (el) => {
    const b = U.box(el, "Next-token sampler", "Prompt: “Name an animal that is both domestic and wild:”. The model's logits are fixed. Temperature reshapes the distribution; top-k and top-p cut its tail.");
    const toks = ["cat", "dog", "pig", "horse", "goat", "car", "quantum"]; const logits = [5, 4, 3.2, 2.5, 2.2, 1, -1];
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("T", "Temperature T", 0.05, 3, 0.05, 1)}${U.range("k", "Top-k (7 = off)", 1, 7, 1, 7)}${U.range("p", "Top-p (1 = off)", 0.1, 1, 0.05, 1)}</div><div class="row"><button class="btn small" data-act="s1">Sample 1 token</button><button class="btn quiet small" data-act="s100">Sample 100</button></div><div class="plot"></div><div class="readout"></div>`);
    let counts = null, last = null; const r = U.rng(5); let st;
    const probs = (s) => {
      const z = logits.map((l) => l / s.T); const m = Math.max(...z); let p = z.map((v) => Math.exp(v - m)); const Z = p.reduce((a, c) => a + c, 0); p = p.map((v) => v / Z);
      const raw = p.slice(); const order = p.map((v, i) => i).sort((a, c) => p[c] - p[a]);
      const keep = new Set(); let cum = 0;
      order.forEach((i, rank) => { if (rank < s.k && (cum < s.p || rank === 0)) { keep.add(i); cum += p[i]; } });
      let q = p.map((v, i) => (keep.has(i) ? v : 0)); const Zq = q.reduce((a, c) => a + c, 0); q = q.map((v) => v / Zq);
      return { raw, q, keep };
    };
    const draw = () => {
      const s = st; const { raw, q, keep } = probs(s);
      const W_ = 560, H = 190, bw = W_ / toks.length; let g = "";
      toks.forEach((t, i) => { const h1 = raw[i] * 140, h2 = q[i] * 140; g += `<rect x="${i * bw + 10}" y="${160 - h1}" width="${bw - 20}" height="${h1}" rx="4" fill="var(--rule)"/><rect x="${i * bw + 18}" y="${160 - h2}" width="${bw - 36}" height="${h2}" rx="4" fill="${keep.has(i) ? (last === i ? C2 : C1) : "transparent"}"/><text x="${i * bw + bw / 2}" y="178" text-anchor="middle" style="fill:var(--ink)">${t}</text><text x="${i * bw + bw / 2}" y="${154 - Math.max(h1, h2)}" text-anchor="middle">${(q[i] * 100).toFixed(1)}%</text>${counts ? `<text x="${i * bw + bw / 2}" y="${H - 1}" text-anchor="middle">${counts[i]}×</text>` : ""}`; });
      b.querySelector(".plot").innerHTML = `<svg class="chart" viewBox="0 0 ${W_} ${H + 6}">${g}</svg><div class="legend"><span><i style="background:var(--rule);height:10px"></i>softmax(z/T)</span><span><i style="background:${C1};height:10px"></i>after top-k / top-p, renormalised</span></div>`;
      b.querySelector(".readout").innerHTML = `p_i = exp(z_i / T) / Σ_j exp(z_j / T) · logits = [${logits.join(", ")}]<br>${s.T < 0.3 ? "Low T: nearly greedy (argmax). Deterministic and repetitive, good for facts, maths, code." : s.T > 1.5 ? "High T: flat distribution. Creative but prone to nonsense like “car” or “quantum” (hallucination)." : "T ≈ 1: the model's own distribution."} Kept tokens: ${keep.size} of 7.${last != null ? `<br>Sampled: <b>${toks[last]}</b>` : ""}<br><span class="muted">Top-k keeps the k most likely tokens. Top-p (nucleus) keeps the smallest set whose cumulative probability reaches p, so its size adapts to how confident the model is. Greedy decoding always takes the argmax and gives the same output every time.</span>`;
    };
    const sample = () => { const { q } = probs(st); let u = r(), i = 0; for (; i < q.length - 1; i++) { u -= q[i]; if (u <= 0) break; } return i; };
    st = U.bind(b, () => { counts = null; last = null; draw(); });
    b.querySelector('[data-act="s1"]').onclick = () => { last = sample(); draw(); };
    b.querySelector('[data-act="s100"]').onclick = () => { counts = new Array(7).fill(0); for (let n = 0; n < 100; n++) counts[sample()]++; last = null; draw(); };
    draw();
  };

  /* 26. Prompt technique game */
  W.promptgame = (el) => {
    const b = U.box(el, "Name that prompting technique", "Read the prompt and pick the technique. Ten prompts, instant feedback.");
    const items = [
      ["Classify the sentiment of this review as positive, negative or neutral: “The battery dies by noon.”", "zero", "No examples, just the instruction and the model's pre-trained knowledge."],
      ["“The support was excellent.” → positive\n“The laptop battery drains very quickly.” →", "one", "Exactly one worked input→output example before the real input."],
      ["I loved the food → positive\nService was slow → negative\nGreat camera, poor battery → mixed\nThe screen cracked in a week →", "few", "Two to five examples teach format and labels."],
      ["A shop sells notebooks at $5 and pens at $2. A customer buys 3 notebooks and 4 pens. What is the total? Think step by step.", "cot", "“Think step by step” asks for intermediate reasoning: chain-of-thought."],
      ["You are an experienced physics professor teaching first-year engineers. Explain Newton's second law with a real-life example.", "role", "Assigning a persona (and an audience) is role prompting."],
      ["Extract the name, job title and company from the paragraph below and return them as a JSON object with keys name, title, company.", "struct", "The prompt fixes the output format: structured-output prompting."],
      ["Translate to French: “Where is the railway station?”", "zero", "A plain instruction, no examples."],
      ["Q: 23 + 48? A: 20 + 40 = 60, 3 + 8 = 11, so 71.\nQ: 37 + 45? A:", "cot", "The example demonstrates step-by-step reasoning, so this is few-shot chain-of-thought. The defining feature is the reasoning steps."],
      ["Act as a strict code reviewer. Review this Python function for bugs and style.", "role", "“Act as …” gives the model a persona."],
      ["Summarise the article in exactly 5 bullet points, each under 12 words.", "struct", "The constraint is on output structure: bullets, count, length."]
    ];
    const L = { zero: "Zero-shot", one: "One-shot", few: "Few-shot", cot: "Chain-of-thought", role: "Role prompting", struct: "Structured output" };
    let i = 0, score = 0;
    const draw = (fb) => {
      const [p, a, x] = items[i];
      b.querySelector(".pg").innerHTML = `<div class="eyebrow">Prompt ${i + 1} of ${items.length} · score ${score}</div><pre class="readout" style="white-space:pre-wrap;margin:6px 0">${p}</pre><div class="opts" style="flex-direction:row;flex-wrap:wrap">${Object.entries(L).map(([k, l]) => `<button class="btn quiet small" data-v="${k}" ${fb ? "disabled" : ""}>${l}</button>`).join("")}</div>${fb ? `<div class="callout ${fb === a ? "good" : "bad"}" style="margin-top:8px"><b>${fb === a ? "Correct" : "It's " + L[a]}.</b> ${x}</div><button class="btn small" style="margin-top:8px" data-act="next">${i < items.length - 1 ? "Next prompt" : "Play again"}</button>` : ""}`;
      b.querySelectorAll("[data-v]").forEach((bt) => (bt.onclick = () => { if (bt.dataset.v === a) score++; draw(bt.dataset.v); }));
      const n = b.querySelector('[data-act="next"]'); if (n) n.onclick = () => { i = (i + 1) % items.length; if (i === 0) score = 0; draw(); };
    };
    b.insertAdjacentHTML("beforeend", `<div class="pg"></div>`); draw();
  };

  /* 27. LoRA */
  W.lora = (el) => {
    const b = U.box(el, "LoRA parameter calculator", "Freeze W (d × k). Learn ΔW = B·A with B (d × r) and A (r × k). Count the trainable parameters.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("d", "d (rows of W)", 256, 8192, 256, 4096)}${U.range("k", "k (columns of W)", 256, 8192, 256, 4096)}${U.range("r", "rank r", 1, 64, 1, 8)}${U.range("L", "Adapted matrices (layers × Q,V)", 1, 128, 1, 64)}</div><div class="readout"></div>`);
    const draw = (s) => {
      const full = s.d * s.k, lo = s.r * (s.d + s.k);
      b.querySelector(".readout").innerHTML = `Full fine-tune of one matrix: d·k = ${s.d}×${s.k} = <b>${full.toLocaleString()}</b><br>LoRA: r(d + k) = ${s.r}×(${s.d}+${s.k}) = <b>${lo.toLocaleString()}</b> → <b>${U.f((lo / full) * 100, 3)}%</b> of the original (${U.f(full / lo, 1)}× fewer)<br>Across ${s.L} adapted matrices: ${(full * s.L / 1e6).toFixed(1)} M vs <b>${(lo * s.L / 1e6).toFixed(2)} M</b> trainable parameters<br><span class="muted">h = W₀x + (α/r)·B·A·x. A starts random and B starts at zero, so ΔW = 0 at step 0 and training begins exactly at the pre-trained model. After training, BA can be merged into W₀, so inference has no extra latency. QLoRA adds a 4-bit quantised frozen base model so large models fit on one GPU.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 28. RAG pipeline */
  W.rag = (el) => {
    const b = U.box(el, "A working mini-RAG", "Eight passages form the knowledge base. Type a question: it is embedded (bag-of-words TF-IDF here), the top-k passages are retrieved by cosine similarity, and the augmented prompt is built.");
    const docs = [
      "The Nila Observatory opens at 09:00 and closes at 16:30 on weekdays.",
      "Researchers at the Nila Observatory must book a two-hour slot in advance.",
      "Raw telescope images are archived for 30 days, while calibrated measurements are retained for one year.",
      "Public tours of the observatory take place only on the first Saturday of each month.",
      "The campus cafeteria serves South Indian breakfast from 07:30 to 10:00.",
      "Visitor badges are made of recycled plastic and must be returned at the gate.",
      "The library allows graduate students to borrow up to ten books for a month.",
      "Parking for visitors is available near the main gate after 10:00."
    ];
    b.insertAdjacentHTML("beforeend", `<div class="ctrls"><div class="ctrl" style="grid-column:1/-1"><label>Question</label><input type="text" data-k="q" value="How long are calibrated measurements kept?"></div>${U.range("k", "Top-k passages", 1, 4, 1, 2)}</div><div class="readout"></div>`);
    const tok = (s) => s.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter((w) => w.length > 2 && !["the", "and", "are", "for", "how", "what", "while", "must", "each", "only", "from", "after", "near", "with"].includes(w)).map((w) => w.replace(/(ed|s)$/, ""));
    const D = docs.map(tok); const df = {}; D.forEach((d) => new Set(d).forEach((w) => (df[w] = (df[w] || 0) + 1)));
    const vec = (t) => { const v = {}; t.forEach((w) => (v[w] = (v[w] || 0) + 1)); Object.keys(v).forEach((w) => (v[w] *= Math.log(1 + docs.length / (df[w] || 0.5)))); return v; };
    const cos = (a, c) => { let d = 0, na = 0, nc = 0; for (const k in a) { na += a[k] ** 2; if (c[k]) d += a[k] * c[k]; } for (const k in c) nc += c[k] ** 2; return na && nc ? d / Math.sqrt(na * nc) : 0; };
    const DV = D.map(vec);
    const draw = (s) => {
      const qv = vec(tok(s.q)); const sc = DV.map((v, i) => [i, cos(qv, v)]).sort((a, c) => c[1] - a[1]); const top = sc.slice(0, s.k);
      const none = top[0][1] < 0.05;
      b.querySelector(".readout").innerHTML = `<b>1 · Retrieve</b> (cosine similarity to the question)<br>${sc.slice(0, 4).map(([i, v], r) => `${r < s.k ? "✓" : "·"} ${v.toFixed(2)} — ${docs[i]}`).join("<br>")}<br><br><b>2 · Augment</b> (the prompt the LLM actually receives)<br><span style="white-space:pre-wrap">Answer using ONLY the context. If the answer is not there, reply "not in context".
Context:
${top.map(([i]) => "- " + docs[i]).join("\n")}
Question: ${s.q}</span><br><br><b>3 · Generate</b> → ${none ? "nothing relevant was retrieved, so a grounded model should abstain: “not in context”." : "the LLM answers from the retrieved text, and can cite it."}<br><span class="muted">The documents are the model's non-parametric memory: you can update them without retraining. Real systems chunk documents, embed them with a neural encoder, store them in a vector database, and often re-rank the hits.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 29. Evaluation metrics */
  W.metrics = (el) => {
    const b = U.box(el, "Exact match, token F1, ROUGE-L", "Type a reference answer and a model prediction. These are the three metrics from the Week 12 tutorial.");
    b.insertAdjacentHTML("beforeend", `<div class="row">${U.seg("ex", [["a", "Identical"], ["b", "Extra words"], ["c", "Paraphrase"]], "b")}</div><div class="ctrls"><div class="ctrl"><label>Reference</label><input type="text" data-k="ref" value="Friday at 19:00"></div><div class="ctrl"><label>Prediction</label><input type="text" data-k="pred" value="The backup runs on Friday at 19:00"></div></div><div class="readout"></div>`);
    const norm = (s) => s.toLowerCase().replace(/[^a-z0-9: ]/g, " ").replace(/\b(a|an|the)\b/g, " ").split(/\s+/).filter(Boolean);
    const lcs = (a, c) => { const m = Array.from({ length: a.length + 1 }, () => new Array(c.length + 1).fill(0)); for (let i = 1; i <= a.length; i++) for (let j = 1; j <= c.length; j++) m[i][j] = a[i - 1] === c[j - 1] ? m[i - 1][j - 1] + 1 : Math.max(m[i - 1][j], m[i][j - 1]); return m[a.length][c.length]; };
    const draw = (s) => {
      const r = norm(s.ref), p = norm(s.pred);
      const em = r.join(" ") === p.join(" ") ? 1 : 0;
      const cnt = {}; r.forEach((w) => (cnt[w] = (cnt[w] || 0) + 1)); let ov = 0; p.forEach((w) => { if (cnt[w] > 0) { ov++; cnt[w]--; } });
      const P = p.length ? ov / p.length : 0, R = r.length ? ov / r.length : 0, F = P + R ? (2 * P * R) / (P + R) : 0;
      const l = lcs(r, p); const lp = p.length ? l / p.length : 0, lr = r.length ? l / r.length : 0, lf = lp + lr ? (2 * lp * lr) / (lp + lr) : 0;
      b.querySelector(".readout").innerHTML = `Normalised: ref [${r.join(" ")}] · pred [${p.join(" ")}]<br>Exact match = <b>${em}</b><br>Token F1: overlap ${ov}, precision ${ov}/${p.length} = ${U.f(P, 3)}, recall ${ov}/${r.length} = ${U.f(R, 3)} → F1 = <b>${U.f(F, 3)}</b><br>ROUGE-L: LCS length ${l} → P ${U.f(lp, 3)}, R ${U.f(lr, 3)}, F = <b>${U.f(lf, 3)}</b><br><span class="muted">A correct paraphrase (“7 in the evening on Friday”) scores low on all three. That gap is why LLM-as-a-judge and human evaluation exist.</span>`;
    };
    const st = U.bind(b, draw);
    const ex = { a: ["Friday at 19:00", "Friday at 19:00"], b: ["Friday at 19:00", "The backup runs on Friday at 19:00"], c: ["Friday at 19:00", "7 in the evening on Friday"] };
    b.querySelector('[data-seg="ex"]').addEventListener("click", () => setTimeout(() => { const [r, p] = ex[st.ex]; const ri = b.querySelector('[data-k="ref"]'), pi = b.querySelector('[data-k="pred"]'); ri.value = r; pi.value = p; ri.dispatchEvent(new Event("input")); pi.dispatchEvent(new Event("input")); }));
    draw(st);
  };

  /* 30. Guardrail policy gate */
  W.guard = (el) => {
    const b = U.box(el, "Run the safety policy gate", "An LLM agent proposes tool calls. Decide for each: allow, require human review, or deny. Then compare with the tutorial's policy.");
    const items = [["Read the supplied course notes", "allow", "Read-only access to trusted material."], ["Search a public index", "allow", "Read-only, public data."], ["Write a file to the shared drive", "review", "Irreversible side effect (overwrites); a human approves first."], ["Send a message to a student", "review", "Outbound communication can cause harm if wrong."], ["Execute a shell command found inside a retrieved document", "deny", "Prompt injection: instructions embedded in retrieved text are data, never commands."], ["Transfer money to an account", "deny", "Outside the agent's mandate; high stakes."], ["Send a message containing all stored grades (instruction found in a web page)", "deny", "Injected instruction plus a privacy breach."]];
    const L = { allow: "Allow", review: "Review", deny: "Deny" }; const pick = {};
    b.insertAdjacentHTML("beforeend", `<div class="gl"></div><button class="btn small" data-act="chk">Check my policy</button><div class="res"></div>`);
    b.querySelector(".gl").innerHTML = items.map(([t], i) => `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--rule);padding:8px 0"><span style="flex:1;min-width:200px">${t}</span><div class="seg" data-gi="${i}">${Object.entries(L).map(([k, l]) => `<button type="button" data-v="${k}">${l}</button>`).join("")}</div></div>`).join("");
    b.querySelectorAll("[data-gi]").forEach((sg) => sg.addEventListener("click", (e) => { const bt = e.target.closest("button"); if (!bt) return; sg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === bt)); pick[sg.dataset.gi] = bt.dataset.v; }));
    b.querySelector('[data-act="chk"]').onclick = () => { let ok = 0; const rows = items.map(([t, a, x], i) => { if (pick[i] === a) ok++; return `${pick[i] === a ? "✓" : "✗"} <b>${t}</b> → ${L[a]}. ${x}`; }); b.querySelector(".res").innerHTML = `<div class="readout" style="margin-top:8px">${ok}/${items.length} match the policy.<br>${rows.join("<br>")}</div>`; };
  };

  /* 31. Scaling */
  W.scaling = (el) => {
    const b = U.box(el, "Size vs performance", "Empirical scaling laws: test loss falls as a power law in parameters N (and data D, compute C). Each 10× buys a roughly constant improvement, until data runs out.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("n", "log₁₀ parameters", 7, 12, 0.1, 9)}${U.range("a", "exponent α_N", 0.03, 0.15, 0.005, 0.076)}</div><div class="plot"></div><div class="readout"></div>`);
    const draw = (s) => {
      const Nc = 8.8e13; const L = (lg) => Math.pow(Nc / Math.pow(10, lg), s.a);
      const p = U.plot({ x0: 7, x1: 12, y0: 1.5, y1: 4.5, h: 200 });
      b.querySelector(".plot").innerHTML = p.svg(p.frame([7, 8, 9, 10, 11, 12], [2, 3, 4], "log₁₀ N", "loss") + p.line(p.path(L), C1) + `<circle cx="${p.X(s.n)}" cy="${p.Y(L(s.n))}" r="6" fill="${C2}"/>`);
      b.querySelector(".readout").innerHTML = `L(N) = (N_c / N)^α · N = 10^${s.n} ≈ ${(Math.pow(10, s.n) / 1e9).toFixed(2)} B parameters → loss <b>${U.f(L(s.n), 3)}</b><br><span class="muted">Bigger models are more sample-efficient, and some abilities (multi-step arithmetic, in-context learning) appear only beyond a scale threshold ("emergent"). But compute-optimal training (Chinchilla) says parameters and tokens should grow together, about 20 tokens per parameter, and small well-trained models often beat larger under-trained ones. Benchmarks (MMLU, GSM8K, HumanEval …) are how these claims are measured, and they can be contaminated or saturated.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };
})();

    menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>',
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
    play2: '<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M7 4l13 8-13 8z"/></svg>'
  };

  /* ---------- store ---------- */
  const KEY = "genai16.v1";
  const fresh = () => ({ v: 1, topics: {}, tests: {}, mocks: {}, mistakes: {}, time: { total: 0, ctx: {}, day: {}, offline: 0 }, last: null, theme: null, started: null });
  let S = load();
  function load() {
    let s = fresh();
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const p = JSON.parse(raw); s = Object.assign(s, p); s.time = Object.assign(fresh().time, p.time || {}); }
    } catch (e) { /* storage blocked: run in memory */ }
    return s;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

  /* ---------- course index ---------- */
  const weeks = COURSE.weeks.slice().sort((a, b) => a.n - b.n);
  const topicById = {}, weekById = {}, flat = [];
  weeks.forEach((w) => {
    weekById[w.id] = w;
    w.topics.forEach((t, i) => { t.week = w; t.idx = i; topicById[t.id] = t; flat.push(t); });
  });
  const QBANK = {};   // id -> {q, src}
  weeks.forEach((w) => {
    w.topics.forEach((t) => (t.quiz || []).forEach((q, i) => { q.id = `${t.id}.q${i + 1}`; q.t = q.t || t.id; QBANK[q.id] = q; }));
    (w.test || []).forEach((q, i) => { q.id = `${w.id}.s${i + 1}`; QBANK[q.id] = q; });
  });
  const finals = (COURSE.finals || []).map((q, i) => { q.id = `f${i + 1}`; QBANK[q.id] = q; return q; });
  const MOCKS = [[], [], []];
  (function buildMocks() {
    const byWeek = {};
    finals.forEach((q) => { const wk = (topicById[q.t] && topicById[q.t].week.id) || "x"; (byWeek[wk] = byWeek[wk] || []).push(q); });
    let k = 0;
    Object.keys(byWeek).sort((a, b) => (weekById[a] ? weekById[a].n : 99) - (weekById[b] ? weekById[b].n : 99))
      .forEach((wk) => byWeek[wk].forEach((q) => { MOCKS[k % 3].push(q); k++; }));
  })();

  /* plan: planned minutes per topic + per week test + revision, packed into 2-hour sessions */
  const planItems = [];
  weeks.forEach((w) => {
    w.topics.forEach((t) => planItems.push({ kind: "topic", id: t.id, label: t.title, wk: w.n, min: t.min }));
    planItems.push({ kind: "test", id: w.id, label: `Week ${w.n} section test`, wk: w.n, min: TEST_MIN });
  });
  planItems.push({ kind: "rev", id: "rev", label: "Formula sheet + mistake book revision", wk: 13, min: REVISION_MIN });
  const plannedTotal = planItems.reduce((s, x) => s + x.min, 0);
  const sessions = [];
  (function pack() {
    let acc = 0;
    planItems.forEach((it) => {
      const k = Math.min(7, Math.floor(acc / SESSION_MIN));
      (sessions[k] = sessions[k] || []).push(it);
      acc += it.min;
    });
  })();
  weeks.forEach((w) => { w.planMin = w.topics.reduce((s, t) => s + t.min, 0) + TEST_MIN; });

  /* ---------- status helpers ---------- */
  const tState = (id) => S.topics[id] || {};
  const isDone = (id) => !!tState(id).passed;
  const testState = (wid) => S.tests[wid] || {};
  function itemDone(it) {
    if (it.kind === "topic") return isDone(it.id);
    if (it.kind === "test") return !!testState(it.id).passed;
    return !!S.revDone;
  }
  function weekProgress(w) {
    const parts = w.topics.length + 1;
    const done = w.topics.filter((t) => isDone(t.id)).length + (testState(w.id).passed ? 1 : 0);
    return done / parts;
  }
  function nextItem() { return planItems.find((it) => !itemDone(it)) || null; }
  function topicSec(id) { return (S.time.ctx["topic:" + id] || 0) + (S.time.ctx["quiz:" + id] || 0) + (S.time.ctx["video:" + id] || 0); }
  function weekSec(w) { return w.topics.reduce((s, t) => s + topicSec(t.id), 0) + (S.time.ctx["test:" + w.id] || 0); }
  function readiness() {
    const ts = weeks.map((w) => testState(w.id).best).filter((x) => x != null);
    const ms = [1, 2, 3].map((k) => (S.mocks[k] || {}).best).filter((x) => x != null);
    if (!ts.length && !ms.length) return null;
    const tAvg = ts.length ? ts.reduce((a, b) => a + b, 0) / weeks.length : 0;   // untested weeks count as 0
    const mAvg = ms.length ? Math.max(...ms) : null;
    return mAvg == null ? tAvg : 0.5 * tAvg + 0.5 * mAvg;
  }

  /* ---------- study clock ---------- */
  const T = { running: true, lastAct: Date.now(), ctx: "home", ticks: 0 };
  ["mousemove", "keydown", "scroll", "touchstart", "click", "wheel", "input"].forEach((ev) =>
    addEventListener(ev, () => { T.lastAct = Date.now(); }, { passive: true, capture: true }));
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") T.lastAct = Date.now(); else save(); });
  function addTime(ctx, sec, offline) {
    S.time.total += sec;
    S.time.ctx[ctx] = (S.time.ctx[ctx] || 0) + sec;
    const d = today(); S.time.day[d] = (S.time.day[d] || 0) + sec;
    if (offline) S.time.offline += sec;
    if (!S.started) S.started = d;
  }
  function tick() {
    const active = T.running && document.visibilityState === "visible" && Date.now() - T.lastAct < IDLE_MS;
    if (active) addTime(T.ctx, 1);
    const c = $(".clock");
    if (c) {
      c.classList.toggle("on", active);
      c.classList.toggle("idle", T.running && !active);
      $(".clock-read b", c).textContent = fmtHM(S.time.total) + " / 16:00";
      $(".clock-read span", c).textContent = !T.running ? "paused" : active ? `today ${fmtHM(S.time.day[today()] || 0)} · counting` : "idle — move to resume";
      $(".clock .iconbtn", c).innerHTML = T.running ? icon.pause : icon.play;
      $(".clock .iconbtn", c).setAttribute("aria-label", T.running ? "Pause study clock" : "Resume study clock");
    }
    const ex = $("#exam-timer"); if (ex && EXAM) examTick();
    if (++T.ticks % 15 === 0) save();
  }
  setInterval(tick, 1000);
  addEventListener("pagehide", save);

  /* ---------- theme ---------- */
  function applyTheme() {
    const r = document.documentElement;
    if (S.theme) r.setAttribute("data-theme", S.theme); else r.removeAttribute("data-theme");
    const b = $("#theme-btn");
    if (b) { b.innerHTML = S.theme === "dark" ? icon.moon : S.theme === "light" ? icon.sun : icon.auto; b.setAttribute("aria-label", "Theme: " + (S.theme || "system")); }
  }

  /* ---------- toast ---------- */
  let toastT;
  function toast(msg) {
    let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }

  /* ---------- shell ---------- */
  function shell() {
    let root = document.getElementById("app");
    if (!root) { root = document.createElement("div"); root.id = "app"; document.body.appendChild(root); }
    root.innerHTML = `
      <header class="topbar">
        <button class="iconbtn menu-btn" id="menu-btn" aria-label="Open course map">${icon.menu}</button>
        <button class="brand" id="brand" aria-label="Go to dashboard">
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--accent)"/><path d="M8 21c3-9 6-9 8 0s5 9 8 0" stroke="var(--sheet)" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="24" cy="9" r="2.6" fill="var(--hi)"/></svg>
          <span class="brand-text"><b>GenAI 16-Hour Sprint</b><span>NPTEL · IISc · Fundamentals of GenAI &amp; LLMs</span></span>
        </button>
        <div class="spacer"></div>
        <div class="clock" title="Active study time. Pauses after 4 idle minutes or when the tab is hidden.">
          <span class="clock-dot"></span>
          <span class="clock-read"><b class="num">0:00 / 16:00</b><span>today</span></span>
          <button class="iconbtn" id="clock-btn" style="width:30px;height:30px"></button>
        </div>
        <button class="iconbtn" id="theme-btn"></button>
      </header>
      <div class="shell">
        <nav class="rail" id="rail" aria-label="Course map"></nav>
        <div class="scrim" id="scrim"></div>
        <main class="main" id="main" tabindex="-1"></main>
      </div>`;
    $("#brand").onclick = () => go("home");
    $("#menu-btn").onclick = () => document.body.classList.toggle("drawer");
    $("#scrim").onclick = () => document.body.classList.remove("drawer");
    $("#clock-btn").onclick = () => { T.running = !T.running; T.lastAct = Date.now(); tick(); toast(T.running ? "Study clock running" : "Study clock paused"); };
    $("#theme-btn").onclick = () => { S.theme = S.theme == null ? "dark" : S.theme === "dark" ? "light" : null; applyTheme(); save(); rerender(); };
    applyTheme();
  }

  function ring(frac, size = 22) {
    const r = 9, c = 2 * Math.PI * r;
    return `<svg class="ring" viewBox="0 0 22 22" width="${size}" height="${size}" aria-hidden="true"><circle cx="11" cy="11" r="${r}" fill="none" stroke="var(--rule)" stroke-width="3"/><circle cx="11" cy="11" r="${r}" fill="none" stroke="${frac >= 1 ? "var(--good)" : "var(--accent)"}" stroke-width="3" stroke-dasharray="${c * frac} ${c}" transform="rotate(-90 11 11)" stroke-linecap="${frac > 0 ? "round" : "butt"}"/></svg>`;
  }

  function renderRail() {
    const rail = $("#rail"); if (!rail) return;
    const openW = VIEW.week || (VIEW.topic && topicById[VIEW.topic] && topicById[VIEW.topic].week.id);
    const nl = (v, ic, label, extra = "") => `<button class="navlink ${VIEW.name === v ? "active" : ""}" data-go="${v}">${icon[ic]}<span>${label}</span>${extra}</button>`;
    const nMist = Object.values(S.mistakes).filter((m) => !m.fixed).length;
    rail.innerHTML = `
      <div class="rail-nav">
        ${nl("home", "home", "Dashboard &amp; plan")}
        ${nl("exam", "exam", "Exam pattern &amp; strategy")}
        ${nl("formulas", "sheet", "Formula sheet")}
        ${nl("mistakes", "book", "Mistake book", nMist ? `<span class="chip bad" style="margin-left:auto">${nMist}</span>` : "")}
        ${nl("mocks", "mock", "Final mock exams")}
        ${nl("settings", "gear", "Progress backup")}
      </div>
      <h4>Course map · 12 weeks</h4>
      ${weeks.map((w) => `
        <div class="wk ${openW === w.id ? "open" : ""}" data-wk="${w.id}">
          <button class="wk-head" data-week="${w.id}" aria-expanded="${openW === w.id}">
            <span class="wk-n">W${String(w.n).padStart(2, "0")}</span><span class="wk-t">${w.title}</span>${ring(weekProgress(w))}
          </button>
          <div class="wk-topics">
            ${w.topics.map((t) => `<button class="tlink ${VIEW.topic === t.id ? "active" : ""}" data-topic="${t.id}"><span class="tick ${isDone(t.id) ? "done" : tState(t.id).read ? "read" : ""}"></span><span>${t.title}</span></button>`).join("")}
            <button class="tlink ${VIEW.name === "test" && VIEW.week === w.id ? "active" : ""}" data-test="${w.id}"><span class="tick test ${testState(w.id).passed ? "done" : ""}"></span><span>Section test</span></button>
          </div>
        </div>`).join("")}`;
    rail.onclick = (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.go) { go(b.dataset.go); closeDrawer(); }
      else if (b.dataset.week) {
        const wk = b.closest(".wk"); const open = wk.classList.toggle("open"); b.setAttribute("aria-expanded", open);
      } else if (b.dataset.topic) { go("topic", b.dataset.topic); closeDrawer(); }
      else if (b.dataset.test) { go("week", b.dataset.test); closeDrawer(); }
    };
  }
  const closeDrawer = () => document.body.classList.remove("drawer");

  /* ---------- router ---------- */
  let VIEW = { name: "home" };
  let EXAM = null;   // active timed exam
  function go(name, arg, opts = {}) {
    if (EXAM && EXAM.live && !opts.force) {
      if (!confirmLeave(name, arg)) return;
    }
    if (name !== "mock") EXAM = null;
    VIEW = { name, arg };
    if (name === "topic") { VIEW.topic = arg; VIEW.week = topicById[arg].week.id; }
    if (name === "quiz") { VIEW.topic = arg; VIEW.week = topicById[arg].week.id; }
    if (name === "week" || name === "test") VIEW.week = arg;
    T.ctx = name === "topic" ? "topic:" + arg : name === "quiz" ? "quiz:" + arg : name === "test" ? "test:" + arg : name === "mock" ? "mock:" + arg : name;
    if (name !== "home") S.last = { name, arg };
    save();
    render(opts);
  }
  function confirmLeave(name, arg) {
    const box = $("#leave-box"); if (box) { box.hidden = false; box.scrollIntoView({ block: "center" }); box.dataset.name = name; box.dataset.arg = arg || ""; }
    return false;
  }
  function rerender() { if (EXAM && EXAM.live) return; render({ keepScroll: true }); }
  function render(opts = {}) {
    const main = $("#main"); const y = scrollY;
    const v = VIEW;
    const fn = { home: viewHome, week: viewWeek, topic: viewTopic, quiz: viewQuiz, test: viewTest, mocks: viewMocks, mock: viewMock, formulas: viewFormulas, mistakes: viewMistakes, exam: viewExam, settings: viewSettings, drill: viewDrill }[v.name] || viewHome;
    main.innerHTML = "";
    fn(main, v.arg, opts);
    renderRail();
    if (opts.keepScroll) scrollTo(0, y); else { scrollTo(0, 0); main.focus({ preventScroll: true }); }
  }

  /* ---------- dashboard ---------- */
  function viewHome(main) {
    const nx = nextItem();
    const doneTopics = flat.filter((t) => isDone(t.id)).length;
    const testsPassed = weeks.filter((w) => testState(w.id).passed).length;
    const spent = S.time.total, budget = BUDGET_MIN * 60;
    const rd = readiness();
    let curSess = sessions.findIndex((s) => s.some((it) => !itemDone(it))); if (curSess < 0) curSess = 8;
    const nxLabel = nx ? (nx.kind === "topic" ? topicById[nx.id].title : nx.label) : "All plan items done — sit the mocks";
    const lastBtn = S.last && S.last.name !== "home" ? `<button class="btn ghost" id="resume">Resume where you stopped</button>` : "";
    main.innerHTML = `
      <div class="page wide">
        <section class="hero">
          <div class="card hero-main">
            <span class="eyebrow">NPTEL · IISc Bangalore · 12-week course in 16 hours</span>
            <h1>Fundamentals of Generative AI &amp; Large Language Models</h1>
            <p>Every lecture in the playlist, in teaching order, condensed into ${flat.length} short topics. Each topic opens with a puzzle, teaches the idea with interactive models, and ends with a quiz that tells you exactly what to fix. Every week ends with a section test, and three full mock exams wait at the finish line.</p>
            <div class="callout acc"><span class="eyebrow">Up next</span><div style="font:600 1.08rem var(--f-display);margin-top:4px">${nxLabel}</div>
              ${nx ? `<div class="small muted">${nx.kind === "topic" ? `Week ${nx.wk} · planned ${nx.min} min` : nx.kind === "test" ? `10 questions · pass mark 70%` : "30 min"}</div>` : ""}</div>
            <div class="row">${nx ? `<button class="btn" id="go-next">${nx.kind === "test" ? "Start section test" : nx.kind === "rev" ? "Open formula sheet" : "Start topic"}</button>` : `<button class="btn" data-nav="mocks">Go to mock exams</button>`}${lastBtn}</div>
          </div>
          <div class="card hourglass">
            <span class="eyebrow">Study clock</span>
            <div class="big-time num">${fmtHM(spent)}<small> of 16:00 h</small></div>
            <div class="bar ${spent >= budget ? "good" : ""}"><i style="width:${Math.min(100, (spent / budget) * 100)}%"></i></div>
            <div class="grid2" style="gap:10px">
              <div class="kpi"><b class="num">${doneTopics}/${flat.length}</b><span>topics mastered</span></div>
              <div class="kpi"><b class="num">${testsPassed}/12</b><span>section tests passed</span></div>
              <div class="kpi"><b class="num">${fmtHM(S.time.day[today()] || 0)}</b><span>studied today</span></div>
              <div class="kpi"><b class="num">${rd == null ? "—" : pct(rd) + "%"}</b><span>exam readiness</span></div>
            </div>
            <p class="small muted">Pace check: planned ${Math.round((planItems.filter(itemDone).reduce((s, x) => s + x.min, 0)) / 60 * 10) / 10} h of work is done; you have used ${Math.round(spent / 360) / 10} h.</p>
          </div>
        </section>

        <section class="card">
          <div class="row" style="justify-content:space-between"><div><span class="eyebrow">The 16-hour plan</span><h2 style="margin-top:4px">Eight 2-hour sessions</h2></div>
          <span class="chip">${Math.round(plannedTotal / 6) / 10} h planned · mocks are extra</span></div>
          <p class="muted small" style="margin-top:6px">Sit one session per sitting. A session is done when every topic in it has a passed quiz. Take a 5-minute break between topics.</p>
          <div class="sessions" style="margin-top:14px">
            ${sessions.map((s, i) => {
              const d = s.every(itemDone); const tops = s.filter((x) => x.kind === "topic");
              const wks = [...new Set(s.map((x) => x.wk))].filter((x) => x <= 12);
              return `<div class="sess ${i === curSess ? "cur" : ""} ${d ? "done" : ""}">
                <span class="eyebrow"><span>Session ${i + 1}</span><span>${d ? "✓ done" : i === curSess ? "now" : ""}</span></span>
                <b style="font-family:var(--f-display)">${wks.length ? "Week " + wks.join(", ") : "Revision"}</b>
                <p class="muted">${tops.slice(0, 3).map((x) => esc(strip(x.label))).join(" · ")}${tops.length > 3 ? ` +${tops.length - 3} more` : ""}${s.some((x) => x.kind === "rev") ? " · Final revision" : ""}</p>
              </div>`; }).join("")}
          </div>
        </section>

        <section>
          <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2>Course map</h2><span class="small muted">Planned minutes · your minutes · status</span></div>
          <div class="weeks">
            ${weeks.map((w) => { const ts = testState(w.id); const p = weekProgress(w);
              return `<button class="wcard" data-week="${w.id}">
                <div class="meta"><span class="eyebrow">Week ${w.n}</span>${ring(p, 26)}</div>
                <h3>${w.title}</h3>
                <span class="small muted">${w.tagline}</span>
                <div class="meta"><span class="chip num">${w.planMin} min plan · ${Math.round(weekSec(w) / 60)} used</span>
                ${ts.best != null ? `<span class="chip ${ts.passed ? "good" : "bad"}">test ${pct(ts.best)}%</span>` : `<span class="chip">${w.topics.filter((t) => isDone(t.id)).length}/${w.topics.length} topics</span>`}</div>
              </button>`; }).join("")}
          </div>
        </section>

        <section class="grid2">
          <div class="card"><span class="eyebrow">Daily study minutes · last 14 days</span><div style="margin-top:10px">${dailyChart()}</div></div>
          <div class="card"><span class="eyebrow">Time by week · plan vs actual</span><div style="margin-top:10px">${weekChart()}</div></div>
        </section>
      </div>`;
    const ng = $("#go-next", main);
    if (ng) ng.onclick = () => { if (nx.kind === "topic") go("topic", nx.id); else if (nx.kind === "test") go("test", nx.id); else go("formulas"); };
    const rs = $("#resume", main); if (rs) rs.onclick = () => go(S.last.name, S.last.arg);
    $$("[data-week]", main).forEach((b) => (b.onclick = () => go("week", b.dataset.week)));
    $$("[data-nav]", main).forEach((b) => (b.onclick = () => go(b.dataset.nav)));
  }

  function dailyChart() {
    const days = []; const d0 = new Date();
    for (let i = 13; i >= 0; i--) { const d = new Date(d0); d.setDate(d0.getDate() - i); const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; days.push([k, Math.round((S.time.day[k] || 0) / 60), d]); }
    const max = Math.max(60, ...days.map((x) => x[1])); const top = Math.ceil(max / 30) * 30;
    const W = 420, H = 170, L = 34, B = 24, bw = (W - L - 6) / 14;
    const y = (v) => H - B - (v / top) * (H - B - 10);
    let g = "";
    for (let v = 0; v <= top; v += top / 3) g += `<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-dasharray="${v ? "3 4" : ""}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`;
    g += `<line x1="${L}" x2="${W}" y1="${y(120)}" y2="${y(120)}" stroke="var(--hi)" stroke-width="1.5"/><text x="${W - 2}" y="${y(120) - 4}" text-anchor="end">2 h session</text>`;
    days.forEach(([k, m, d], i) => {
      const x = L + 3 + i * bw; const hgt = H - B - y(m);
      g += `<rect x="${x + 2}" y="${y(m)}" width="${bw - 4}" height="${Math.max(0, hgt)}" rx="3" fill="${k === today() ? "var(--accent)" : "color-mix(in srgb, var(--accent) 45%, var(--sheet))"}"><title>${k}: ${m} min</title></rect>`;
      if (i % 2 === 1 || i === 13) g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${d.getDate()}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes studied per day">${g}</svg>`;
  }
  function weekChart() {
    const W = 420, rowH = 19, H = weeks.length * rowH + 26, L = 34;
    const max = Math.max(...weeks.map((w) => Math.max(w.planMin, weekSec(w) / 60)));
    const x = (v) => L + (v / max) * (W - L - 40);
    let g = "";
    weeks.forEach((w, i) => {
      const yy = 6 + i * rowH; const act = weekSec(w) / 60;
      g += `<text x="${L - 6}" y="${yy + 11}" text-anchor="end">W${w.n}</text>`;
      g += `<rect x="${L}" y="${yy + 2}" width="${x(w.planMin) - L}" height="12" rx="3" fill="var(--sheet-2)" stroke="var(--rule)"/>`;
      g += `<rect x="${L}" y="${yy + 5}" width="${Math.max(0, x(act) - L)}" height="6" rx="3" fill="${act > w.planMin * 1.25 ? "var(--warn)" : "var(--accent)"}"/>`;
      g += `<text x="${Math.max(x(w.planMin), x(act)) + 4}" y="${yy + 11}">${Math.round(act)}/${w.planMin}</text>`;
    });
    g += `<text x="${L}" y="${H - 4}">outline = plan · bar = you · amber = 25% over</text>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutes per week, planned versus actual">${g}</svg>`;
  }

  function askHTML(a, i) {

  function wireAsk(box) {

  /* ---------- question preparation & grading ---------- */
  const NOSHUF = /(all of the above|none of the above|both|neither|all the above|only)\b/i;
  function prep(q, seed) {
    const type = Array.isArray(q.a) ? "msq" : typeof q.a === "object" ? "nat" : "mcq";
    let opts = q.o ? q.o.map((o, i) => ({ o, i })) : null;
    if (opts && !q.o.some((o) => NOSHUF.test(strip(o))) && !q.fixed) opts = shuffle(opts, seed);
    return { src: q, id: q.id, type, opts, ans: null };
  }
  function correct(p, ans) {
    const q = p.src;
    if (p.type === "nat") { const v = parseFloat(ans); if (isNaN(v)) return false; const tol = q.a.tol != null ? q.a.tol : Math.max(0.01, Math.abs(q.a.n) * 0.01); return Math.abs(v - q.a.n) <= tol + 1e-9; }
    if (p.type === "msq") { const s = new Set(ans || []); return q.a.length === s.size && q.a.every((x) => s.has(x)); }
    return ans === q.a;
  }
  function answerText(q) {
    if (Array.isArray(q.a)) return q.a.map((i) => q.o[i]).join(" + ");
    if (typeof q.a === "object") return String(q.a.n);
    return q.o[q.a];
  }
  function recordMistake(id, ok) {
    if (!ok) { const m = S.mistakes[id] || { n: 0 }; m.n++; m.t = Date.now(); m.fixed = false; S.mistakes[id] = m; }
    else if (S.mistakes[id]) S.mistakes[id].fixed = true;
  }
  function optsHTML(p, chosen, reveal) {
    if (p.type === "nat") {
      return `<div class="natbox"><input type="text" inputmode="decimal" id="nat-${p.id.replace(/\W/g, "")}" class="tinput" placeholder="Type a number" value="${chosen != null ? esc(chosen) : ""}" ${reveal ? "disabled" : ""} aria-label="Numerical answer"><span class="small muted">Numerical answer type${p.src.a.tol != null ? ` · tolerance ±${p.src.a.tol}` : ""}</span></div>`;
    }
    const multi = p.type === "msq";
    return `<div class="opts" role="${multi ? "group" : "radiogroup"}">${p.opts.map(({ o, i }, k) => {
      const sel = multi ? (chosen || []).includes(i) : chosen === i;
      let cls = sel ? "sel" : "";
      if (reveal) {
        const isAns = multi ? p.src.a.includes(i) : p.src.a === i;
        cls = isAns && sel ? "right" : sel ? "wrong" : isAns ? "missed right" : "";
      }
      return `<button class="opt ${multi ? "multi" : ""} ${cls}" data-i="${i}" ${reveal ? "disabled" : ""} role="${multi ? "checkbox" : "radio"}" aria-checked="${sel}"><span class="key">${"ABCDEFGH"[k]}</span><span>${o}</span></button>`;
    }).join("")}</div>`;
  }
  const typeLabel = (p) => (p.type === "msq" ? "Multiple select — one or more correct" : p.type === "nat" ? "Numerical answer" : "Single correct");

  function remedyFor(q) {
    const t = topicById[q.t]; if (!t) return "";
    const card = q.r != null ? t.cards[q.r] : null;
    const lecs = q.l ? [].concat(q.l) : t.lec;
    return `<div class="row">
      <button class="btn quiet small" data-jump="${t.id}" data-card="${q.r != null ? q.r : ""}">Re-read: ${card ? strip(card.h) : t.title}</button>
      ${lecs.slice(0, 2).map((n) => `<a class="btn ghost small" href="${ytLink(n)}" target="_blank" rel="noopener">${icon.play2} Lec ${n}</a>`).join("")}
    </div>`;
  }
  function wireJumps(root) {
    $$("[data-jump]", root).forEach((b) => (b.onclick = () => go("topic", b.dataset.jump, { card: b.dataset.card === "" ? null : +b.dataset.card })));
  }

  /* ---------- practice quiz (topic quiz, mistake drill) ---------- */
  function practice(main, { title, eyebrow, qs, onDone, back }) {
    const seed = Date.now() % 1e9;
    const P = shuffle(qs, seed).map((q, i) => prep(q, seed + i));
    let i = 0; const answers = []; const results = [];
    function draw() {
      const p = P[i]; const done = results[i] != null;
      main.innerHTML = `
        <div class="page">
          <div class="crumbs">${back}</div>
          <div class="quiz card">
            <div class="qhead"><div><span class="eyebrow">${eyebrow}</span><h2 style="margin-top:4px">${title}</h2></div>
              <div class="qdots" aria-hidden="true">${P.map((_, k) => `<i class="${k === i ? "cur" : results[k] === true ? "ok" : results[k] === false ? "no" : ""}"></i>`).join("")}</div></div>
            <div><span class="qtype">Question ${i + 1} of ${P.length} · ${typeLabel(p)}</span><div class="qtext" style="margin-top:6px">${p.src.q}</div></div>
            ${optsHTML(p, answers[i], done)}
            ${done ? explainHTML(p, results[i]) : ""}
            <div class="row" style="justify-content:flex-end">
              ${done ? `<button class="btn" id="next">${i === P.length - 1 ? "See my result" : "Next question"}</button>` : `<button class="btn" id="check" ${answers[i] == null || (Array.isArray(answers[i]) && !answers[i].length) ? "disabled" : ""}>Check answer</button>`}
            </div>
          </div>
        </div>`;
      wireBack(main);
      if (!done) wireOpts(main, p, (v) => { answers[i] = v; const c = $("#check"); if (c) c.disabled = v == null || v === "" || (Array.isArray(v) && !v.length); });
      const c = $("#check"); if (c) c.onclick = () => { const ok = correct(p, answers[i]); results[i] = ok; recordMistake(p.id, ok); save(); draw(); };
      const n = $("#next"); if (n) n.onclick = () => { if (i < P.length - 1) { i++; draw(); scrollTo(0, 0); } else finish(); };
      wireJumps(main);
    }
    function finish() {
      const score = results.filter(Boolean).length / P.length;
      onDone(score, P, results, answers);
    }
    draw();
  }
  function explainHTML(p, ok) {
    return `<div class="explain ${ok ? "good" : "bad"}"><b class="v">${ok ? "Correct." : "Not this time."}</b>
      ${ok ? "" : `<div><b>Answer:</b> ${answerText(p.src)}</div>`}<div>${p.src.x || ""}</div>${ok ? "" : `<div class="small"><b>Fix it:</b></div>${remedyFor(p.src)}`}</div>`;
  }
  function wireOpts(root, p, onChange) {
    if (p.type === "nat") { const inp = $(".natbox input", root); inp.oninput = () => onChange(inp.value.trim() === "" ? null : inp.value.trim()); inp.focus(); return; }
    const multi = p.type === "msq";
    let cur = multi ? [] : null;
    $$(".opt", root).forEach((b) => {
      if (b.classList.contains("sel")) { const i = +b.dataset.i; if (multi) cur.push(i); else cur = i; }
      b.onclick = () => {
        const i = +b.dataset.i;
        if (multi) { cur = cur.includes(i) ? cur.filter((x) => x !== i) : cur.concat(i); b.classList.toggle("sel"); b.setAttribute("aria-checked", b.classList.contains("sel")); }
        else { cur = i; $$(".opt", root).forEach((x) => { x.classList.toggle("sel", x === b); x.setAttribute("aria-checked", x === b); }); }
        onChange(multi ? cur.slice() : cur);
      };
    });
  }
  function wireBack(root) {
    $$("[data-nav]", root).forEach((b) => (b.onclick = () => go(b.dataset.nav)));
    $$("[data-week]", root).forEach((b) => (b.onclick = () => go("week", b.dataset.week)));

  }
  function scoreRing(frac, label) {
    const r = 58, c = 2 * Math.PI * r; const col = frac >= 0.8 ? "var(--good)" : frac >= 0.6 ? "var(--warn)" : "var(--bad)";
    return `<svg class="score-ring" viewBox="0 0 140 140" role="img" aria-label="Score ${pct(frac)} percent"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--rule)" stroke-width="12"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-dasharray="${c * frac} ${c}" transform="rotate(-90 70 70)" stroke-linecap="round"/><text x="70" y="74" text-anchor="middle">${pct(frac)}%</text><text class="sub" x="70" y="94" text-anchor="middle">${label}</text></svg>`;
  }

  function viewQuiz(main, tid) {
    const t = topicById[tid]; const w = t.week;
    practice(main, {
      title: t.title, eyebrow: `Week ${w.n} · Topic quiz`, qs: t.quiz,

      onDone(score, P, results) {

            <div class="card result-head">${scoreRing(score, `${results.filter(Boolean).length} of ${P.length}`)}
              <div><span class="eyebrow">${t.title}</span>
                <h2>${pass ? (score === 1 ? "Clean sweep. Topic mastered." : "Passed. Topic mastered.") : "Not yet. Here is the repair plan."}</h2>
                <p class="muted">${pass ? (wrong.length ? "One slip below. Read its fix once, then move on. You don't need to retake." : "Move on while the momentum is high.") : `You need ${pct(TOPIC_PASS)}% to pass. Spend about ${Math.max(4, cards.length * 3)} minutes on the cards below, then retake: the questions and options are reshuffled.`}</p>
                <div class="row">${pass ? nxt : `<button class="btn" id="retake">Retake quiz</button><button class="btn ghost" data-topicnav="${t.id}">Back to the lesson</button>`}</div>

              ${wrong.map((p) => `<div class="fix"><div><b>${strip(p.src.q).slice(0, 160)}${strip(p.src.q).length > 160 ? "…" : ""}</b></div>
                <div class="small"><b>Correct answer:</b> ${answerText(p.src)}</div><div class="small muted">${p.src.x || ""}</div>${remedyFor(p.src)}</div>`).join("")}
            </div>
            ${!pass ? `<div class="callout warn" style="margin-top:14px"><b>Study tactic:</b> close this page, explain each missed idea out loud in two sentences, then retake. If you fail twice, watch the linked lecture segment at 1.5× speed and log the time on the topic page.</div>` : ""}
            </section>` : ""}

        const tt = $("#to-test"); if (tt) tt.onclick = () => go("test", w.id);

      }
