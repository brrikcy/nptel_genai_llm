    },
    {
      id: "w3t4", title: "A full VAE forward pass, by hand", lec: [24, 25], min: 17, w: "vaeloss",
      hook: "In the lecture's example, the total loss comes out at 10.06, and almost all of it is reconstruction error. Is that a sign the VAE is broken?",
      reveal: "<p>No: the weights are random before training. Reconstruction dominates at first; training drives it down while the KL term keeps the latent space tidy. The point of the numerical example is the <b>sequence of operations</b>, which you must be able to reproduce in the exam.</p>",
      cards: [
        { h: "The recipe, layer by layer", b: `<ol><li><b>Encoder hidden layer</b>: h = ReLU(Wx + b). Input x = [5.1, 3.5, 1.4, 0.2] (4 features), 3 hidden neurons. First neuron: 5.1·0.1 + 3.5·0.4 + 1.4·(−0.7) + 0.2·0.2 + 0.1 = 1.07.</li>
          <li><b>μ head</b>: μ = W_μ h + b_μ, <i>no activation</i> (latent dimension 2 → two means).</li>
          <li><b>log σ² head</b>: log σ² = W_σ h + b_σ, <i>no activation</i>; then σ² = e^(log σ²), σ = √σ².</li>
          <li><b>Sample</b>: ε ~ N(0, 1) for each dimension; z = μ + σ·ε.</li>
          <li><b>Decoder hidden layer</b>: ReLU(W z + b).</li>
          <li><b>Decoder output</b>: linear for continuous data (sigmoid for binary). The output, the mean of p(x|z), is x̂.</li>
          <li><b>Loss</b> = MSE(x, x̂) + ½ Σ(μ² + σ² − log σ² − 1). Lecture: 9.711 + 0.352 = <b>10.063</b>.</li>
          <li><b>Backprop</b> through the reparameterisation into all weights; repeat.</li></ol>` },
        { h: "Practice the loss", b: `<p>Edit the numbers below, or use your own from a past assignment, and check every intermediate value.</p>`, w: "vaeloss" },
        { h: "From the hands-on session: a VAE in Keras", b: `<ul><li>Encoder: Conv/Dense layers → <code>Dense(latent_dim)</code> for z_mean and <code>Dense(latent_dim)</code> for z_log_var.</li><li>A custom <code>Sampling</code> layer returns <code>z_mean + tf.exp(0.5 * z_log_var) * epsilon</code>.</li><li>The decoder mirrors the encoder and ends in a sigmoid for MNIST.</li><li>Loss = BCE reconstruction (summed over pixels) + KL = <code>-0.5 * sum(1 + z_log_var − z_mean² − exp(z_log_var))</code>, which is the same formula rearranged.</li><li>With a 2-D latent, plot z_mean coloured by digit to see clusters; decode a grid of z values to see digits morph smoothly.</li></ul>`,
          ask: { q: "−½ Σ(1 + log σ² − μ² − σ²) is the same as:", o: ["½ Σ(μ² + σ² − log σ² − 1)", "Σ(μ² + σ²)", "The reconstruction loss", "−KL"], a: 0, x: "Move the minus sign inside: identical to the closed-form KL." } }
      ],
      keys: ["Order: hidden ReLU → μ, log σ² (linear) → σ² = e^(log σ²), σ = √σ² → z = μ + σε → decoder → x̂ → loss.", "No activation on the μ and log σ² heads.", "Decoder output layer: linear (continuous) or sigmoid (binary); its output is used as x̂.", "Loss = MSE (or BCE) + ½Σ(μ² + σ² − log σ² − 1); Keras writes it −½Σ(1 + log σ² − μ² − σ²)."],
      traps: ["Forgetting the bias, or applying ReLU to μ, are the classic numerical mistakes.", "Use e^(log σ²) for σ², and √ of that for σ, in z = μ + σε.", "The same input sampled twice gives different z, so different x̂."],
      quiz: [
        { q: "In the VAE forward pass, which layers get NO activation function? (Select all that apply)", o: ["The μ (mean) layer", "The log σ² layer", "The encoder hidden layer", "The decoder output layer for continuous data (linear)"], a: [0, 1, 3], x: "The encoder hidden layer uses ReLU. The μ and log σ² heads, and a linear output, apply no non-linearity.", r: 0 },
        { q: "An encoder outputs log σ² = 1.386. What is σ (2 decimals)?", a: { n: 2, tol: 0.01 }, x: "σ² = e^1.386 ≈ 4, σ = 2.", r: 0 },
        { q: "Reconstruction loss = 2.5 and KL = 0.4. The total VAE loss is:", a: { n: 2.9, tol: 0.001 }, x: "The VAE loss is the sum of the two terms.", r: 0 },
        { q: "Compute the KL term for μ = [0, 1], log σ² = [0, 0].", a: { n: 0.5, tol: 0.001 }, x: "Dimension 1: 0 + 1 − 0 − 1 = 0. Dimension 2: 1 + 1 − 0 − 1 = 1. Sum = 1; ½ × 1 = 0.5.", r: 1 },
        { q: "Passing the same input through a trained VAE twice usually gives slightly different reconstructions because:", o: ["The weights change between passes", "A new ε is drawn each time, giving a different z", "Dropout is always active", "The decoder is random"], a: 1, x: "z = μ + σε, with fresh ε each pass.", r: 0 }
      ]
    }
  ],
  test: [
    { q: "Which equation correctly relates cross-entropy, entropy and KL divergence?", o: ["H(P,Q) = H(P) − KL(P‖Q)", "H(P,Q) = H(P) + KL(P‖Q)", "KL(P‖Q) = H(P) + H(Q)", "H(P) = H(P,Q) + KL(P‖Q)"], a: 1, x: "Cross-entropy = entropy + the extra cost KL.", t: "w3t1", r: 1 },
    { q: "KL(N(0,1) ‖ N(1,1)) in nats equals:", a: { n: 0.5, tol: 0.001 }, x: "ln(1/1) + (1 + (0−1)²)/(2·1) − ½ = 0 + 1 − 0.5 = 0.5.", t: "w3t1", r: 1 },
    { q: "Reverse KL, KL(Q‖P), when fitting a simple Q to a multimodal P, tends to be:", o: ["Mode covering", "Mode seeking", "Symmetric", "Always zero"], a: 1, x: "Q avoids regions where P is small and settles into one mode.", t: "w3t1", r: 2 },
    { q: "The VAE needs an approximate posterior q_φ(z|x) because:", o: ["The prior is unknown", "The true posterior p(z|x) requires the intractable evidence p(x)", "The decoder cannot be trained", "z is discrete"], a: 1, x: "p(x) = ∫p(x|z)p(z)dz is intractable, and so is p(z|x).", t: "w3t2", r: 0 },
    { q: "Which statements about the ELBO are true? (Select all that apply)", o: ["ELBO ≤ log p(x)", "ELBO = E_q[log p(x|z)] − KL(q(z|x)‖p(z))", "Maximising the ELBO minimises the VAE loss", "The ELBO equals log p(x) when q = p(z) regardless of x"], a: [0, 1, 2], x: "The bound is tight only when q(z|x) equals the true posterior p(z|x).", t: "w3t2", r: 3 },
    { q: "When is the VAE's KL term exactly zero?", o: ["When the reconstruction is perfect", "When μ = 0 and σ² = 1 in every latent dimension", "When σ = 0", "Never"], a: 1, x: "Then q(z|x) = N(0, I) = p(z).", t: "w3t2", r: 3 },
    { q: "Using the reparameterisation trick with μ = 1.0, σ² = 0.25 and ε = −2, compute z.", a: { n: 0, tol: 0.001 }, x: "σ = 0.5; z = 1 + 0.5·(−2) = 0.", t: "w3t3", r: 2 },
    { q: "The reparameterisation trick makes the VAE trainable because:", o: ["It removes all randomness", "It expresses z as a deterministic, differentiable function of μ, σ and an independent noise ε", "It replaces the KL term", "It makes the decoder linear"], a: 1, x: "Gradients flow through μ and σ; ε is treated as a constant input.", t: "w3t3", r: 1 },
    { q: "An encoder outputs log σ² = 0.732. What is σ² (2 decimals)?", a: { n: 2.08, tol: 0.01 }, x: "e^0.732 ≈ 2.079.", t: "w3t4", r: 0 },
    { q: "In the lecture's VAE numerical example, the reconstruction is taken to be:", o: ["A random sample from p(x|z)", "The decoder's output, i.e. the mean of p(x|z)", "The encoder's μ", "The input itself"], a: 1, x: "In practice the decoder's mean output is used as x̂.", t: "w3t4", r: 0 }

COURSE.weeks.push({
  id: "w4", n: 4, title: "Advanced VAEs",
  tagline: "Disentanglement & β-VAE, conditional VAE, latent interpolation.",
  intro: "With a working VAE, this week asks how to make its latent space interpretable (β-VAE), how to control what it generates (conditional VAE), and how to move smoothly through it (interpolation). The hands-on sessions implement a VAE, a cVAE and a β-VAE. Lectures 25–30.",
  topics: [
    {
      id: "w4t1", title: "Disentangled latents and the β-VAE", lec: [26, 30], min: 17, w: "betavae",
      hook: "You have a face generator with 32 latent knobs. You turn knob 7 hoping to add a smile, and the face smiles, ages ten years and turns its head. What has gone wrong inside the latent space?",
      reveal: "<p>The latent space is <b>entangled</b>: one knob controls a mixture of factors. A <b>disentangled</b> space gives each independent factor of variation (smile, age, pose) its own knob. The β-VAE gets closer to this by weighting the KL term more heavily, at a price.</p>",
      cards: [
        { h: "Entangled vs disentangled", b: `<ul><li><b>Entangled</b>: changing one latent dimension changes several visual factors together. Hard to interpret or control.</li><li><b>Disentangled</b>: each latent dimension captures one independent generative factor (position, scale, rotation, colour, smile) and is relatively invariant to the others.</li></ul>
          <p>Why it helps: interpretability, controllable generation (edit one attribute), better transfer to downstream tasks and fairness auditing.</p>` },
        { h: "β-VAE: one extra coefficient", b: `<div class="eq">L_β = Reconstruction loss + β · KL(q_φ(z | x) ‖ N(0, I))</div>
          <ul><li><b>β = 1</b>: the standard VAE.</li><li><b>β > 1</b>: a stronger pull towards the factorised (isotropic) prior. That limits the information capacity of each latent dimension and encourages statistically independent, disentangled factors.</li><li><b>Trade-off</b>: larger β means blurrier reconstructions and possibly posterior collapse (some latents ignored).</li><li><b>β &lt; 1</b>: better reconstructions, weaker regularisation, more entanglement.</li></ul>`, w: "betavae",
          ask: { q: "Increasing β in a β-VAE generally:", o: ["Improves reconstruction sharpness", "Encourages disentanglement at the cost of reconstruction quality", "Removes the KL term", "Makes the model discriminative"], a: 1, x: "That is the central β-VAE trade-off." } },
        { h: "Latent traversals: how you check disentanglement", b: `<p>Encode an image, then vary <b>one</b> latent dimension across a range (−3 … +3) while keeping the others fixed, and decode each step. In a disentangled model the row of images changes along a single factor. The hands-on session plots exactly these traversals for VAE and β-VAE.</p>` }
      ],
      keys: ["Disentangled: each latent dimension ↔ one independent factor of variation.", "β-VAE loss = recon + β·KL; β = 1 is the plain VAE.", "β > 1 → more disentanglement, blurrier reconstructions; too large → posterior collapse.", "Latent traversal: vary one dimension, keep the others fixed, decode."],
      traps: ["β multiplies the KL term, not the reconstruction term.", "Disentanglement does not mean better reconstruction; it usually means worse.", "β < 1 weakens the regulariser."],
      quiz: [
        { q: "The β-VAE objective modifies the standard VAE loss by:", o: ["Multiplying the reconstruction term by β", "Multiplying the KL term by β", "Adding a discriminator", "Removing the encoder"], a: 1, x: "L = recon + β·KL.", r: 1 },
        { q: "A latent space in which each dimension controls exactly one generative factor is called:", o: ["Entangled", "Disentangled", "Overcomplete", "Collapsed"], a: 1, x: "Disentangled factors are independent and interpretable.", r: 0 },
        { q: "Which are effects of setting β much larger than 1? (Select all that apply)", o: ["Stronger pressure towards the factorised prior", "More disentangled latent factors", "Sharper reconstructions", "Higher risk of some latents being ignored (posterior collapse)"], a: [0, 1, 3], x: "Reconstructions become blurrier, not sharper.", r: 1 },
        { q: "Reconstruction loss 3.0, KL 0.8, β = 4. The β-VAE loss is:", a: { n: 6.2, tol: 0.001 }, x: "3.0 + 4 × 0.8 = 6.2.", r: 1 },
        { q: "To visually check whether latent dimension 3 is disentangled, you:", o: ["Retrain with a different seed", "Vary only z₃ across a range, fix the other dimensions, and decode", "Increase the batch size", "Compute the accuracy of a classifier"], a: 1, x: "This is a latent traversal.", r: 2 }
      ]
    },
    {
      id: "w4t2", title: "Conditional VAE: generate what you ask for", lec: [27, 29], min: 14,
      hook: "Your trained MNIST VAE generates beautiful digits, but you can't ask it for a 7: it gives a random digit each time. What is the smallest change to the architecture that lets you choose the class?",
      reveal: "<p>Feed the label to the network. Concatenate a one-hot label <b>c</b> to the encoder's input <i>and</i> to the decoder's input z. That is the <b>conditional VAE</b>: at generation time, pick c = 7, sample z ~ N(0, I) and decode [z, c].</p>",
      cards: [
        { h: "Architecture", b: `<div class="eq">Encoder: q_φ(z | x, c)        Decoder: p_θ(x | z, c)        Prior: p(z) (often N(0, I), can also depend on c)</div>
          <ul><li>Condition c: a one-hot class label, an attribute vector, text, or another image.</li><li>Implementation: concatenate c to x before the encoder, and to z before the decoder.</li><li>Because the decoder already knows c, the latent z is free to capture <b>style</b> (stroke thickness, slant) instead of class identity.</li></ul>` },
        { h: "cVAE loss", b: `<div class="eq">L_cVAE = −E_{q(z|x,c)}[log p(x | z, c)] + KL(q(z | x, c) ‖ p(z | c))</div><p>The same two terms as the VAE, now everything is conditioned on c. Numerically identical to the VAE example, except the input vector is longer by the size of c.</p>
          <p>Generation: choose c, sample z ~ N(0, I), decode [z ; c]. Keep z fixed and change c to get <b>the same handwriting style rendered as different digits</b>.</p>`,
          ask: { q: "In a cVAE, where is the condition c fed in?", o: ["Only the encoder", "Only the decoder", "Both encoder and decoder", "Only the loss"], a: 2, x: "Both: q(z|x, c) and p(x|z, c)." } },
        { h: "Where conditional generation is used", b: `<ul><li>Class-controlled digit or face generation.</li><li>Attribute editing (glasses on/off).</li><li>Structured prediction, e.g. predicting several plausible future frames given the past.</li><li>Data augmentation for minority classes.</li></ul><p>The same idea of conditioning by concatenating a label returns in conditional GANs (Week 6) and in text-conditioned diffusion (Week 8).</p>` }
      ],
      keys: ["cVAE: encoder q(z|x, c), decoder p(x|z, c); c is usually one-hot and concatenated.", "Loss = reconstruction + KL(q(z|x,c) ‖ p(z|c)).", "Generation: choose c, sample z ~ N(0, I), decode [z, c].", "With the class supplied, z captures style; fix z and vary c to keep the style."],
      traps: ["The decoder must receive c, or you cannot control the output at generation time.", "The encoder is not used at generation time.", "Conditioning on c does not remove the KL term."],
      quiz: [
        { q: "In a conditional VAE for MNIST with a 10-class one-hot label and a 784-pixel image, the encoder input has dimension:", a: { n: 794, tol: 0 }, x: "784 + 10 = 794 after concatenation.", r: 0 },
        { q: "To generate a specific digit with a trained cVAE you:", o: ["Encode a random image", "Sample z ~ N(0, I), set c to the desired one-hot label, and decode [z, c]", "Train a new model per digit", "Set z to the label"], a: 1, x: "The label steers the decoder; z supplies the style.", r: 1 },
        { q: "Keeping z fixed and changing only c in a well-trained cVAE generally produces:", o: ["Identical images", "The same writing style across different digits", "Random noise", "The same digit with different styles"], a: 1, x: "z encodes style once class information is provided by c.", r: 1 },
        { q: "Which statements are true about the cVAE? (Select all that apply)", o: ["Its decoder models p(x | z, c)", "Its loss has a reconstruction term and a KL term", "It no longer needs the reparameterisation trick", "The condition can be a class label or an attribute vector"], a: [0, 1, 3], x: "Sampling z still needs the reparameterisation trick.", r: 0 }
      ]
    },
    {
      id: "w4t3", title: "Latent space interpolation", lec: [28], min: 12, w: "interp",
      hook: "Average a photo of a cat and a photo of a dog pixel by pixel and you get a ghostly double exposure. Average their VAE codes and decode, and you can get a plausible cat-dog in between. Why does one work and not the other?",
      reveal: "<p>Real images lie on a thin, curved <b>manifold</b> inside pixel space. The straight line between two pixel vectors leaves that manifold, giving ghosting. The VAE's latent space is smooth and continuous (thanks to the KL term), so the straight line between two codes stays in a region that decodes to realistic images.</p>",
      cards: [
        { h: "Linear interpolation", b: `<div class="eq">z(α) = (1 − α)·z₁ + α·z₂,   α ∈ [0, 1];   x(α) = Decoder(z(α))</div>
          <p>z₁, z₂ are the encodings (usually the means μ) of two inputs. α = 0 gives the first input, α = 1 the second, and α = 0.5 the midpoint. Decoding the sequence gives a smooth morph.</p>`, w: "interp" },
        { h: "Spherical interpolation (slerp)", b: `<p>In high dimensions, samples from N(0, I) concentrate near a shell of radius ≈ √d. The straight-line midpoint between two codes has a smaller norm, which is atypical for the prior. <b>Slerp</b> follows the great circle:</p><div class="eq">slerp(z₁, z₂; α) = sin((1−α)Ω)/sin Ω · z₁ + sin(αΩ)/sin Ω · z₂,   cos Ω = z₁·z₂ / (‖z₁‖‖z₂‖)</div>` },

        { q: "Spherical linear interpolation (slerp) is preferred in high-dimensional Gaussian latent spaces because:", o: ["It is cheaper", "It keeps interpolants at a typical norm instead of cutting through the low-density centre", "It avoids the decoder", "It works only for 2-D latents"], a: 1, x: "Gaussian mass concentrates on a shell; linear midpoints fall inside it.", r: 1 }

COURSE.weeks.push({
  id: "w5", n: 5, title: "Generative adversarial networks",
  tagline: "Generator vs discriminator, minimax loss, Nash equilibrium, DCGAN.",
  intro: "VAEs give blurry samples. GANs replace the reconstruction loss with a learned critic: a discriminator that a generator learns to fool. This week covers the architecture, the loss from first principles (exactly as derived in Lecture 33), convergence and failure modes, and DCGAN. Lectures 31–37.",
  topics: [
    {
      id: "w5t1", title: "Why GANs? Two networks in a contest", lec: [31, 32], min: 19,
      hook: "A forger paints fake banknotes; a bank inspector tries to catch them. Neither ever sees the other's methods, only whether the fakes were caught. If both keep improving, what do the fakes look like in the end?",
      reveal: "<p>Indistinguishable from real notes, and the inspector is reduced to guessing (50% right). That is a GAN: the <b>generator</b> is the forger, the <b>discriminator</b> is the inspector, and training ends at an equilibrium where D(x) = ½ everywhere.</p>",
      cards: [
        { h: "Why not just use a VAE?", b: `<ul><li>VAE samples tend to be <b>blurry</b>: pixel-wise MSE/BCE reconstruction averages over plausible outputs, and the KL term limits detail.</li><li>The VAE optimises a lower bound (ELBO), not realism.</li><li>A GAN never compares pixels with a target. Its loss is a <b>learned</b> judgement of “real or fake”, so it can reward sharp, realistic detail.</li></ul>` },
        { h: "The architecture", b: `<div class="eq">z ~ p_z (noise, e.g. N(0, I))  →  Generator G_φ  →  x_fake = G(z)
          D_θ(x) ∈ (0, 1): probability that x is REAL, for real x ~ p_data and fake G(z)</div>
          <ul><li><b>Generator</b>: maps random noise to a sample; it never sees real data directly, only gradients through D.</li><li><b>Discriminator</b>: a binary classifier (sigmoid output). Real samples are labelled y = 1, generated samples y = 0.</li><li>Both are neural networks (MLPs for vanilla GAN, CNNs for DCGAN).</li></ul>` },
        { h: "Alternating training", b: `<ol><li><b>Train D</b> (G frozen): take a mini-batch of real x (label 1) and fakes G(z) (label 0). Minimise BCE, update θ.</li><li><b>Train G</b> (D frozen): generate G(z), pass it through D, and update φ so that D labels the fakes as real. The gradient flows <i>through</i> D into G, but only G's weights change.</li><li>Repeat. Often k discriminator steps per generator step.</li></ol>
          <p>The lecture walks through the forward pass, the generator loss and backward pass, and the discriminator loss and backward pass, as separate stages.</p>`,
          ask: { q: "When the generator is updated, the discriminator's weights are:", o: ["Also updated", "Frozen", "Re-initialised", "Doubled"], a: 1, x: "Gradients pass through D, but only G's parameters change." } }
      ],
      keys: ["G: noise z → fake sample. D: sample → probability of being real (sigmoid).", "Labels: real = 1, fake = 0 for D.", "Training alternates: update D with G frozen, then G with D frozen.", "GANs replace pixel reconstruction losses with a learned adversary, which gives sharper samples than VAEs."],
      traps: ["G never sees real images; it learns only through D's gradients.", "D outputs the probability that the input is REAL.", "Adversarial means opposite objectives, not malicious inputs."],
      quiz: [
        { q: "The input to a GAN generator is:", o: ["A real image", "A random noise vector z", "The discriminator's output", "A class label only"], a: 1, x: "z is sampled from a simple prior such as N(0, I) or Uniform.", r: 1 },
        { q: "When training the discriminator, generated samples are labelled:", o: ["1", "0", "0.5", "With their class index"], a: 1, x: "Real = 1, fake = 0.", r: 1 },
        { q: "A key motivation for GANs over VAEs is that VAE samples tend to be:", o: ["Too sharp", "Blurry", "Discrete", "Always identical"], a: 1, x: "Pixel-wise likelihood losses average over possibilities.", r: 0 },
        { q: "Which statements about GAN training are true? (Select all that apply)", o: ["D and G are updated alternately", "D is frozen while G is updated", "G receives gradients through D", "G is trained to minimise D's accuracy on real images"], a: [0, 1, 2], x: "G cannot affect D's output on real images; it only tries to make D call its fakes real.", r: 2 }
      ]
    },
    {
      id: "w5t2", title: "The GAN objective, derived step by step", lec: [33], min: 21, w: "ganloss",
      hook: "The discriminator is just a binary classifier trained with binary cross-entropy. Start from BCE, plug in y = 1 for real and y = 0 for fake, and you get the famous min-max equation. Try it before reading on.",
      reveal: "<p>BCE = −[y log ŷ + (1−y) log(1−ŷ)]. Real (y = 1, ŷ = D(x)) gives <b>−log D(x)</b>. Fake (y = 0, ŷ = D(G(z))) gives <b>−log(1 − D(G(z)))</b>. Add them, flip the sign, average over batches: V(D, G) = E[log D(x)] + E[log(1 − D(G(z)))]. D maximises V; G minimises it.</p>",
      cards: [
        { h: "Discriminator loss from BCE", b: `<div class="eq">Real sample (y = 1):  L_real = −log D_θ(x)</div><div class="eq">Fake sample (y = 0):  L_fake = −log(1 − D_θ(G_φ(z)))</div><div class="eq">L_D = L_real + L_fake = −[log D(x) + log(1 − D(G(z)))]</div>
          <p>Minimising L_D over θ is the same as <b>maximising</b> V_D = log D(x) + log(1 − D(G(z))). Over a mini-batch this becomes an expectation:</p>
          <div class="eq">max_θ  V(θ; φ) = E_{x~p_data}[log D_θ(x)] + E_{z~p_z}[log(1 − D_θ(G_φ(z)))]</div>
          <p>The semicolon notation V(θ; φ) means only θ is optimised while φ is held fixed.</p>` },
        { h: "Why D pushes D(x) → 1 and D(G(z)) → 0", b: `<div class="tablewrap"><table><tr><th>D(x) on a real image</th><th>log D(x)</th></tr><tr><td>0.1 (bad)</td><td>−2.303</td></tr><tr><td>0.5</td><td>−0.693</td></tr><tr><td>0.9 (good)</td><td>−0.105</td></tr><tr><td>1 (maximum)</td><td>0</td></tr></table></div>
          <p>log D(x) increases towards its maximum 0 as D(x) → 1. Likewise log(1 − D(G(z))) is maximised (→ 0) as D(G(z)) → 0. So maximising V makes D say 1 for real and 0 for fake.</p>`, w: "ganloss" },
        { h: "The generator's side, and the min-max game", b: `<p>The first term, E[log D(x)], does not depend on φ, so the generator only affects the second term and wants D(G(z)) → 1, which drives log(1 − D(G(z))) → −∞:</p>
          <div class="eq">min_φ  E_{z}[log(1 − D_θ(G_φ(z)))]</div><div class="eq">Together:  min_G max_D  V(D, G) = E_{x~p_data}[log D(x)] + E_{z~p_z}[log(1 − D(G(z)))]</div>
          <p><b>Non-saturating trick</b> (used in practice): early in training D easily rejects fakes (D(G(z)) ≈ 0), and log(1 − D(G(z))) is flat there, so G gets tiny gradients. Instead G <b>maximises log D(G(z))</b>, i.e. minimises −log D(G(z)), which has strong gradients exactly when G is losing.</p>`,
          ask: { q: "D(G(z)) = 0.1. What is log(1 − D(G(z))) (natural log)?", o: ["−0.105", "−2.303", "−0.693", "0"], a: 0, x: "ln(0.9) = −0.105." } }
      ],
      keys: ["L_D = −log D(x) − log(1 − D(G(z))), straight from BCE with y = 1 and y = 0.", "V(D,G) = E[log D(x)] + E[log(1 − D(G(z)))]; D maximises, G minimises: min_G max_D V.", "D wants D(x) → 1 and D(G(z)) → 0; G wants D(G(z)) → 1.", "The first term doesn't depend on G.", "Non-saturating generator loss: minimise −log D(G(z)) for stronger early gradients."],
      traps: ["ln(0.1) = −2.303, ln(0.5) = −0.693, ln(0.9) = −0.105: memorise these.", "Minimising −V is maximising V; watch the signs.", "The generator objective in the original minimax form saturates early in training."],
      quiz: [
        { q: "Starting from BCE, the discriminator loss on a single real sample is:", o: ["−log(1 − D(x))", "−log D(x)", "log D(x)", "−log D(G(z))"], a: 1, x: "y = 1 kills the second BCE term, leaving −log D(x).", r: 0 },
        { q: "Compute the discriminator loss L_D = −log D(x) − log(1 − D(G(z))) for D(x) = 0.9 and D(G(z)) = 0.2 (natural logs, 3 decimals).", a: { n: 0.329, tol: 0.003 }, x: "−ln 0.9 − ln 0.8 = 0.105 + 0.223 = 0.329.", r: 0 },
        { q: "In min_G max_D V(D, G), which term of V does the generator influence?", o: ["E[log D(x)] only", "E[log(1 − D(G(z)))] only", "Both terms", "Neither"], a: 1, x: "Real data does not depend on G.", r: 2 },
        { q: "Why is the non-saturating generator loss −log D(G(z)) used in practice?", o: ["It is symmetric", "log(1 − D(G(z))) has very small gradients when D confidently rejects fakes early in training", "It removes the need for a discriminator", "It makes D linear"], a: 1, x: "−log D(G(z)) is steep exactly when D(G(z)) ≈ 0.", r: 2 },
        { q: "As D(x) on real images rises from 0.1 to 0.9, the value log D(x):", o: ["Decreases from −0.105 to −2.303", "Increases from −2.303 to −0.105", "Stays at 0", "Becomes positive"], a: 1, x: "log is increasing; its maximum on (0,1] is 0 at D(x) = 1.", r: 1 }
      ]
    },
    {
      id: "w5t3", title: "Convergence, Nash equilibrium and failure modes", lec: [34], min: 15, w: "gan1d",
      hook: "At the end of perfect GAN training, the discriminator outputs exactly 0.5 for every image. Is that a broken discriminator, or a sign of success?",
      reveal: "<p>Success. If p_g = p_data, no classifier can do better than chance, so the optimal discriminator is D*(x) = ½. This point, where neither player can improve by changing only its own strategy, is the <b>Nash equilibrium</b> of the game.</p>",
      cards: [
        { h: "The optimal discriminator", b: `<div class="eq">For a fixed G:  D*(x) = p_data(x) / (p_data(x) + p_g(x))</div>
          <div class="eq">V(D*, G) = −log 4 + 2 · JSD(p_data ‖ p_g)</div>
          <ul><li>So training G against an optimal D minimises the <b>Jensen–Shannon divergence</b> (JSD ≥ 0, symmetric, maximum log 2).</li><li>The global minimum is reached when p_g = p_data: then D* = ½ everywhere and V = −log 4 ≈ −1.386.</li></ul>`, w: "gan1d" },
        { h: "Nash equilibrium", b: `<p>A pair (G*, D*) where neither player can lower its own cost by changing only its own parameters. For GANs: p_g = p_data and D(x) = ½. In practice simultaneous gradient descent on a min-max game need not converge: it can oscillate around the equilibrium.</p>`,
          ask: { q: "At the GAN's global optimum, D(x) for any input equals:", o: ["0", "1", "0.5", "It depends on x"], a: 2, x: "p_g = p_data ⇒ D* = p/(p + p) = ½." } },
        { h: "What goes wrong in practice", b: `<ul><li><b>Mode collapse</b>: G produces only a few kinds of samples (e.g. only 1s and 7s) because they reliably fool D. Low diversity.</li><li><b>Vanishing gradients</b>: if D becomes too good, D(G(z)) ≈ 0 and the minimax generator loss saturates. When the supports of p_g and p_data barely overlap, the JSD is stuck at log 2 and gives no useful gradient.</li><li><b>Non-convergence / oscillation</b>: the two players chase each other.</li><li><b>Sensitivity to hyperparameters</b> and to the balance between D and G.</li></ul>
          <p>Remedies: the non-saturating loss, DCGAN architecture rules, label smoothing, minibatch discrimination, and Wasserstein GAN (Earth-Mover distance with a 1-Lipschitz critic, via weight clipping or a gradient penalty).</p>` }
      ],
      keys: ["D*(x) = p_data/(p_data + p_g).", "With D*, G minimises JSD: V = −log 4 + 2·JSD; global optimum p_g = p_data, D* = ½, V = −log 4.", "Nash equilibrium: neither player can improve unilaterally.", "Failure modes: mode collapse, vanishing gradients, oscillation/non-convergence.", "Fixes: non-saturating loss, DCGAN design, WGAN (Wasserstein distance, 1-Lipschitz critic)."],
      traps: ["Mode collapse is low diversity, not low quality.", "JSD is symmetric; KL is not.", "D = ½ at equilibrium does not mean D is untrained."],
      quiz: [
        { q: "For a fixed generator, the optimal discriminator is:", o: ["D*(x) = p_g(x) / p_data(x)", "D*(x) = p_data(x) / (p_data(x) + p_g(x))", "D*(x) = ½ always", "D*(x) = p_data(x)"], a: 1, x: "Derived by maximising V pointwise.", r: 0 },
        { q: "With an optimal discriminator, the GAN generator objective is equivalent to minimising:", o: ["KL(p_g ‖ p_data)", "Jensen–Shannon divergence between p_data and p_g", "Mean squared error", "Total variation only"], a: 1, x: "V(D*, G) = −log 4 + 2·JSD.", r: 0 },
        { q: "At the global optimum, the value V(D*, G*) equals (natural log, 3 decimals):", a: { n: -1.386, tol: 0.002 }, x: "−log 4 = −1.386.", r: 0 },
        { q: "A GAN trained on MNIST generates only the digits 1 and 7, but very realistically. This is:", o: ["Overfitting", "Mode collapse", "Vanishing gradients", "Posterior collapse"], a: 1, x: "The generator covers only a few modes of the data distribution.", r: 2 },
        { q: "Which are recognised GAN training problems? (Select all that apply)", o: ["Mode collapse", "Vanishing generator gradients when D is too strong", "Oscillation instead of convergence", "Guaranteed convergence in one epoch"], a: [0, 1, 2], x: "GANs are notoriously unstable; convergence is never guaranteed.", r: 2 }
      ]
    },
    {
      id: "w5t4", title: "DCGAN and the hands-on GANs", lec: [35, 36, 37], min: 15,
      hook: "Swap the MLPs inside a GAN for CNNs and training often blows up. DCGAN found a handful of architectural rules that made convolutional GANs train reliably. Guess one: what replaces max pooling?",
      reveal: "<p><b>Strided convolutions</b> in the discriminator (learned down-sampling) and <b>fractionally-strided (transposed) convolutions</b> in the generator (learned up-sampling). No pooling, no fully connected hidden layers, and batch normalisation almost everywhere.</p>",
      cards: [
        { h: "DCGAN guidelines (Radford et al., 2015)", b: `<ul><li>Replace pooling with <b>strided convolutions</b> (D) and <b>transposed convolutions</b> (G).</li><li>Use <b>batch normalisation</b> in both networks, except the generator's output layer and the discriminator's input layer.</li><li>Remove fully connected hidden layers.</li><li>Generator: <b>ReLU</b> in hidden layers, <b>tanh</b> at the output (images scaled to [−1, 1]).</li><li>Discriminator: <b>LeakyReLU</b> (slope 0.2) everywhere, sigmoid output.</li><li>Adam with learning rate 0.0002 and β₁ = 0.5.</li></ul>
          <p>Generator shape flow: z (100) → project and reshape 4×4×1024 → 8×8×512 → 16×16×256 → 32×32×128 → 64×64×3.</p>`,
          ask: { q: "DCGAN's generator output activation is:", o: ["Sigmoid", "Softmax", "Tanh", "LeakyReLU"], a: 2, x: "Images are scaled to [−1, 1] to match tanh." } },
        { h: "Transposed convolution output size", b: `<div class="eq">output = (n − 1)·s − 2p + f   (+ output_padding)</div><p>Example: n = 4, f = 4, s = 2, p = 1 → (3)·2 − 2 + 4 = 8. Each DCGAN generator block doubles the spatial size this way.</p>` },
        { h: "Hands-on: vanilla GAN and DCGAN on MNIST", b: `<ul><li>Vanilla GAN: MLP generator (z → 256 → 512 → 784, tanh) and MLP discriminator (784 → 512 → 256 → 1, sigmoid), LeakyReLU in D.</li><li>Training loop per batch: (1) D step on real (label 1) and fake (label 0) with BCE; (2) G step: generate fakes, label them 1 (non-saturating), back-propagate through the frozen D.</li><li>Monitor D loss, G loss, and sample grids every few epochs. The losses do not steadily fall as in a classifier; they balance and oscillate.</li><li>DCGAN version: Conv2DTranspose generator and Conv2D discriminator, giving visibly sharper digits.</li></ul>` }

COURSE.weeks.push({

        { q: "Which statements about CycleGAN are true? (Select all that apply)", o: ["It uses two adversarial losses", "It uses a cycle-consistency loss in both directions", "It can use an identity loss to preserve colour", "It requires the same scene photographed in both domains"], a: [0, 1, 2], x: "It specifically does not need paired scenes.", r: 1 }

    {
      id: "w6t4", title: "StyleGAN and StyleGAN2", lec: [41, 42], min: 18,
      hook: "Older GANs feed the noise vector in at the first layer and hope for the best. StyleGAN feeds the first layer a constant, the same for every image. So where does each face's identity come from?",
      reveal: "<p>From <b>styles</b> injected at every layer. The noise z goes through a mapping network to w, and w modulates each layer's features via AdaIN. Coarse layers control pose and face shape; fine layers control colour and micro-texture. Separate per-pixel noise adds stochastic detail such as hair strands and freckles.</p>",
      cards: [
        { h: "StyleGAN's style-based generator", b: `<ul><li><b>Mapping network</b>: an 8-layer MLP maps z ∈ Z to an intermediate latent w ∈ W (512-d). W is less entangled than Z because it does not have to follow a fixed Gaussian shape.</li><li><b>Synthesis network</b>: starts from a <b>learned constant</b> 4×4×512 tensor and upsamples to 1024×1024.</li><li><b>AdaIN</b> (adaptive instance normalisation) at each layer: AdaIN(x_i, y) = y_s,i · (x_i − μ(x_i))/σ(x_i) + y_b,i, where (y_s, y_b) come from a learned affine transform of w.</li><li><b>Noise inputs</b>: per-layer Gaussian noise for stochastic variation.</li><li>Built on <b>progressive growing</b> (from ProGAN).</li></ul>` },
        { h: "Control at every scale", b: `<div class="tablewrap"><table><tr><th>Layers (resolution)</th><th>Controls</th></tr><tr><td>Coarse (4² – 8²)</td><td>Pose, face shape, glasses, hairstyle</td></tr><tr><td>Middle (16² – 32²)</td><td>Facial features, eyes open/closed</td></tr><tr><td>Fine (64² – 1024²)</td><td>Colour scheme, micro-structure</td></tr></table></div>
          <p><b>Style mixing</b>: use w₁ for the coarse layers and w₂ for the fine layers to mix two faces. The <b>truncation trick</b> (w′ = w̄ + ψ(w − w̄), ψ &lt; 1) trades diversity for quality.</p>`,
          ask: { q: "In StyleGAN, the synthesis network's very first input is:", o: ["The noise vector z", "A learned constant tensor", "The intermediate latent w", "A real image"], a: 1, x: "Styles from w arrive through AdaIN at every layer instead." } },
        { h: "StyleGAN2: fixing the artifacts", b: `<ul><li><b>Water-droplet artifacts</b>: blob-like spots caused by AdaIN normalising each feature map's mean and variance separately; the generator learned to sneak signal strength past the normalisation via a localised spike.</li><li><b>Fix: weight modulation and demodulation</b>. Instead of normalising activations, scale the convolution weights by the style (modulate), then normalise the weights to unit expected output variance (demodulate). The droplets disappear.</li><li><b>Phase artifacts</b> (features like teeth staying fixed while the face turns) came from progressive growing, which StyleGAN2 replaces with skip / residual generator and discriminator architectures.</li><li>Also: <b>path-length regularisation</b> (a fixed step in w gives a fixed-magnitude change in the image, for a smoother latent space) and lazy regularisation.</li></ul>` }

        { q: "In StyleGAN, styles applied at coarse resolutions (4×4 to 8×8) mainly control:", o: ["Freckles and hair strands", "Colour scheme", "Pose and overall face shape", "Background noise only"], a: 2, x: "Coarse layers determine global structure.", r: 1 },
        { q: "Which are StyleGAN2 changes? (Select all that apply)", o: ["Weight demodulation", "Removing progressive growing", "Path-length regularisation", "Replacing the mapping network with a VAE encoder"], a: [0, 1, 2], x: "The mapping network is kept.", r: 2 }

  test: [

    { q: "Which tasks suit CycleGAN better than Pix2Pix? (Select all that apply)", o: ["Photo ↔ Monet painting style", "Horse ↔ zebra", "Edges → photo when paired data is available", "Summer ↔ winter landscapes"], a: [0, 1, 3], x: "When paired data exists, Pix2Pix is the natural choice.", t: "w6t3", r: 2 },

    { q: "StyleGAN2's 'phase artifacts' (e.g. teeth not following head pose) were attributed to:", o: ["AdaIN", "Progressive growing", "The mapping network", "Weight demodulation"], a: 1, x: "StyleGAN2 replaced progressive growing with skip / residual architectures.", t: "w6t4", r: 2 }

COURSE.weeks.push({
  id: "w7", n: 7, title: "Diffusion models I",
  tagline: "Forward noising, Gaussians, DDPM forward and reverse, training objective.",
  intro: "Diffusion models learn to create by learning to clean. Destroy images with Gaussian noise in many small steps (forward), then train a network to undo one step at a time (reverse). This week covers the intuition, the probability toolkit, and the DDPM forward and reverse processes with their training objective. Lectures 44–48.",
  topics: [
    {
      id: "w7t1", title: "Diffusion: create by learning to clean", lec: [44], min: 16,
      hook: "Drop ink into water and it spreads until the glass is uniformly cloudy. Run the film backwards and the ink gathers into a drop. Physics says the reverse never happens on its own. Why might a neural network be able to learn it anyway?",
      reveal: "<p>Because each forward step adds only a <b>tiny</b> amount of Gaussian noise, so undoing a single step is a simple, nearly Gaussian problem a network can learn. Chain a thousand learned small reversals and pure noise turns back into an image. That is a diffusion model.</p>",
      cards: [
        { h: "Two processes", b: `<div class="tablewrap"><table><tr><th></th><th>Forward (diffusion)</th><th>Reverse (denoising)</th></tr>
          <tr><td>Direction</td><td>x₀ (clean) → x_T (≈ pure noise)</td><td>x_T ~ N(0, I) → x₀</td></tr><tr><td>Written as</td><td>q(x_t | x_(t−1))</td><td>p_θ(x_(t−1) | x_t)</td></tr><tr><td>Learned?</td><td>No: fixed, predefined Gaussian noise addition</td><td>Yes: a neural network (θ = its weights) predicts the noise</td></tr><tr><td>Role</td><td>Creates training targets</td><td>Generates new data</td></tr></table></div>
          <p>T is typically 1,000 steps. Each step adds a small amount of noise according to a <b>noise schedule</b>.</p>` },
        { h: "Why diffusion won image generation", b: `<ul><li><b>High-quality, diverse samples</b>, competitive with or better than GANs.</li><li><b>Stable training</b>: a simple regression loss (predict the noise); no adversarial game, no mode collapse.</li><li>A principled likelihood-based foundation (related to VAEs: a diffusion model is like a hierarchical VAE with a fixed encoder).</li><li><b>Drawback</b>: slow sampling, because generation runs the network once per step (hundreds to a thousand passes). DDIM and latent diffusion reduce the cost.</li></ul>`,
          ask: { q: "Compared with GANs, diffusion models are known for:", o: ["Unstable adversarial training", "Stable training but slow, iterative sampling", "One-step generation", "Needing paired data"], a: 1, x: "A simple MSE loss gives stable training; sampling needs many network evaluations." } },
        { h: "The three-model comparison you should be able to recite", b: `<div class="tablewrap"><table><tr><th></th><th>VAE</th><th>GAN</th><th>Diffusion</th></tr><tr><td>Sample quality</td><td>Blurry</td><td>Sharp</td><td>Sharp</td></tr><tr><td>Diversity / mode coverage</td><td>Good</td><td>Mode collapse risk</td><td>Good</td></tr><tr><td>Training</td><td>Stable (ELBO)</td><td>Unstable (min-max)</td><td>Stable (noise MSE)</td></tr><tr><td>Sampling speed</td><td>Fast (one pass)</td><td>Fast (one pass)</td><td>Slow (many steps)</td></tr></table></div>` }
      ],
      keys: ["Forward process q(x_t | x_(t−1)): fixed Gaussian noise addition, nothing learned.", "Reverse process p_θ(x_(t−1) | x_t): learned denoising network.", "T ≈ 1000 steps; x_T ≈ N(0, I).", "Pros: quality, diversity, stable training. Con: slow sampling."],
      traps: ["θ appears only in the reverse process.", "The forward process destroys data; generation runs the reverse process.", "'Diffusion' does not mean the model diffuses pixels spatially."],
      quiz: [
        { q: "Which process in a diffusion model contains learnable parameters?", o: ["The forward process", "The reverse (denoising) process", "Both", "Neither"], a: 1, x: "The forward process is a fixed Gaussian corruption.", r: 0 },
        { q: "Starting from pure Gaussian noise and producing an image corresponds to:", o: ["The forward process", "The reverse process", "The encoder", "The discriminator"], a: 1, x: "Generation = iteratively denoising x_T.", r: 0 },
        { q: "Which are advantages of diffusion models over GANs? (Select all that apply)", o: ["Stable training", "Good mode coverage / diversity", "Faster sampling", "No adversarial min-max game"], a: [0, 1, 3], x: "Sampling is slower because it is iterative.", r: 1 },
        { q: "The typical number of diffusion steps T used in DDPM is about:", o: ["1", "10", "1000", "1,000,000"], a: 2, x: "DDPM used T = 1000.", r: 0 }
      ]
    },
    {
      id: "w7t2", title: "Maths toolkit: Gaussians, covariance, Markov chains", lec: [45], min: 16,
      hook: "Your dataset has height and weight for four people. Height goes up, weight goes up. How would you capture “they move together” in one number, and why would a model of million-pixel images care?",
      reveal: "<p>That number is the <b>covariance</b>. Pixels in an image are correlated just like height and weight, so modelling images needs <b>multivariate</b> Gaussians with a covariance matrix. Diffusion models use the simplest version: an isotropic covariance σ²I.</p>",
      cards: [
        { h: "Gaussian refresher", b: `<div class="eq">N(x; μ, σ²) = 1/√(2πσ²) · exp(−(x − μ)² / (2σ²))</div>
          <ul><li>μ: mean (centre). σ²: variance (spread). σ: standard deviation.</li><li>68% / 95% / 99.7% of the mass lies within μ ± 1σ / 2σ / 3σ.</li><li>The factor 1/√(2πσ²) normalises the total probability to 1; the exponential makes the density fall off with distance from the mean.</li><li><b>Standard Gaussian</b>: N(0, 1), mean 0 and variance 1.</li></ul>` },
        { h: "Multivariate Gaussians and covariance", b: `<div class="eq">N(x; μ, Σ) with x, μ ∈ ℝ^d, Σ = d × d covariance matrix</div>

        { h: "Predict the noise", b: `<div class="eq">μ_θ(x_t, t) = (1/√α_t) · ( x_t − (β_t / √(1 − ᾱ_t)) · ε_θ(x_t, t) )</div>

COURSE.weeks.push({

  topics: [
    {
      id: "w8t1", title: "The U-Net denoiser", lec: [49], min: 16, w: "unet",

      reveal: "<p>The <b>U-Net</b>: an encoder that shrinks the image to capture global context, a decoder that grows it back, and <b>skip connections</b> that hand fine detail straight across. Same input and output size, global and local information at once.</p>",
      cards: [
        { h: "Anatomy", b: `<ul><li><b>Encoder (down) blocks</b>: residual convolution blocks, normalisation (GroupNorm), downsampling. Resolution goes down, channels go up.</li><li><b>Bottleneck</b>: lowest resolution, widest; usually includes <b>self-attention</b> so distant regions can coordinate.</li><li><b>Decoder (up) blocks</b>: upsampling plus concatenation with the matching encoder features (<b>skip connections</b>), then residual blocks.</li><li><b>Output</b>: ε̂_θ(x_t, t), the same shape as x_t.</li></ul>`, w: "unet" },

          <p>The noise level differs hugely between t = 10 and t = 900. The <b>sinusoidal time embedding</b> (the same trick as transformer positional encodings) tells every block how much noise to expect, so one set of weights handles all timesteps.</p>`,
          ask: { q: "Why does the diffusion U-Net need a time embedding?", o: ["To speed up training", "So a single network knows the noise level of x_t and can denoise any step", "To replace skip connections", "To encode the text prompt"], a: 1, x: "Without t the network could not tell how much noise to remove." } },

      reveal: "<p>That nudge is <b>guidance</b>. Classifier guidance gets the direction from a separate classifier's gradient. Classifier-free guidance gets it by comparing the model's own conditional and unconditional predictions, and then extrapolating with a guidance scale w.</p>",
      cards: [
        { h: "Conditional diffusion", b: `<p>Give the denoiser the condition: ε_θ(x_t, t, y), where y is a class label or a text embedding. That alone works, but samples often follow the condition only loosely. Guidance strengthens it.</p>` },
        { h: "Classifier guidance", b: `<div class="eq">∇_{x_t} log p(x_t | y) = ∇_{x_t} log p(x_t) + ∇_{x_t} log p(y | x_t)</div>

    {
      id: "w8t3", title: "Stable Diffusion: diffusion in latent space", lec: [52, 53], min: 18,
      hook: "Running a 1,000-step diffusion directly on 512×512×3 images means pushing ~786,000 numbers through a big U-Net a thousand times. What if you first compressed every image 48-fold, and diffused there instead?",
      reveal: "<p>That is <b>latent diffusion</b>. A pre-trained autoencoder maps 512×512×3 to a 64×64×4 latent (8× smaller per side). Diffusion and denoising happen in that small space, and the decoder turns the final latent back into pixels. Far cheaper, almost no loss in quality, and the basis of Stable Diffusion.</p>",
      cards: [
        { h: "The three components", b: `<ol><li><b>VAE (autoencoder)</b>: encoder E: x → z (512×512×3 → 64×64×4, downsampling factor f = 8); decoder D: z → x. Trained separately, then frozen.</li>
          <li><b>U-Net denoiser</b> operating on latents z_t, conditioned on t and on the text.</li>

          <div class="eq">Training: z₀ = E(x); add noise → z_t; minimise ‖ε − ε_θ(z_t, t, τ(prompt))‖²</div><div class="eq">Generation: z_T ~ N(0, I) → T denoising steps with CFG → x = D(z₀)</div>` },
        { h: "Cross-attention: how words steer pixels", b: `<div class="eq">Attention(Q, K, V) = softmax(QKᵀ/√d)·V,   Q = W_Q·φ(z_t) (image features),   K = W_K·τ(y), V = W_V·τ(y) (text tokens)</div>
          <p>Inside the U-Net's attention blocks, each spatial location (query) attends over the prompt tokens (keys and values). Image regions pick up the words that are relevant to them. This is how “a red cube on a blue sphere” places colours on the right objects (mostly).</p>`,
          ask: { q: "In Stable Diffusion's cross-attention, the queries come from:", o: ["The text tokens", "The image (latent) features", "The timestep", "The VAE decoder"], a: 1, x: "Q from the image features; K and V from the text embedding." } },
        { h: "Why latent diffusion matters, and the hands-on", b: `<ul><li>Much lower compute and memory (≈ 48× fewer values per image), so high resolution runs on consumer GPUs.</li><li>The autoencoder removes imperceptible high-frequency detail, so the diffusion model spends capacity on semantics.</li><li>The same latent model supports text-to-image, image-to-image (start from a noised encoding of an input image), inpainting and super-resolution.</li><li>Hands-on reverse diffusion: load the trained model, start from noise, loop t = T…1 with the update μ_θ + σ_t z, and visualise the image emerging from noise.</li></ul>` }
      ],
      keys: ["Latent diffusion: diffuse in the latent space of a pre-trained, frozen VAE (512×512×3 → 64×64×4, f = 8).", "Stable Diffusion = VAE + U-Net denoiser + CLIP text encoder; CFG at sampling.", "Cross-attention: Q from image latents, K and V from text embeddings.", "Generation: z_T ~ N(0, I) → denoise → VAE decoder → image."],
      traps: ["The VAE runs only at the start (training) and at the end (decoding); denoising happens in latent space.", "The text encoder is frozen; it is not trained with the U-Net in SD v1.", "Self-attention mixes image locations; cross-attention injects the text."],
      quiz: [

        { q: "A 512×512×3 image is encoded into a 64×64×4 latent. By what factor is the number of values reduced?", a: { n: 48, tol: 0.1 }, x: "786,432 / 16,384 = 48.", r: 0 },
        { q: "How does the text prompt influence the Stable Diffusion U-Net?", o: ["It is concatenated to the noise only at t = T", "Through cross-attention, with text embeddings as keys and values", "It replaces the time embedding", "It selects a different U-Net per word"], a: 1, x: "Cross-attention layers inside the U-Net.", r: 1 },
        { q: "Which are components of Stable Diffusion? (Select all that apply)", o: ["A VAE encoder/decoder", "A U-Net denoiser", "A CLIP text encoder", "A PatchGAN discriminator used at sampling time"], a: [0, 1, 2], x: "No discriminator is used to sample.", r: 0 },
        { q: "The main advantage of latent diffusion over pixel-space diffusion is:", o: ["No need for a noise schedule", "Much lower computational cost at similar quality", "No need for a denoiser", "Deterministic samples"], a: 1, x: "Fewer values per step, many fewer FLOPs.", r: 2 }
      ]

  ],
  test: [
    { q: "In the diffusion U-Net, information from the encoder reaches the decoder at the same resolution via:", o: ["Skip connections", "The time embedding", "Cross-attention to text", "Dropout"], a: 0, x: "Concatenated skip connections.", t: "w8t1", r: 0 },
    { q: "Sinusoidal time embeddings in diffusion models are closely related to which transformer component?", o: ["Layer normalisation", "Positional encoding", "Masked attention", "Softmax"], a: 1, x: "The same sin/cos formula, applied to the timestep.", t: "w8t1", r: 1 },
    { q: "With CFG, ε_uncond = 1.0, ε_cond = 0.6 and w = 2, compute ε̃.", a: { n: 0.2, tol: 0.001 }, x: "1.0 + 2·(0.6 − 1.0) = 1.0 − 0.8 = 0.2.", t: "w8t2", r: 2 },
    { q: "In classifier guidance, the extra term added to the score is:", o: ["∇ log p(x_t)", "s·∇_{x_t} log p_φ(y | x_t)", "KL(q‖p)", "The CFG difference"], a: 1, x: "The classifier gradient scaled by s.", t: "w8t2", r: 1 },
    { q: "What happens with a CFG guidance scale of w = 0?", o: ["Pure conditional sampling", "Pure unconditional sampling: the prompt is ignored", "The image is blank", "Sampling is twice as fast"], a: 1, x: "ε̃ = ε_uncond.", t: "w8t2", r: 2 },
    { q: "During CFG training, the condition is replaced by a null token:", o: ["Never", "For a random fraction (about 10–20%) of training examples", "Always", "Only at t = T"], a: 1, x: "Condition dropout.", t: "w8t2", r: 2 },

/* ===== content/w09.js ===== */
COURSE.weeks.push({
  id: "w9", n: 9, title: "Sequence models and NLP foundations",
  tagline: "Text preprocessing, Word2Vec/GloVe, RNN, LSTM, attention, the Transformer encoder.",
  intro: "The course turns from images to language. First, how raw text becomes numbers (preprocessing, embeddings). Then the sequence models: RNNs, LSTMs and their limits, which motivate attention and the Transformer encoder. Lectures 54–58.",
  topics: [
    {
      id: "w9t1", title: "NLP foundations: from text to vectors", lec: [54], min: 18, w: "w2v",
      hook: "A computer only understands numbers. If you give the word “king” the number 7 and “queen” the number 8, is “queen” now more similar to “king” than to “banana” (number 9,000)? What is wrong with that scheme?",
      reveal: "<p>Integer IDs and one-hot vectors carry <b>no meaning</b>: every pair of words is equally far apart, so arithmetic on IDs is meaningless. <b>Word embeddings</b> fix this: dense vectors learned so that words used in similar contexts land close together, and directions carry relations (king − man + woman ≈ queen).</p>",
      cards: [
        { h: "The preprocessing pipeline", b: `<ul><li><b>Tokenisation</b>: split text into units (words, subwords, characters).</li><li><b>Lowercasing, punctuation and noise removal.</b></li><li><b>Stop-word removal</b>: drop very frequent, low-information words (the, is, and), useful for classic models.</li><li><b>Stemming</b>: crude suffix chopping (studies → studi). <b>Lemmatisation</b>: dictionary-based reduction to the base form (studies → study, better → good).</li></ul>`,
          ask: { q: "Reducing “better” to “good” requires:", o: ["Stemming", "Lemmatisation", "Stop-word removal", "Tokenisation"], a: 1, x: "Only lemmatisation uses vocabulary and morphology to find the base form." } },
        { h: "Representing text", b: `<div class="tablewrap"><table><tr><th>Method</th><th>Idea</th><th>Limitation</th></tr>
          <tr><td>One-hot</td><td>Vector of size |V| with a single 1</td><td>Huge, sparse, no similarity</td></tr><tr><td>Bag of Words</td><td>Word counts per document</td><td>Ignores order and meaning</td></tr><tr><td>TF-IDF</td><td>tf(t, d) × log(N / df(t)): rewards words frequent in a document but rare overall</td><td>Still sparse, no semantics</td></tr><tr><td>Word embeddings</td><td>Dense, low-dimensional (50–300) learned vectors</td><td>One static vector per word</td></tr></table></div>` },
        { h: "Word2Vec and GloVe", b: `<ul><li><b>Distributional hypothesis</b>: “you shall know a word by the company it keeps”.</li><li><b>Word2Vec</b> (Mikolov 2013), a shallow network trained on local context windows. <b>CBOW</b> predicts the centre word from its context; <b>Skip-gram</b> predicts the context words from the centre word (better for rare words). Speed-ups: negative sampling, hierarchical softmax.</li><li><b>GloVe</b> (Stanford): learns vectors from the <b>global word–word co-occurrence matrix</b>, so that w_i · w_j ≈ log X_ij.</li><li>Similarity: <b>cosine similarity</b> = u·v / (‖u‖‖v‖).</li><li>Limitation: <b>static</b> embeddings, so a polysemous word like “bank” gets one vector. Contextual models (ELMo, BERT) give a different vector for each use.</li></ul>`, w: "w2v" }
      ],
      keys: ["Pipeline: tokenisation → normalisation → stop-word removal → stemming / lemmatisation.", "Stemming chops suffixes; lemmatisation returns dictionary base forms.", "TF-IDF = tf × log(N/df).", "Word2Vec: CBOW (context → word), Skip-gram (word → context); local windows.", "GloVe: global co-occurrence statistics. Both give static embeddings; similarity = cosine."],
      traps: ["CBOW and Skip-gram are often swapped in exam options.", "GloVe uses global counts; Word2Vec uses local prediction.", "Static embeddings cannot disambiguate word senses."],
      quiz: [
        { q: "Which Word2Vec architecture predicts the surrounding context words from the centre word?", o: ["CBOW", "Skip-gram", "GloVe", "TF-IDF"], a: 1, x: "Skip-gram: word → context. CBOW: context → word.", r: 2 },
        { q: "GloVe embeddings are learned primarily from:", o: ["Local next-word prediction", "A global word–word co-occurrence matrix", "Character n-grams only", "Labelled sentiment data"], a: 1, x: "GloVe = Global Vectors.", r: 2 },
        { q: "Compute the cosine similarity between u = [1, 0] and v = [1, 1] (3 decimals).", a: { n: 0.707, tol: 0.002 }, x: "u·v = 1; ‖u‖ = 1; ‖v‖ = √2 → 1/√2 ≈ 0.707.", r: 2 },
        { q: "A term appears 3 times in a document; it occurs in 10 of 1000 documents. Using tf × log₁₀(N/df), compute TF-IDF.", a: { n: 6, tol: 0.01 }, x: "3 × log₁₀(1000/10) = 3 × 2 = 6.", r: 1 },
        { q: "Which are limitations of one-hot word representations? (Select all that apply)", o: ["Very high dimensional", "Sparse", "No notion of similarity between words", "Captures word order"], a: [0, 1, 2], x: "One-hot vectors are equidistant and order-free.", r: 1 }
      ]
    },
    {
      id: "w9t2", title: "RNNs and LSTMs", lec: [55, 58], min: 20, w: "lstm",
      hook: "“The cat, which already ate a lot of the fish that the neighbours brought over last week, ___ full.” Was or were? You need to remember a word from 15 words back. How could a network carry that memory along?",
      reveal: "<p>A <b>recurrent</b> network keeps a hidden state h_t that it updates word by word, a running summary. Plain RNNs forget long-range information because gradients vanish over many steps. The <b>LSTM</b> adds a gated cell state that can carry “cat → singular” across long gaps.</p>",
      cards: [
        { h: "Why sequences need special models", b: `<p>Language, speech and time series have <b>order</b> and <b>temporal dependencies</b>, and variable length. A feed-forward net takes a fixed-size input and has no memory.</p>
          <div class="eq">RNN:  h_t = tanh(W_xh x_t + W_hh h_(t−1) + b),    y_t = W_hy h_t</div>
          <ul><li>The same weights are shared across all time steps.</li><li>Training: <b>backpropagation through time</b> (BPTT), i.e. unroll and backprop.</li><li>Configurations: many-to-one (sentiment), one-to-many (captioning), many-to-many (tagging, translation with an encoder-decoder).</li></ul>` },
        { h: "Vanishing and exploding gradients", b: `<p>BPTT multiplies by W_hh (and tanh′ ≤ 1) once per step. Over 50 steps: 0.9⁵⁰ ≈ 0.005 (<b>vanishing</b>: no long-term learning) or 1.1⁵⁰ ≈ 117 (<b>exploding</b>: unstable). Exploding gradients are fixed with <b>gradient clipping</b>; vanishing gradients need a new architecture.</p>` },
        { h: "LSTM: gates around a memory cell", b: `<div class="eq">f_t = σ(W_f[h_(t−1), x_t] + b_f)        forget gate</div><div class="eq">i_t = σ(W_i[h_(t−1), x_t] + b_i)        input gate</div><div class="eq">g_t = tanh(W_g[h_(t−1), x_t] + b_g)     candidate values (often written C̃_t)</div><div class="eq">o_t = σ(W_o[h_(t−1), x_t] + b_o)        output gate</div><div class="eq">c_t = f_t ⊙ c_(t−1) + i_t ⊙ g_t       h_t = o_t ⊙ tanh(c_t)</div>
          <p>The cell state c_t is updated <b>additively</b>; when f_t ≈ 1, gradients pass through almost unchanged. The <b>GRU</b> is a lighter cousin with 2 gates (update, reset) and no separate cell state.</p>`, w: "lstm",
          ask: { q: "Which LSTM gate decides how much of the previous cell state to keep?", o: ["Input gate", "Forget gate", "Output gate", "Candidate"], a: 1, x: "c_t = f_t ⊙ c_(t−1) + …" } },
        { h: "Hands-on: text with RNN/LSTM in Keras", b: `<ul><li>Tokenise and convert text to integer sequences, then <code>pad_sequences</code> to a fixed length.</li><li><code>Embedding(vocab_size, 128)</code> → <code>SimpleRNN</code> or <code>LSTM(64)</code> → <code>Dense(1, activation='sigmoid')</code> for binary sentiment.</li><li>The LSTM typically beats SimpleRNN on longer reviews. Bidirectional LSTMs read both directions.</li></ul>` }
      ],
      keys: ["RNN: h_t = tanh(W_xh x_t + W_hh h_(t−1) + b); weights shared across time; trained with BPTT.", "Vanishing/exploding gradients over long sequences; clipping fixes explosions.", "LSTM: forget, input and output gates (sigmoid) + tanh candidate; c_t = f⊙c_(t−1) + i⊙g; h_t = o⊙tanh(c_t).", "GRU: update and reset gates, no separate cell state.", "RNNs are sequential, so they cannot parallelise over time."],
      traps: ["The gates use sigmoid (0–1); the candidate and the output squashing use tanh.", "Gradient clipping does not fix vanishing gradients.", "An LSTM has 4 weight blocks (f, i, g, o); a GRU has 3."],
      quiz: [
        { q: "LSTM cell update: f = 0.5, c_(t−1) = 2, i = 0.4, g = 0.5. Compute c_t.", a: { n: 1.2, tol: 0.001 }, x: "0.5·2 + 0.4·0.5 = 1 + 0.2 = 1.2.", r: 2 },
        { q: "Gradient clipping is mainly used to address:", o: ["Vanishing gradients", "Exploding gradients", "Overfitting", "Tokenisation errors"], a: 1, x: "It caps gradient norms; vanishing gradients need architectural fixes like the LSTM.", r: 1 },
        { q: "Which statements about vanilla RNNs are true? (Select all that apply)", o: ["The same weights are used at every time step", "They are trained with backpropagation through time", "They capture very long-range dependencies easily", "They process tokens sequentially"], a: [0, 1, 3], x: "Long-range dependencies suffer from vanishing gradients.", r: 0 },
        { q: "Which activation is used for the LSTM gates (forget, input, output)?", o: ["ReLU", "Sigmoid", "Softmax", "Linear"], a: 1, x: "Gates must lie in [0, 1] to act as soft switches.", r: 2 },
        { q: "With o_t = 1 and c_t = 0, the LSTM hidden state h_t equals:", a: { n: 0, tol: 0.001 }, x: "h_t = o_t · tanh(c_t) = 1 · tanh(0) = 0.", r: 2 }
      ]
    },
    {
      id: "w9t3", title: "Attention: from LSTMs to Transformers", lec: [56], min: 20, w: "attention",
      hook: "An encoder LSTM reads a 50-word sentence and squeezes it into one fixed-size vector, then a decoder writes the translation from that single vector. What would you do if you were the decoder and had to translate word 37?",
      reveal: "<p>You would <b>look back</b> at the relevant source words instead of relying on one summary vector. That is <b>attention</b>: at each step, compute relevance scores against all encoder states and take a weighted average. The Transformer then asked whether you need the recurrence at all, and answered no: “Attention is all you need”.</p>",
      cards: [
        { h: "The bottleneck of seq2seq", b: `<ul><li>Encoder–decoder RNNs compress the whole input into a final hidden state, a <b>fixed-length bottleneck</b>, so performance drops on long sentences.</li><li>RNNs are <b>sequential</b>: step t needs step t−1, so there is no parallelism across tokens, and long paths mean weak long-range gradients.</li><li><b>Bahdanau (additive) attention</b>: the decoder computes weights over all encoder states at every step, a = softmax(score(s_t, h_i)), and uses the context c_t = Σ a_i h_i. This is <b>encoder–decoder attention</b>.</li></ul>` },
        { h: "Scaled dot-product self-attention", b: `<div class="eq">Q = XW_Q,  K = XW_K,  V = XW_V          Attention(Q, K, V) = softmax(QKᵀ / √d_k) · V</div>
          <ul><li>Each token's <b>query</b> is compared with every token's <b>key</b>; the softmax weights mix the <b>values</b>.</li><li>Dividing by √d_k keeps dot products from growing with dimension, which would saturate the softmax and shrink gradients.</li><li>Every token attends to every other in one step: path length O(1), fully parallel, cost O(n²) in sequence length.</li></ul>`, w: "attention" },
        { h: "Multi-head attention, masks and positions", b: `<div class="eq">MultiHead(Q,K,V) = Concat(head₁, …, head_h)·W_O,   head_i = Attention(QW_Qⁱ, KW_Kⁱ, VW_Vⁱ)</div>
          <ul><li><b>Multiple heads</b> (8 in the original, d_model = 512, d_k = 64 per head) learn different relations: syntax, coreference, position.</li><li><b>Masked (causal) self-attention</b> in the decoder: future positions are set to −∞ before the softmax, so token t sees only ≤ t. This keeps generation autoregressive.</li><li><b>Positional encoding</b>: attention is permutation-invariant, so order must be injected (sin/cos, next topic).</li></ul>`,
          ask: { q: "Why is a mask applied in the decoder's self-attention?", o: ["To speed up training", "To stop a position attending to future tokens", "To remove stop words", "To add positional information"], a: 1, x: "Causal masking keeps prediction of token t independent of tokens after t." } }
      ],
      keys: ["Seq2seq RNN bottleneck: one fixed vector for the whole input. Attention lets the decoder look at all encoder states.", "Attention(Q,K,V) = softmax(QKᵀ/√d_k)V.", "√d_k scaling prevents softmax saturation for large dimensions.", "Multi-head: h parallel heads, concatenated, × W_O (original: h = 8, d_model = 512, d_k = 64).", "Causal mask (−∞ on future positions) in the decoder; positional encodings because attention has no notion of order."],
      traps: ["Self-attention: Q, K, V from the same sequence. Encoder–decoder (cross) attention: Q from the decoder, K and V from the encoder.", "Attention cost is quadratic in sequence length.", "The mask is applied before the softmax, as −∞, not 0."],
      quiz: [
        { q: "In scaled dot-product attention, the scores QKᵀ are divided by:", o: ["d_k", "√d_k", "The sequence length", "The number of heads"], a: 1, x: "Scaling by √d_k keeps the softmax out of saturation.", r: 1 },
        { q: "In encoder–decoder (cross) attention of the Transformer, the queries come from:", o: ["The encoder output", "The decoder", "The positional encodings", "The embedding matrix"], a: 1, x: "Q from the decoder; K and V from the encoder's output.", r: 2 },
        { q: "A query q = [1, 0] and keys k₁ = [1, 0], k₂ = [0, 1] with d_k = 1 (no scaling effect). What is the attention weight on k₁ (3 decimals)?", a: { n: 0.731, tol: 0.002 }, x: "Scores 1 and 0 → softmax = e/(e + 1) ≈ 0.731.", r: 1 },
        { q: "Which are advantages of self-attention over RNNs? (Select all that apply)", o: ["Parallel computation across positions", "A constant path length between any two tokens", "Linear cost in sequence length", "Direct modelling of long-range dependencies"], a: [0, 1, 3], x: "Self-attention is quadratic, not linear, in sequence length.", r: 1 },
        { q: "With d_model = 512 and 8 heads, the per-head dimension d_k is:", a: { n: 64, tol: 0 }, x: "512 / 8 = 64.", r: 2 }
      ]
    },
    {
      id: "w9t4", title: "The Transformer encoder", lec: [57], min: 16, w: "posenc",
      hook: "Shuffle the words of a sentence and feed them to pure self-attention. The output vectors come out identical, just shuffled. So how does a Transformer know that “dog bites man” differs from “man bites dog”?",
      reveal: "<p>Self-attention alone is <b>order-blind</b> (permutation-equivariant). The Transformer adds a <b>positional encoding</b> to each token embedding before the first layer, so the same word at different positions has a different input vector.</p>",
      cards: [
        { h: "One encoder layer", b: `<div class="eq">x → [Multi-head self-attention] → Add & LayerNorm → [Position-wise feed-forward] → Add & LayerNorm</div>
          <ul><li><b>Residual connections</b> around each sub-layer: output = LayerNorm(x + Sublayer(x)). They ease gradient flow through deep stacks.</li><li><b>Layer normalisation</b> normalises each token's feature vector (not across the batch).</li><li><b>Position-wise FFN</b>: FFN(x) = max(0, xW₁ + b₁)W₂ + b₂, applied identically to every position; inner size 2048 for d_model = 512.</li><li>The original encoder stacks N = 6 such layers.</li></ul>` },
        { h: "Sinusoidal positional encoding", b: `<div class="eq">PE(pos, 2i) = sin(pos / 10000^(2i/d_model))        PE(pos, 2i+1) = cos(pos / 10000^(2i/d_model))</div>
          <ul><li>Added (not concatenated) to the token embeddings.</li><li>Each dimension is a sinusoid with a different wavelength (2π to 10000·2π), so every position gets a unique pattern.</li><li>PE(pos + k) is a linear function of PE(pos), which makes relative positions easy to learn, and it extrapolates to unseen lengths. Learned positional embeddings (BERT, GPT-2) are the main alternative.</li></ul>`, w: "posenc",
          ask: { q: "PE(0, 0) and PE(0, 1) (position 0, dimensions 0 and 1) are:", o: ["0 and 1", "1 and 0", "0 and 0", "1 and 1"], a: 0, x: "sin(0) = 0, cos(0) = 1." } },
