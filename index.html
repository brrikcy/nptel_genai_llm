  id: "w11", n: 11, title: "Adapting LLMs: ICL, LoRA and RAG",
  tagline: "In-context learning, parameter-efficient fine-tuning, retrieval-augmented generation.",
  intro: "Three ways to make a general LLM useful for your task: show it examples in the prompt (in-context learning), cheaply fine-tune a tiny set of extra weights (LoRA/QLoRA), or give it the right documents at question time (RAG, plus Graph RAG and Agentic RAG). Lectures 64–69.",
  topics: [
    {
      id: "w11t1", title: "LLM recap and in-context learning", lec: [64, 65], min: 16,
      hook: "You show GPT-3 three examples of English → pig-latin and it continues the pattern on a new word. Its weights never changed. So where did it “learn” pig-latin?",
      reveal: "<p>Inside the forward pass. The examples sit in the context window, and attention lets later tokens condition on the pattern in the earlier ones. This is <b>in-context learning (ICL)</b>: task adaptation by conditioning, not by gradient updates. It emerges at scale.</p>",
      cards: [
        { h: "Recap: the LLM pipeline", b: `<ul><li>Text → tokens → embeddings + positions → stack of (multi-head) attention + FFN blocks → softmax over the vocabulary → next token.</li><li>Encoder (bidirectional, understanding), decoder (causal, generation), encoder–decoder (seq2seq).</li><li>Training stages of a modern chat LLM: <b>pre-training</b> (next-token prediction on huge corpora) → <b>supervised instruction tuning</b> → <b>alignment</b> (RLHF / DPO) for helpfulness and safety.</li></ul>` },
        { h: "In-context learning", b: `<ul><li>The <b>context</b> = everything in the prompt window: instructions, examples, documents, conversation history.</li><li><b>ICL</b>: the model infers the task from demonstrations in the context and applies it to the query. No parameter updates; the "learning" is temporary and vanishes with the next prompt.</li><li>Zero-shot, one-shot and few-shot are all ICL with k = 0, 1 or a few demonstrations.</li><li>Sensitive to the choice, order and format of examples; bounded by the context length.</li><li>Emergent with scale (strong in GPT-3, weak in small models).</li></ul>`,
          ask: { q: "In in-context learning, the model's weights are:", o: ["Updated by backprop on the examples", "Unchanged", "Re-initialised", "Pruned"], a: 1, x: "Adaptation happens through conditioning in the forward pass." } },
        { h: "ICL vs fine-tuning", b: `<div class="tablewrap"><table><tr><th></th><th>In-context learning</th><th>Fine-tuning</th></tr><tr><td>Weights change?</td><td>No</td><td>Yes</td></tr><tr><td>Data needed</td><td>A handful of examples</td><td>Hundreds to thousands of labelled examples</td></tr><tr><td>Cost</td><td>No training; longer prompts at inference</td><td>Training compute; short prompts afterwards</td></tr><tr><td>Persistence</td><td>Per prompt</td><td>Permanent</td></tr></table></div>` }
      ],
      keys: ["ICL: learn a task from demonstrations in the prompt, with no weight updates; zero/one/few-shot are special cases.", "ICL emerges with model scale and is limited by context length and example choice.", "Chat-LLM stages: pre-training → instruction tuning → alignment (RLHF/DPO).", "Fine-tuning changes weights permanently; ICL is temporary."],
      traps: ["Few-shot prompting is not few-shot fine-tuning.", "ICL quality depends on the order and format of examples.", "Context = the prompt window, not the training data."],
      quiz: [
        { q: "In-context learning means:", o: ["Fine-tuning on a small dataset", "Performing a new task from examples given in the prompt, without updating weights", "Training with a larger context window", "Retrieving documents from a database"], a: 1, x: "The model conditions on demonstrations in its input.", r: 1 },
        { q: "Which are true about in-context learning? (Select all that apply)", o: ["It is limited by the context window length", "It is sensitive to the choice and order of demonstrations", "It permanently changes the model", "It becomes much stronger with larger models"], a: [0, 1, 3], x: "Nothing persists after the prompt.", r: 1 },
        { q: "Which training stage teaches a pre-trained LLM to follow instructions and be helpful and safe?", o: ["Tokeniser training", "Instruction tuning followed by alignment (e.g. RLHF)", "Positional encoding", "Pre-training only"], a: 1, x: "Pre-training gives knowledge; instruction tuning and alignment shape behaviour.", r: 0 },
        { q: "Compared with fine-tuning, ICL needs:", o: ["More labelled data", "No gradient updates, but longer prompts at inference", "A GPU cluster for training", "A new tokenizer"], a: 1, x: "The cost moves from training to inference-time context.", r: 2 }
      ]
    },
    {
      id: "w11t2", title: "Fine-tuning cheaply: LoRA and QLoRA", lec: [66], min: 13, w: "lora",
      hook: "Fully fine-tuning a 7B-parameter model means storing gradients and optimizer states for all 7 billion weights, and a separate 7B copy for every task. What if the change a task needs is secretly very low-dimensional?",
      reveal: "<p>Empirically it is: the weight update ΔW for adapting to a task has low <b>intrinsic rank</b>. LoRA freezes W and learns ΔW = B·A with a tiny rank r (4–64), often under 1% of the parameters, and a few MB per task.</p>",
      cards: [
        { h: "Parameter-efficient fine-tuning (PEFT)", b: `<p>Full fine-tuning updates every weight: expensive memory, slow, risk of catastrophic forgetting, and one full copy per task. PEFT methods freeze the base model and train a small number of new parameters: adapters, prefix/prompt tuning, and <b>LoRA</b>, the most popular.</p>` },
        { h: "LoRA: low-rank adaptation", b: `<div class="eq">h = W₀x + ΔW·x = W₀x + (α/r)·B·A·x,      W₀ ∈ ℝ^(d×k) frozen,  B ∈ ℝ^(d×r),  A ∈ ℝ^(r×k),  r ≪ min(d, k)</div>
          <ul><li>Trainable parameters per adapted matrix: <b>r(d + k)</b> instead of d·k.</li><li>Initialisation: A random (Gaussian), <b>B = 0</b>, so ΔW = 0 and training starts exactly at the pre-trained model.</li><li>Usually applied to the attention projections (W_Q, W_V, often all linear layers).</li><li>After training, merge W = W₀ + BA, so there is <b>no extra inference latency</b>. Swap small adapters per task.</li></ul>`, w: "lora",
          ask: { q: "d = k = 1024, r = 8. LoRA trainable parameters for that matrix?", o: ["8,192", "16,384", "1,048,576", "2,048"], a: 1, x: "r(d + k) = 8 × 2048 = 16,384, versus 1,048,576 for the full matrix." } },
        { h: "QLoRA", b: `<ul><li>Quantise the frozen base model to <b>4-bit</b> (NF4, NormalFloat-4), with double quantisation of the quantisation constants and paged optimizers.</li><li>Train LoRA adapters in higher precision on top.</li><li>Result: fine-tune a 65B model on a single 48 GB GPU with near full-precision quality.</li></ul>` }
      ],
      keys: ["PEFT: freeze the base and train few new parameters; LoRA is the main example.", "LoRA: ΔW = BA, B ∈ ℝ^(d×r), A ∈ ℝ^(r×k); trainable r(d + k) vs d·k.", "B initialised to 0, so ΔW = 0 at the start; scaling α/r; merge after training → no extra latency.", "QLoRA: 4-bit NF4 frozen base + LoRA adapters, which lets large models fit on one GPU."],
      traps: ["A LoRA parameter count is r(d + k), not r·d·k.", "It is B (not A) that starts at zero.", "LoRA does not change the frozen W₀ during training."],
      quiz: [
        { q: "For a weight matrix of size 4096 × 4096 and LoRA rank r = 16, how many trainable parameters does LoRA add?", a: { n: 131072, tol: 0 }, x: "16 × (4096 + 4096) = 131,072 (versus 16,777,216 for full fine-tuning).", r: 1 },
        { q: "In LoRA, which matrix is initialised to zero so that ΔW = 0 at the start?", o: ["A", "B", "W₀", "Both A and B"], a: 1, x: "B = 0 and A is random, so BA = 0.", r: 1 },
        { q: "Why does LoRA add no inference latency after training?", o: ["The adapters are discarded", "BA can be merged into W₀ to form a single matrix", "It uses a smaller tokenizer", "It skips attention layers"], a: 1, x: "W = W₀ + BA has the original shape.", r: 1 },
        { q: "Which statements about QLoRA are true? (Select all that apply)", o: ["The base model is quantised to 4-bit", "LoRA adapters are trained on top of the frozen quantised model", "It uses the NF4 data type", "It requires updating all base weights in full precision"], a: [0, 1, 2], x: "The base stays frozen.", r: 2 }
      ]
    },
    {
      id: "w11t3", title: "Retrieval-augmented generation (RAG)", lec: [67, 69], min: 20, w: "rag",
      hook: "Ask an LLM about your company's leave policy, published last month. It answers confidently and wrongly. You could retrain the model every time a document changes, or do something much cheaper at question time. What?",
      reveal: "<p>Look the answer up first. <b>Retrieve</b> the relevant passages from your documents, put them into the prompt, and ask the model to answer from them. The documents become an updatable, citable, <b>non-parametric memory</b>. That is RAG.</p>",
      cards: [
        { h: "Parametric vs non-parametric memory", b: `<ul><li><b>Parametric memory</b>: knowledge stored in the model weights. Fixed at training time, hard to update, hard to cite, prone to hallucination on rare or recent facts.</li><li><b>Non-parametric memory</b>: an external document index queried at run time. Updatable without retraining, inspectable, attributable.</li><li>RAG (Lewis et al., 2020) combines a retriever (Dense Passage Retrieval) with a seq2seq generator (BART), both over a Wikipedia index.</li></ul>` },
        { h: "The pipeline", b: `<p><b>Indexing (offline)</b>: load documents → <b>chunk</b> them (e.g. 200–1000 tokens with overlap) → <b>embed</b> each chunk with an embedding model → store the vectors in a <b>vector database</b> (FAISS, Chroma, Pinecone…).</p>
          <p><b>Query time</b>: embed the question → <b>retrieve</b> the top-k nearest chunks (cosine similarity / approximate nearest neighbour) → optionally <b>re-rank</b> → <b>augment</b> the prompt with the chunks → <b>generate</b> an answer grounded in them (ideally with citations).</p>
          <p>Retrievers: <b>sparse</b> (TF-IDF, BM25: keyword match) and <b>dense</b> (neural bi-encoders: semantic match), or a hybrid of both.</p>`, w: "rag" },
        { h: "Why RAG, and what can go wrong", b: `<ul><li>Benefits: fewer hallucinations, up-to-date and private knowledge without retraining, source attribution, cheaper than fine-tuning for knowledge.</li><li>Failure points: bad chunking, the retriever misses the relevant passage, irrelevant context distracts the generator, “lost in the middle” (long contexts), prompt injection hidden in documents.</li><li>RAG vs fine-tuning: RAG injects <b>knowledge</b>; fine-tuning (e.g. LoRA) changes <b>behaviour, style or format</b>. They combine well.</li><li>The tutorial builds ICL prompts, a small RAG pipeline, and a LoRA fine-tune, and compares them.</li></ul>`,
          ask: { q: "Your product docs change weekly and answers must cite them. The best first choice is:", o: ["Full fine-tuning every week", "RAG over the docs", "A larger model with no retrieval", "A GAN"], a: 1, x: "Update the index, not the weights; retrieval gives citations." } }
      ],
      keys: ["RAG = retrieve relevant chunks → augment the prompt → generate a grounded answer.", "Parametric memory (weights) vs non-parametric memory (an external index that can be updated without retraining).", "Indexing: chunk → embed → vector DB. Query: embed → top-k by cosine similarity → (re-rank) → prompt.", "Sparse (BM25/TF-IDF) vs dense (embedding) retrievers.", "RAG reduces hallucination and adds freshness and citations; fine-tuning changes behaviour."],
      traps: ["The retriever and the generator are different components.", "RAG does not change model weights at query time.", "More retrieved text is not always better (distraction, lost in the middle)."],
      quiz: [
        { q: "In RAG, the external document index acts as:", o: ["Parametric memory", "Non-parametric memory", "A tokenizer", "A discriminator"], a: 1, x: "Knowledge outside the weights, updatable at any time.", r: 0 },
        { q: "Put the RAG query-time steps in order: (1) generate the answer, (2) embed the question, (3) retrieve the top-k chunks, (4) add the chunks to the prompt. The correct order is:", o: ["2 → 3 → 4 → 1", "3 → 2 → 1 → 4", "1 → 2 → 3 → 4", "4 → 3 → 2 → 1"], a: 0, x: "Embed, retrieve, augment, generate.", r: 1 },
        { q: "Which are benefits of RAG over relying only on the LLM's weights? (Select all that apply)", o: ["Knowledge can be updated without retraining", "Answers can cite sources", "Fewer hallucinations on domain facts", "It guarantees zero errors"], a: [0, 1, 2], x: "Retrieval can still miss or mislead.", r: 2 },
        { q: "BM25 is an example of a:", o: ["Dense neural retriever", "Sparse keyword-based retriever", "Generator", "Re-ranking LLM"], a: 1, x: "BM25 refines TF-IDF scoring.", r: 1 },
        { q: "To make an LLM answer in your company's tone and format (not new facts), the better tool is:", o: ["RAG", "Fine-tuning (e.g. LoRA)", "A vector database", "Larger top-k"], a: 1, x: "Fine-tuning shapes behaviour; RAG supplies knowledge.", r: 2 }
      ]
    },
    {
      id: "w11t4", title: "Beyond basic RAG: Graph RAG and Agentic RAG", lec: [68], min: 11,
      hook: "“Which suppliers of our top three customers also supply our competitors?” No single document chunk contains that answer. Retrieval of the top-5 similar chunks fails. What kind of index, or what kind of retrieval process, would succeed?",
      reveal: "<p>Either an index that stores <b>relationships</b> (a knowledge graph you can traverse: Graph RAG) or a retrieval process that <b>plans</b>: break the question into steps, retrieve iteratively, call tools, check intermediate results (Agentic RAG).</p>",
      cards: [
        { h: "Graph RAG", b: `<ul><li>Extract <b>entities and relations</b> from documents (often with an LLM) into a <b>knowledge graph</b>; optionally cluster it into communities with summaries.</li><li>At query time, find the relevant entities, traverse their neighbourhoods (multi-hop), and feed the subgraph and summaries to the LLM.</li><li>Strengths: multi-hop questions, global “what are the main themes across the corpus” questions, explicit relationships. Costs: graph construction and maintenance.</li></ul>` },
        { h: "Agentic RAG", b: `<ul><li>An LLM <b>agent</b> controls retrieval: it decides <i>whether</i> to retrieve, rewrites queries, decomposes a question into sub-questions, chooses tools (vector search, SQL, web search, calculator), and iterates.</li><li>Patterns: <b>ReAct</b> (reason → act → observe loops), self-reflection and verification, routing between knowledge sources, multi-agent setups.</li><li>Strengths: complex, multi-step, cross-source tasks. Costs: more latency and LLM calls, harder to evaluate and secure (tool misuse, prompt injection; see Week 12 guardrails).</li></ul>`,
          ask: { q: "An LLM that decides to query SQL, then a vector store, then checks its answer, is an example of:", o: ["Naive RAG", "Agentic RAG", "LoRA", "BPE"], a: 1, x: "The agent plans and iterates retrieval with tools." } },
        { h: "Choosing a RAG flavour", b: `<div class="tablewrap"><table><tr><th>Need</th><th>Use</th></tr><tr><td>Single-fact lookup in documents</td><td>Naive (vanilla) RAG</td></tr><tr><td>Relationships, multi-hop, corpus-wide themes</td><td>Graph RAG</td></tr><tr><td>Multi-step tasks across tools and sources, adaptive retrieval</td><td>Agentic RAG</td></tr></table></div>` }
      ],
      keys: ["Graph RAG: knowledge graph of entities and relations; traversal for multi-hop and global questions.", "Agentic RAG: an LLM agent plans retrieval, rewrites and decomposes queries, uses tools, iterates (e.g. ReAct).", "Trade-off: more capability vs more cost, latency and security surface."],
      traps: ["Graph RAG is about the structure of the index; Agentic RAG is about the control loop.", "Agentic systems increase the prompt-injection risk because they act on retrieved text."],
      quiz: [
        { q: "Graph RAG primarily helps with:", o: ["Faster tokenisation", "Multi-hop questions that need relationships between entities", "Image generation", "Reducing model size"], a: 1, x: "Traversing explicit relations answers questions no single chunk contains.", r: 0 },
        { q: "Which are characteristic of Agentic RAG? (Select all that apply)", o: ["The LLM decides when and what to retrieve", "Query decomposition and iterative retrieval", "Tool use such as SQL or web search", "A single fixed retrieve-then-generate pass"], a: [0, 1, 2], x: "A single fixed pass describes naive RAG.", r: 1 },
        { q: "A major new risk introduced by agentic systems that act on retrieved content is:", o: ["Mode collapse", "Prompt injection leading to harmful tool actions", "Vanishing gradients", "Posterior collapse"], a: 1, x: "Instructions hidden in documents may be executed; guardrails are needed.", r: 1 }
      ]
    }
  ],
  test: [
    { q: "Few-shot prompting is a form of:", o: ["Fine-tuning", "In-context learning", "Quantisation", "Retrieval"], a: 1, x: "Demonstrations in the context, no weight updates.", t: "w11t1", r: 1 },
    { q: "Which statement about in-context learning is false?", o: ["It requires no gradient updates", "It can be sensitive to example order", "It permanently teaches the model the new task", "It is limited by context length"], a: 2, x: "The ability disappears when the examples are removed.", t: "w11t1", r: 1 },
    { q: "LoRA trainable parameters for a 1024 × 4096 matrix with r = 4:", a: { n: 20480, tol: 0 }, x: "4 × (1024 + 4096) = 4 × 5120 = 20,480.", t: "w11t2", r: 1 },
    { q: "In LoRA, the update applied to a layer is:", o: ["ΔW = A + B", "ΔW = B·A with low rank r", "ΔW = W₀ᵀ", "ΔW = 0 always"], a: 1, x: "A low-rank factorisation.", t: "w11t2", r: 1 },
    { q: "QLoRA reduces memory mainly by:", o: ["Removing attention layers", "Quantising the frozen base model to 4-bit", "Using a smaller vocabulary", "Training without gradients"], a: 1, x: "NF4 quantisation of the base weights.", t: "w11t2", r: 2 },
    { q: "In a RAG system, documents are split into chunks before embedding because:", o: ["Embeddings only accept single words", "Smaller passages give more precise retrieval and fit in the context window", "It removes the need for a vector database", "It trains the LLM"], a: 1, x: "Chunk size trades precision against context.", t: "w11t3", r: 1 },
    { q: "Which similarity measure is most commonly used to compare a query embedding with document embeddings?", o: ["Cosine similarity", "Edit distance", "Jaccard on characters", "Pearson on token IDs"], a: 0, x: "Cosine (or dot product on normalised vectors).", t: "w11t3", r: 1 },
    { q: "Which are steps of RAG indexing (offline)? (Select all that apply)", o: ["Chunk documents", "Embed chunks", "Store vectors in a vector database", "Generate answers to user questions"], a: [0, 1, 2], x: "Generation happens at query time.", t: "w11t3", r: 1 },
    { q: "RAG's external index is called non-parametric memory because:", o: ["It has no parameters at all", "Its knowledge lives outside the model weights and can be changed without retraining", "It is stored in the GPU cache", "It uses no embeddings"], a: 1, x: "Parametric = in the weights.", t: "w11t3", r: 0 },
    { q: "“Summarise the main themes across all 10,000 incident reports” is best served by:", o: ["Naive top-k RAG", "Graph RAG with community summaries", "LoRA fine-tuning", "Zero-shot with no context"], a: 1, x: "Global, corpus-wide questions are where Graph RAG shines.", t: "w11t4", r: 2 }
  ]
});

/* ===== content/w12.js ===== */
COURSE.weeks.push({
  id: "w12", n: 12, title: "LLM capabilities, multimodality and ethics",
  tagline: "Decoding, multimodal LLMs, scaling & benchmarks, evaluation, bias, fairness, safety.",
  intro: "The final week ties everything together: how an LLM turns probabilities into text (tokens, embeddings, temperature, top-k/top-p), how it handles images, audio and video, how size relates to performance and how we benchmark and evaluate it, and the responsibility questions of hallucination, bias, fairness and safety. Lectures 70–74.",
  topics: [
    {
      id: "w12t1", title: "Text generation: from tokens to decoding", lec: [70], min: 19, w: "sampler",
      hook: "Ask an LLM “What is the capital of Karnataka?” 100 times and you want “Bengaluru” 100 times. Ask it “Write a story about Bengaluru” 100 times and you want 100 different stories. It's the same model. Which single knob makes the difference?",
      reveal: "<p><b>Temperature</b> (together with the sampling strategy). Low temperature makes the next-token distribution peaky, giving nearly always the top token: factual and repeatable. High temperature flattens it, so more varied tokens are sampled: creative, but at the risk of hallucination.</p>",
      cards: [
        { h: "Input side: tokens and the embedding matrix", b: `<ul><li>A <b>token</b> can be a whole word, a subword, or a symbol. An English token averages about 4–5 characters (100 characters ≈ 20–25 tokens).</li><li>Tokenisers are <b>data-driven</b> (information-theory motivated): frequent strings become single tokens, rare or new words (e.g. “COVID” in 2020) split into several pieces.</li><li><b>The language gap starts in the tokeniser</b>: dominant languages (English) get longer, meaningful tokens; under-represented languages get fragmented into short pieces, which hurts the model's semantics and reasoning in those languages.</li><li><b>Embedding matrix</b> V × d (e.g. 16k × 768): row i is the vector for token i. Initialised randomly and learned by backprop. The tokeniser itself is fixed before training.</li></ul>` },
        { h: "Output side: logits to probabilities", b: `<div class="eq">p_i = exp(z_i / T) / Σ_j exp(z_j / T)          next token ~ p      (predicting x_t given x_&lt;t)</div>
          <ul><li>The final layer maps the hidden state back to vocabulary size (the “inverse” of the embedding) to get logits z.</li><li><b>T &lt; 1</b> sharpens (peaky), <b>T = 1</b> leaves it unchanged, <b>T &gt; 1</b> flattens (more random). T → 0 is greedy.</li><li>Lecture example: logits cat 5, dog 4, car 1 at T = 0.5 → cat ≈ 88% of samples, dog ≈ 12%, car ≈ 0.</li></ul>`, w: "sampler" },
        { h: "Decoding strategies", b: `<div class="tablewrap"><table><tr><th>Strategy</th><th>How</th><th>Character</th></tr><tr><td>Greedy</td><td>Always the argmax token</td><td>Deterministic, repetitive; same output every run</td></tr><tr><td>Beam search</td><td>Keep the B best partial sequences</td><td>Good for translation; bland for open text</td></tr><tr><td>Temperature sampling</td><td>Sample from softmax(z/T)</td><td>Controls randomness</td></tr><tr><td>Top-k</td><td>Sample only among the k most likely tokens</td><td>Cuts the long tail</td></tr><tr><td>Top-p (nucleus)</td><td>Smallest set with cumulative probability ≥ p</td><td>Adapts the candidate set to the model's confidence</td></tr></table></div>
          <p>Factual QA, maths, code: low T. Stories, brainstorming: higher T (with top-p). Too high a temperature brings contradictions and hallucinations (“a car is a wild animal”).</p>`,
          ask: { q: "Top-p = 0.9 with probabilities 0.6, 0.25, 0.1, 0.05 keeps how many tokens?", o: ["1", "2", "3", "4"], a: 2, x: "0.6 + 0.25 = 0.85 < 0.9, so add the third: 0.95 ≥ 0.9 → 3 tokens." } }
      ],
      keys: ["Tokens: words/subwords/symbols; ~4–5 characters each in English; data-driven; the language gap begins at tokenisation.", "Embedding matrix V×d, learned; the tokeniser is fixed before training.", "Softmax with temperature: p_i = e^(z_i/T)/Σe^(z_j/T); T<1 sharper, T>1 flatter, T→0 greedy.", "Greedy (deterministic), beam, temperature, top-k (k best), top-p/nucleus (cumulative ≥ p).", "Low T for factual tasks, high T for creative tasks; too high → hallucination."],
      traps: ["Higher temperature means MORE randomness.", "Top-k fixes the count; top-p fixes the probability mass.", "Greedy decoding is deterministic; sampling is not."],
      quiz: [
        { q: "Logits [2, 1, 0] with temperature T = 1. What is the probability of the first token (3 decimals)?", a: { n: 0.665, tol: 0.002 }, x: "e² / (e² + e¹ + e⁰) = 7.389 / (7.389 + 2.718 + 1) = 7.389 / 11.107 ≈ 0.665.", r: 1 },
        { q: "Increasing the temperature above 1 makes the next-token distribution:", o: ["Sharper", "Flatter (more random)", "Unchanged", "One-hot"], a: 1, x: "Dividing logits by T > 1 shrinks their differences.", r: 1 },
        { q: "Which decoding method always returns the same output for the same prompt?", o: ["Top-k sampling", "Nucleus sampling", "Greedy decoding", "Temperature sampling with T = 1.5"], a: 2, x: "Greedy picks the argmax each step, with no randomness.", r: 2 },
        { q: "Which statements about tokenisation are true according to the lecture? (Select all that apply)", o: ["Frequent words tend to be single tokens", "Rare or new words split into several tokens", "Under-represented languages tend to be split into shorter tokens", "Every character is always a separate token"], a: [0, 1, 2], x: "Tokenisers are data-driven; characters are only the starting point.", r: 0 },
        { q: "With top-k = 2 and probabilities cat 0.6, dog 0.25, pig 0.1, car 0.05, what is the renormalised probability of dog (3 decimals)?", a: { n: 0.294, tol: 0.002 }, x: "Keep cat and dog: 0.25 / (0.6 + 0.25) = 0.294.", r: 2 }
      ]
    },
    {
      id: "w12t2", title: "Multimodal LLMs: images, audio and video", lec: [71], min: 13,
      hook: "A language model only reads token embeddings. How do you get a photo of a cat into a model that has only ever seen words?",
      reveal: "<p>Translate the photo into the model's own vocabulary space. An <b>image encoder</b> turns it into feature vectors, and a small <b>adapter / projector</b> maps those vectors into the LLM's embedding space as “visual tokens”. The LLM then reads them alongside the text tokens.</p>",
      cards: [
        { h: "The common recipe", b: `<div class="eq">Image / audio / video → modality-specific encoder → adapter (projector) → “modality tokens” + text tokens → LLM → text</div>
          <ul><li><b>Encoders</b>: vision transformers (ViT, often CLIP-pretrained) for images; audio encoders (e.g. Whisper-style) for speech; frame sequences for video.</li><li><b>Adapter / projector</b>: a linear layer or MLP (LLaVA), a Q-Former (BLIP-2) or cross-attention layers (Flamingo) that <b>align</b> the encoder features with the LLM's representation space.</li><li>Training: often freeze the encoder and the LLM, first train the projector on image–caption pairs (alignment), then instruction-tune on multimodal conversations.</li></ul>` },

(function () {
  "use strict";
  const W = (window.WIDGETS = window.WIDGETS || {});
  let UID = 0;
  const U = (W._util = {});
  U.css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  U.box = (el, title, note) => {
    el.innerHTML = `<div class="widget"><div class="widget-h"><h3>${title}</h3><span class="chip acc">Try it</span></div><div class="widget-b">${note ? `<p class="small muted">${note}</p>` : ""}</div></div>`;
    return el.querySelector(".widget-b");
  };
  U.range = (k, label, min, max, step, val) => { const id = "w" + ++UID; return `<div class="ctrl"><label for="${id}">${label}<output data-o="${k}">${val}</output></label><input type="range" id="${id}" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${val}"></div>`; };
  U.seg = (k, opts, val) => `<div class="seg" data-seg="${k}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" class="${v == val ? "on" : ""}">${l}</button>`).join("")}</div>`;
  U.bind = (root, onChange, fmt = {}) => {
    const st = {};
    root.querySelectorAll("[data-k]").forEach((inp) => {
      const k = inp.dataset.k; const o = root.querySelector(`[data-o="${k}"]`);
      const read = () => { st[k] = inp.type === "range" || inp.type === "number" ? parseFloat(inp.value) : inp.value; if (o) o.textContent = fmt[k] ? fmt[k](st[k]) : inp.value; };
      read(); inp.addEventListener("input", () => { read(); onChange(st); });
    });
    root.querySelectorAll("[data-seg]").forEach((sg) => {
      const k = sg.dataset.seg; st[k] = sg.querySelector(".on").dataset.v;
      sg.addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; sg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); st[k] = b.dataset.v; onChange(st); });
    });
    return st;
  };
  U.plot = (o) => {
    const p = Object.assign({ w: 520, h: 250, padL: 38, padR: 12, padT: 12, padB: 26 }, o);
    p.X = (x) => p.padL + ((x - p.x0) / (p.x1 - p.x0)) * (p.w - p.padL - p.padR);
    p.Y = (y) => p.h - p.padB - ((y - p.y0) / (p.y1 - p.y0)) * (p.h - p.padT - p.padB);
    p.cid = "c" + ++UID;
    p.path = (fn, n = 240) => { let d = ""; const lo = p.y0 - (p.y1 - p.y0), hi = p.y1 + (p.y1 - p.y0); for (let i = 0; i <= n; i++) { const x = p.x0 + ((p.x1 - p.x0) * i) / n; let y = fn(x); if (!isFinite(y)) continue; y = Math.max(lo, Math.min(hi, y)); d += (d ? "L" : "M") + p.X(x).toFixed(1) + "," + p.Y(y).toFixed(1); } return d; };
    p.frame = (xt, yt, xl, yl) => {
      let g = `<defs><clipPath id="${p.cid}"><rect x="${p.padL}" y="${p.padT}" width="${p.w - p.padL - p.padR}" height="${p.h - p.padT - p.padB}"/></clipPath></defs>`;
      yt.forEach((v) => (g += `<line x1="${p.padL}" x2="${p.w - p.padR}" y1="${p.Y(v)}" y2="${p.Y(v)}" stroke="var(--rule)" ${v ? 'stroke-dasharray="3 4"' : ""}/><text x="${p.padL - 6}" y="${p.Y(v) + 4}" text-anchor="end">${v}</text>`));
      xt.forEach((v) => (g += `<line x1="${p.X(v)}" x2="${p.X(v)}" y1="${p.padT}" y2="${p.h - p.padB}" stroke="var(--rule)" ${v ? 'stroke-dasharray="3 4"' : ""}/><text x="${p.X(v)}" y="${p.h - 8}" text-anchor="middle">${v}</text>`));
      if (xl) g += `<text x="${p.w - p.padR}" y="${p.h - p.padB - 6}" text-anchor="end">${xl}</text>`;
      if (yl) g += `<text x="${p.padL + 6}" y="${p.padT + 12}">${yl}</text>`;
      return g;
    };
    p.svg = (inner) => `<svg class="chart" viewBox="0 0 ${p.w} ${p.h}">${inner}</svg>`;
    p.line = (d, col, extra = "") => `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" clip-path="url(#${p.cid})" ${extra}/>`;
    return p;
  };
  U.f = (x, d = 3) => (Math.abs(x) < 1e-12 ? "0" : Number(x).toFixed(d).replace(/\.?0+$/, "") || "0");
  U.rng = (seed) => { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; };
  U.gauss = (r) => { const u = Math.max(1e-9, r()), v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  U.npdf = (x, m, s) => Math.exp(-((x - m) ** 2) / (2 * s * s)) / (Math.sqrt(2 * Math.PI) * s);
  const C1 = "var(--accent)", C2 = "var(--hi)", C3 = "var(--good)", C4 = "var(--bad)";

  /* 1. Activation functions */
  W.activation = (el) => {
    const b = U.box(el, "Activation function explorer", "Pick a function, move x, and watch the value and the gradient. Notice where the gradient dies.");
    b.insertAdjacentHTML("beforeend", `${U.seg("f", [["sigmoid", "Sigmoid"], ["tanh", "Tanh"], ["relu", "ReLU"], ["leaky", "Leaky ReLU"], ["linear", "Linear"]], "sigmoid")}
      <div class="ctrls">${U.range("x", "Input x", -6, 6, 0.1, 2)}</div><div class="plot"></div><div class="readout"></div>`);
    const F = {
      sigmoid: [(x) => 1 / (1 + Math.exp(-x)), (x) => { const s = 1 / (1 + Math.exp(-x)); return s * (1 - s); }, "σ(x) = 1/(1+e^(−x)) · range (0,1) · max gradient 0.25 at x=0", "Output layer for binary classification (with BCE). Saturates for |x| > 4 → vanishing gradient."],
      tanh: [Math.tanh, (x) => 1 - Math.tanh(x) ** 2, "tanh(x) · range (−1,1) · zero-centred · max gradient 1", "Zero-centred, still saturates. Used inside RNN/LSTM cells."],
      relu: [(x) => Math.max(0, x), (x) => (x > 0 ? 1 : 0), "ReLU(x) = max(0, x) · gradient 1 for x>0, 0 for x<0", "Default for hidden layers: cheap, no saturation for x>0. Risk: dead neurons for x<0."],
      leaky: [(x) => (x > 0 ? x : 0.1 * x), (x) => (x > 0 ? 1 : 0.1), "LeakyReLU(x) = x if x>0 else αx (α=0.1 here)", "Keeps a small gradient for x<0, fixing dying ReLU."],
      linear: [(x) => x, () => 1, "f(x) = x", "Output layer for regression / continuous reconstruction (with MSE)."]
    };
    const draw = (s) => {
      const [f, df, eq, use] = F[s.f];
      const p = U.plot({ x0: -6, x1: 6, y0: -1.5, y1: 1.5 * (s.f === "relu" || s.f === "leaky" || s.f === "linear" ? 4 : 1) });
      const y1 = p.y1; const yt = y1 > 2 ? [-1, 0, 2, 4, 6] : [-1, 0, 1];
      b.querySelector(".plot").innerHTML = p.svg(p.frame([-6, -3, 0, 3, 6], yt) + p.line(p.path(f), C1) + p.line(p.path(df), C2, 'stroke-dasharray="6 4"') +
        `<circle cx="${p.X(s.x)}" cy="${p.Y(f(s.x))}" r="6" fill="${C1}"/><circle cx="${p.X(s.x)}" cy="${p.Y(df(s.x))}" r="5" fill="${C2}"/>`) +
        `<div class="legend"><span><i style="background:${C1}"></i>f(x)</span><span><i style="background:${C2}"></i>f′(x) (gradient)</span></div>`;
      b.querySelector(".readout").innerHTML = `${eq}<br>f(${s.x}) = <b>${U.f(f(s.x), 4)}</b> · f′(${s.x}) = <b>${U.f(df(s.x), 4)}</b><br><span class="muted">${use}</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 2. Optimizer race on an elongated bowl */
  W.optim = (el) => {
    const b = U.box(el, "Optimizer race", "Loss surface f(x,y) = 0.5·x² + 5·y² (a long narrow valley). All four optimizers start at the same point. Change the learning rate and watch who zig-zags and who glides.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("lr", "Learning rate η", 0.01, 0.25, 0.01, 0.15)}${U.range("steps", "Steps", 5, 80, 1, 30)}</div><div class="plot"></div><div class="readout"></div>`);
    const f = (x, y) => 0.5 * x * x + 5 * y * y, g = (x, y) => [x, 10 * y];
    const run = (kind, lr, n) => {
      let x = -4.5, y = 1.6, vx = 0, vy = 0, sx = 0, sy = 0, mx = 0, my = 0, t = 0; const pts = [[x, y]];
      for (let i = 0; i < n; i++) {
        const [gx, gy] = g(x, y); t++;
        if (kind === "gd") { x -= lr * gx; y -= lr * gy; }
        else if (kind === "mom") { vx = 0.9 * vx + lr * gx; vy = 0.9 * vy + lr * gy; x -= vx; y -= vy; }
        else if (kind === "rms") { sx = 0.9 * sx + 0.1 * gx * gx; sy = 0.9 * sy + 0.1 * gy * gy; x -= (lr * gx) / (Math.sqrt(sx) + 1e-8); y -= (lr * gy) / (Math.sqrt(sy) + 1e-8); }
        else { mx = 0.9 * mx + 0.1 * gx; my = 0.9 * my + 0.1 * gy; sx = 0.999 * sx + 0.001 * gx * gx; sy = 0.999 * sy + 0.001 * gy * gy; const mhx = mx / (1 - 0.9 ** t), mhy = my / (1 - 0.9 ** t), shx = sx / (1 - 0.999 ** t), shy = sy / (1 - 0.999 ** t); x -= (lr * 2 * mhx) / (Math.sqrt(shx) + 1e-8); y -= (lr * 2 * mhy) / (Math.sqrt(shy) + 1e-8); }
        if (!isFinite(x) || Math.abs(x) > 50 || Math.abs(y) > 50) { pts.push([Math.sign(x) * 50, Math.sign(y) * 50]); break; }
        pts.push([x, y]);
      }
      return pts;
    };
    const draw = (s) => {
      const p = U.plot({ x0: -5, x1: 5, y0: -2, y1: 2, h: 260 });
      let g = p.frame([-4, -2, 0, 2, 4], [-2, -1, 0, 1, 2]);
      [0.5, 2, 5, 10, 16].forEach((lv) => { const a = Math.sqrt(2 * lv), c = Math.sqrt(lv / 5); g += `<ellipse cx="${p.X(0)}" cy="${p.Y(0)}" rx="${p.X(a) - p.X(0)}" ry="${p.Y(0) - p.Y(c)}" fill="none" stroke="var(--rule)" stroke-width="1.2" clip-path="url(#${p.cid})"/>`; });
      const kinds = [["gd", "SGD", C4], ["mom", "Momentum (β=0.9)", C2], ["rms", "RMSProp", C3], ["adam", "Adam", C1]];
      let out = [];
      kinds.forEach(([k, name, col]) => { const pts = run(k, s.lr, s.steps); g += `<polyline points="${pts.map(([x, y]) => p.X(x).toFixed(1) + "," + p.Y(y).toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="2" clip-path="url(#${p.cid})"/>`; const [x, y] = pts[pts.length - 1]; g += `<circle cx="${p.X(Math.max(-5, Math.min(5, x)))}" cy="${p.Y(Math.max(-2, Math.min(2, y)))}" r="4" fill="${col}"/>`; out.push(`${name}: loss <b>${Math.abs(x) >= 50 ? "diverged" : U.f(f(x, y), 4)}</b>`); });
      g += `<circle cx="${p.X(0)}" cy="${p.Y(0)}" r="4" fill="var(--ink)"/>`;
      b.querySelector(".plot").innerHTML = p.svg(g) + `<div class="legend">${kinds.map(([, n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}</div>`;
      b.querySelector(".readout").innerHTML = out.join(" · ") + `<br><span class="muted">Plain gradient descent diverges along the steep y-axis once η > 0.2 (since 1 − 10η < −1). RMSProp and Adam divide by a running RMS of the gradient, so each axis gets its own effective step size.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 3. Convolution stepper */
  W.conv = (el) => {
    const b = U.box(el, "Convolution, step by step", "A 3×3 kernel slides over a 6×6 image. Each output cell is an element-wise multiply-and-sum. Change padding and stride, then step through.");
    const img = [[3, 0, 1, 2, 7, 4], [1, 5, 8, 9, 3, 1], [2, 7, 2, 5, 1, 3], [0, 1, 3, 1, 7, 8], [4, 2, 1, 6, 2, 8], [2, 4, 5, 2, 3, 9]];
    const K = { vert: [[1, 0, -1], [1, 0, -1], [1, 0, -1]], horiz: [[1, 1, 1], [0, 0, 0], [-1, -1, -1]], sharp: [[0, -1, 0], [-1, 5, -1], [0, -1, 0]], box: [[1, 1, 1], [1, 1, 1], [1, 1, 1]] };
    b.insertAdjacentHTML("beforeend", `<div class="row">${U.seg("k", [["vert", "Vertical edge"], ["horiz", "Horizontal edge"], ["sharp", "Sharpen"], ["box", "Box sum"]], "vert")}</div>
      <div class="row">${U.seg("p", [["0", "padding 0 (valid)"], ["1", "padding 1 (same)"]], "0")}${U.seg("s", [["1", "stride 1"], ["2", "stride 2"]], "1")}</div>
      <div class="row" style="align-items:flex-start;gap:20px"><div><div class="eyebrow">Input (with padding)</div><div class="gin" style="margin-top:6px"></div></div><div><div class="eyebrow">Kernel</div><div class="gk" style="margin-top:6px"></div></div><div><div class="eyebrow">Feature map</div><div class="gout" style="margin-top:6px"></div></div></div>
      <div class="row"><button class="btn small" data-act="step">Step →</button><button class="btn quiet small" data-act="all">Fill all</button><button class="btn quiet small" data-act="reset">Reset</button></div>
      <div class="readout"></div>`);
    let pos = -1, st;
    const grid = (m, cls) => `<div class="grid-cells" style="grid-template-columns:repeat(${m[0].length},30px)">${m.map((r, i) => r.map((v, j) => `<span class="${cls ? cls(i, j) : ""}">${v === null ? "" : v}</span>`).join("")).join("")}</div>`;
    const draw = () => {
      const p = +st.p, s = +st.s, k = K[st.k]; const n = 6 + 2 * p;
      const X = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i < p || j < p || i >= 6 + p || j >= 6 + p ? 0 : img[i - p][j - p])));
      const o = Math.floor((6 + 2 * p - 3) / s) + 1;
      const out = Array.from({ length: o }, () => Array(o).fill(null)); let calc = "";
      const val = (r, c) => { let sum = 0, terms = []; for (let a = 0; a < 3; a++) for (let bb = 0; bb < 3; bb++) { sum += X[r * s + a][c * s + bb] * k[a][bb]; if (k[a][bb]) terms.push(`${X[r * s + a][c * s + bb]}×${k[a][bb]}`); } return [sum, terms]; };
      for (let q = 0; q <= Math.min(pos, o * o - 1); q++) { const r = Math.floor(q / o), c = q % o; out[r][c] = val(r, c)[0]; }
      let hl = null;
      if (pos >= 0 && pos < o * o) { const r = Math.floor(pos / o), c = pos % o; hl = [r * s, c * s]; const [sum, terms] = val(r, c); calc = `Output[${r}][${c}] = ${terms.join(" + ").replace(/\+ -/g, "− ")} = <b>${sum}</b>`; }
      b.querySelector(".gin").innerHTML = grid(X, (i, j) => (hl && i >= hl[0] && i < hl[0] + 3 && j >= hl[1] && j < hl[1] + 3 ? "hl" : (i < p || j < p || i >= 6 + p || j >= 6 + p) ? "pad" : ""));
      b.querySelector(".gk").innerHTML = grid(k);
      b.querySelector(".gout").innerHTML = grid(out, (i, j) => (pos >= 0 && i * o + j === Math.min(pos, o * o - 1) ? "out" : ""));
      b.querySelector(".readout").innerHTML = `Output size = ⌊(n + 2p − f)/s⌋ + 1 = ⌊(6 + ${2 * p} − 3)/${s}⌋ + 1 = <b>${o} × ${o}</b>${p ? " (same as input: no border information lost)" : " (border pixels are visited fewer times)"}<br>${calc || "Press Step to slide the kernel."}`;
    };
    st = U.bind(b, () => { pos = -1; draw(); });
    b.querySelectorAll("[data-act]").forEach((x) => (x.onclick = () => { const o = Math.floor((6 + 2 * +st.p - 3) / +st.s) + 1; if (x.dataset.act === "step") pos = Math.min(pos + 1, o * o - 1); else if (x.dataset.act === "all") pos = o * o - 1; else pos = -1; draw(); }));
    draw();
  };

  /* 4. CNN parameter + pooling calculator */
  W.cnncalc = (el) => {
    const b = U.box(el, "Layer calculator: conv vs dense", "Exam numericals ask for output shape and parameter count. Set the layer and read off both.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("n", "Input size n (n×n)", 4, 224, 1, 32)}${U.range("c", "Input channels", 1, 64, 1, 3)}${U.range("f", "Kernel f", 1, 7, 2, 3)}${U.range("k", "Number of filters", 1, 128, 1, 16)}${U.range("p", "Padding p", 0, 3, 1, 1)}${U.range("s", "Stride s", 1, 4, 1, 1)}${U.range("pool", "Max-pool window (stride = window)", 1, 4, 1, 2)}</div><div class="readout"></div>`);
    const draw = (s) => {
      const o = Math.floor((s.n + 2 * s.p - s.f) / s.s) + 1;
      const params = (s.f * s.f * s.c + 1) * s.k;
      const po = Math.floor(o / s.pool);
      const dense = (s.n * s.n * s.c) * (o * o * s.k) + o * o * s.k;
      b.querySelector(".readout").innerHTML = `Conv output: ⌊(${s.n} + ${2 * s.p} − ${s.f}) / ${s.s}⌋ + 1 = <b>${o} × ${o} × ${s.k}</b><br>
        Conv parameters: (f·f·C_in + 1)·K = (${s.f}·${s.f}·${s.c} + 1)·${s.k} = <b>${params.toLocaleString()}</b> (weights shared across positions)<br>
        After ${s.pool}×${s.pool} max-pool: <b>${po} × ${po} × ${s.k}</b> (pooling has 0 parameters; depth unchanged)<br>
        Flatten → vector of length <b>${(po * po * s.k).toLocaleString()}</b><br>
        <span class="muted">A dense layer producing the same ${o}×${o}×${s.k} output from the flattened ${s.n}×${s.n}×${s.c} input would need ≈ ${dense.toExponential(2)} parameters.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 5. Ensemble voting */
  W.ensemble = (el) => {
    const b = U.box(el, "Why ensembles work", "n independent classifiers, each correct with probability p, vote by majority. Accuracy of the vote:");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("p", "Single-model accuracy p", 0.4, 0.95, 0.01, 0.7)}${U.range("n", "Number of models n (odd)", 1, 21, 2, 5)}</div><div class="plot"></div><div class="readout"></div>`);
    const C = (n, k) => { let r = 1; for (let i = 1; i <= k; i++) r = (r * (n - k + i)) / i; return r; };
    const maj = (p, n) => { let s = 0; for (let k = Math.ceil((n + 1) / 2); k <= n; k++) s += C(n, k) * p ** k * (1 - p) ** (n - k); return s; };
    const draw = (s) => {
      const p = U.plot({ x0: 1, x1: 21, y0: 0.3, y1: 1, h: 200 });
      let g = p.frame([1, 5, 9, 13, 17, 21], [0.4, 0.6, 0.8, 1], "models n", "ensemble accuracy");
      let d = ""; for (let n = 1; n <= 21; n += 2) d += (d ? "L" : "M") + p.X(n) + "," + p.Y(maj(s.p, n));
      g += p.line(d, C1) + `<circle cx="${p.X(s.n)}" cy="${p.Y(maj(s.p, s.n))}" r="6" fill="${C2}"/>`;
      b.querySelector(".plot").innerHTML = p.svg(g);
      b.querySelector(".readout").innerHTML = `Majority vote of ${s.n} models at p = ${s.p}: <b>${U.f(maj(s.p, s.n) * 100, 1)}%</b><br><span class="muted">This only works when errors are independent (different architectures, data subsets or seeds) and p > 0.5. Below 0.5, voting makes things worse.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 6. Autoencoder bottleneck (DCT-based compression of a 16x16 glyph) */
  W.bottleneck = (el) => {
    const b = U.box(el, "Squeeze it through the bottleneck", "A 16×16 image (256 numbers) is encoded into k latent numbers and decoded back. Small k loses detail; k = 256 can simply copy the input. Add noise to see why a bottleneck also denoises.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("k", "Latent size k", 1, 256, 1, 24)}${U.range("noise", "Input noise", 0, 0.6, 0.05, 0)}</div>
      <div class="row" style="gap:18px;align-items:flex-start"><div><div class="eyebrow">Input x</div><canvas width="160" height="160" class="wcanvas c-in" style="width:160px;margin-top:6px"></canvas></div><div><div class="eyebrow">Reconstruction x̂</div><canvas width="160" height="160" class="wcanvas c-out" style="width:160px;margin-top:6px"></canvas></div></div><div class="readout"></div>`);
    const N = 16; const clean = [];
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { const x = (j - 7.5) / 7.5, y = (i - 7.5) / 7.5; const r = Math.hypot(x, y); let v = r < 0.95 && r > 0.72 ? 1 : 0; if (Math.hypot(x + 0.33, y + 0.3) < 0.13 || Math.hypot(x - 0.33, y + 0.3) < 0.13) v = 1; if (y > 0.15 && y < 0.42 && Math.abs(x) < 0.5 && Math.abs(y - (0.2 + 0.5 * x * x)) < 0.12) v = 1; clean.push(v); }
    const cosT = []; for (let k = 0; k < N; k++) for (let n = 0; n < N; n++) cosT.push(Math.cos((Math.PI * (2 * n + 1) * k) / (2 * N)) * (k === 0 ? Math.sqrt(1 / N) : Math.sqrt(2 / N)));
    const dct2 = (a) => { const t = new Float64Array(N * N), o = new Float64Array(N * N); for (let i = 0; i < N; i++) for (let k = 0; k < N; k++) { let s = 0; for (let n = 0; n < N; n++) s += a[i * N + n] * cosT[k * N + n]; t[i * N + k] = s; } for (let k = 0; k < N; k++) for (let j = 0; j < N; j++) { let s = 0; for (let n = 0; n < N; n++) s += t[n * N + j] * cosT[k * N + n]; o[k * N + j] = s; } return o; };
    const idct2 = (c) => { const t = new Float64Array(N * N), o = new Float64Array(N * N); for (let k = 0; k < N; k++) for (let n = 0; n < N; n++) { let s = 0; for (let kk = 0; kk < N; kk++) s += c[kk * N + n] * cosT[kk * N + k]; t[k * N + n] = s; } for (let i = 0; i < N; i++) for (let n = 0; n < N; n++) { let s = 0; for (let kk = 0; kk < N; kk++) s += t[i * N + kk] * cosT[kk * N + n]; o[i * N + n] = s; } return o; };
    const order = []; for (let s = 0; s < 2 * N - 1; s++) for (let i = 0; i < N; i++) { const j = s - i; if (j >= 0 && j < N) order.push(i * N + j); }
    const paint = (cv, a) => { const ctx = cv.getContext("2d"); const ink = U.css("--ink"), bg = U.css("--sheet-2"); ctx.fillStyle = bg; ctx.fillRect(0, 0, 160, 160); ctx.fillStyle = ink; for (let i = 0; i < N * N; i++) { const v = Math.max(0, Math.min(1, a[i])); ctx.globalAlpha = v; ctx.fillRect((i % N) * 10, Math.floor(i / N) * 10, 10, 10); } ctx.globalAlpha = 1; };
    const draw = (s) => {
      const r = U.rng(7); const x = clean.map((v) => v + s.noise * U.gauss(r));
      const c = dct2(x); const keep = new Set(order.slice(0, s.k)); const ck = c.map((v, i) => (keep.has(i) ? v : 0)); const xh = idct2(ck);
      paint(b.querySelector(".c-in"), x); paint(b.querySelector(".c-out"), xh);
      let mseIn = 0, mseClean = 0; for (let i = 0; i < N * N; i++) { mseIn += (xh[i] - x[i]) ** 2; mseClean += (xh[i] - clean[i]) ** 2; }
      const regime = s.k < 256 ? `<b>Undercomplete</b> (k = ${s.k} < 256): forced to keep only the most important structure.` : `<b>k = input size</b>: the network can learn the identity map and copy noise straight through. An overcomplete AE (k > input) has the same problem unless it is regularised.`;
      b.querySelector(".readout").innerHTML = `Compression 256 → ${s.k} (${U.f(256 / s.k, 1)}×)<br>Reconstruction MSE vs noisy input: <b>${U.f(mseIn / 256, 4)}</b> · MSE vs clean image: <b>${U.f(mseClean / 256, 4)}</b><br>${regime}${s.noise > 0 ? `<br><span class="muted">With noise on, a moderate k gives a lower error against the clean image than k = 256. That is the denoising-AE idea: corrupt the input, reconstruct the clean target.</span>` : ""}`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 7. AE forward pass numerical trainer */
  W.aenum = (el) => {
    const b = U.box(el, "Numerical drill: one neuron, then the loss", "Exams give inputs, weights and a bias and ask for a neuron's output, or give x and x̂ and ask for the loss. Generate a fresh problem, solve it on paper, then check.");
    b.insertAdjacentHTML("beforeend", `<div class="row">${U.seg("t", [["neuron", "Neuron output (ReLU)"], ["mse", "MSE loss"], ["bce", "BCE loss"]], "neuron")}<button class="btn small" data-act="new">New problem</button></div><div class="readout prob"></div><div class="natbox"><input type="text" class="tinput" placeholder="Your answer" aria-label="Your answer"><button class="btn quiet small" data-act="check">Check</button></div><div class="small res"></div>`);
    let st, ans, sol;
    const r = U.rng(Date.now() % 100000);
    const rv = (a, bb, d = 1) => Math.round((a + (bb - a) * r()) * 10 ** d) / 10 ** d;
    const gen = () => {
      if (st.t === "neuron") {
        const x = [rv(0, 1), rv(0, 1), rv(0, 1), rv(0, 1)], w = [rv(-0.8, 0.8), rv(-0.8, 0.8), rv(-0.8, 0.8), rv(-0.8, 0.8)], bias = rv(-0.2, 0.2, 2);
        const z = x.reduce((s, v, i) => s + v * w[i], bias); ans = Math.max(0, z);
        b.querySelector(".prob").innerHTML = `x = [${x.join(", ")}] · w = [${w.join(", ")}] · b = ${bias}<br>Find a = ReLU(w·x + b). Round to 3 decimals.`;
        sol = `z = ${x.map((v, i) => `${v}×${w[i]}`).join(" + ")} + ${bias} = ${U.f(z, 4)} → ReLU → <b>${U.f(ans, 4)}</b>`;
      } else if (st.t === "mse") {
        const x = [rv(0, 1), rv(0, 1), rv(0, 1), rv(0, 1)], xh = x.map((v) => Math.round((v + rv(-0.3, 0.3)) * 10) / 10);
        ans = x.reduce((s, v, i) => s + (v - xh[i]) ** 2, 0) / 4;
        b.querySelector(".prob").innerHTML = `x = [${x.join(", ")}] · x̂ = [${xh.join(", ")}]<br>Find the mean squared error (average over the 4 values).`;
        sol = `MSE = (${x.map((v, i) => `(${v}−${xh[i]})²`).join(" + ")}) / 4 = <b>${U.f(ans, 4)}</b>`;
      } else {
        const y = [1, 0, 1, 0].sort(() => r() - 0.5), yh = y.map(() => rv(0.1, 0.9));
        ans = -y.reduce((s, v, i) => s + v * Math.log(yh[i]) + (1 - v) * Math.log(1 - yh[i]), 0) / 4;
        b.querySelector(".prob").innerHTML = `target x = [${y.join(", ")}] · sigmoid output x̂ = [${yh.join(", ")}]<br>Find the binary cross-entropy (natural log, averaged over 4).`;
        sol = `BCE = −¼ Σ [x·ln x̂ + (1−x)·ln(1−x̂)] = <b>${U.f(ans, 4)}</b>`;
      }
      b.querySelector(".res").innerHTML = ""; b.querySelector("input").value = "";
    };
    st = U.bind(b, gen);
    b.querySelector('[data-act="new"]').onclick = gen;
    b.querySelector('[data-act="check"]').onclick = () => { const v = parseFloat(b.querySelector("input").value); const ok = Math.abs(v - ans) <= Math.max(0.005, Math.abs(ans) * 0.01); b.querySelector(".res").innerHTML = `<div class="callout ${ok ? "good" : "bad"}">${ok ? "Correct. " : "Not quite. "}${sol}</div>`; };
    gen();
  };

  /* 8. KL divergence between two Gaussians */
  W.kl = (el) => {
    const b = U.box(el, "KL divergence playground", "P (blue) is the true distribution, Q (amber) the approximation. Move them and watch KL(P‖Q) and KL(Q‖P). They are not equal: KL is not a distance.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("m1", "μ_P", -3, 3, 0.1, 0)}${U.range("s1", "σ_P", 0.3, 3, 0.1, 1)}${U.range("m2", "μ_Q", -3, 3, 0.1, 1)}${U.range("s2", "σ_Q", 0.3, 3, 0.1, 1.5)}</div><div class="plot"></div><div class="readout"></div>`);
    const KL = (m1, s1, m2, s2) => Math.log(s2 / s1) + (s1 * s1 + (m1 - m2) ** 2) / (2 * s2 * s2) - 0.5;
    const draw = (s) => {
      const top = Math.max(U.npdf(0, 0, s.s1), U.npdf(0, 0, s.s2)) * 1.1;
      const p = U.plot({ x0: -6, x1: 6, y0: 0, y1: top, h: 210 });
      const g = p.frame([-6, -3, 0, 3, 6], [0]) + `<path d="${p.path((x) => U.npdf(x, s.m1, s.s1))}L${p.X(6)},${p.Y(0)}L${p.X(-6)},${p.Y(0)}Z" fill="color-mix(in srgb, var(--accent) 18%, transparent)"/>` + p.line(p.path((x) => U.npdf(x, s.m1, s.s1)), C1) + p.line(p.path((x) => U.npdf(x, s.m2, s.s2)), C2);
      b.querySelector(".plot").innerHTML = p.svg(g) + `<div class="legend"><span><i style="background:${C1}"></i>P = N(${s.m1}, ${s.s1}²)</span><span><i style="background:${C2}"></i>Q = N(${s.m2}, ${s.s2}²)</span></div>`;
      const a = KL(s.m1, s.s1, s.m2, s.s2), c = KL(s.m2, s.s2, s.m1, s.s1);
      b.querySelector(".readout").innerHTML = `KL(P‖Q) = ln(σ_Q/σ_P) + (σ_P² + (μ_P−μ_Q)²)/(2σ_Q²) − ½ = <b>${U.f(a, 4)}</b> nats<br>KL(Q‖P) = <b>${U.f(c, 4)}</b> nats ${Math.abs(a - c) < 1e-6 ? "(equal only because the σ are equal)" : "← different: KL is asymmetric"}<br><span class="muted">Both are ≥ 0 and both are 0 only when P = Q.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 9. Forward vs reverse KL on a bimodal target */
  W.klmodes = (el) => {
    const b = U.box(el, "Mode covering vs mode seeking", "P is a two-peaked distribution. We fit a single Gaussian Q by minimising each KL direction. Pull the peaks apart.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("d", "Distance between peaks", 0.5, 7, 0.1, 4)}${U.range("w", "Weight of left peak", 0.2, 0.8, 0.05, 0.5)}</div><div class="plot"></div><div class="readout"></div>`);
    const xs = []; for (let i = 0; i <= 300; i++) xs.push(-9 + (18 * i) / 300); const dx = 18 / 300;
    const draw = (s) => {
      const P = (x) => s.w * U.npdf(x, -s.d / 2, 0.7) + (1 - s.w) * U.npdf(x, s.d / 2, 0.7);
      const mean = s.w * (-s.d / 2) + (1 - s.w) * (s.d / 2); const varr = 0.49 + s.w * (s.d / 2 + mean) ** 2 * 1 + (1 - s.w) * (s.d / 2 - mean) ** 2;
      const fwd = [mean, Math.sqrt(varr)];
      let best = [0, 1, Infinity]; const pv = xs.map(P);
      for (let m = -5; m <= 5; m += 0.1) for (let sg = 0.3; sg <= 4; sg += 0.05) { let kl = 0; for (let i = 0; i < xs.length; i++) { const q = U.npdf(xs[i], m, sg); if (q > 1e-12) kl += q * (Math.log(q) - Math.log(pv[i] + 1e-300)) * dx; } if (kl < best[2]) best = [m, sg, kl]; }
      const p = U.plot({ x0: -8, x1: 8, y0: 0, y1: 0.65, h: 210 });
      const g = p.frame([-8, -4, 0, 4, 8], [0]) + `<path d="${p.path(P)}L${p.X(8)},${p.Y(0)}L${p.X(-8)},${p.Y(0)}Z" fill="color-mix(in srgb, var(--ink) 12%, transparent)"/>` + p.line(p.path(P), "var(--ink)") + p.line(p.path((x) => U.npdf(x, fwd[0], fwd[1])), C1) + p.line(p.path((x) => U.npdf(x, best[0], best[1])), C4);
      b.querySelector(".plot").innerHTML = p.svg(g) + `<div class="legend"><span><i style="background:var(--ink)"></i>target P</span><span><i style="background:${C1}"></i>argmin KL(P‖Q): forward, mode covering</span><span><i style="background:${C4}"></i>argmin KL(Q‖P): reverse, mode seeking</span></div>`;
      b.querySelector(".readout").innerHTML = `Forward KL fit: μ = ${U.f(fwd[0], 2)}, σ = ${U.f(fwd[1], 2)}. It must put mass wherever P has mass, so it spreads over both peaks (and the empty gap).<br>Reverse KL fit: μ = ${U.f(best[0], 2)}, σ = ${U.f(best[1], 2)}. It is punished for putting mass where P is ~0, so it locks onto one peak.<br><span class="muted">VAEs minimise the reverse direction KL(q(z|x)‖p(z|x)) inside the ELBO, which is one reason they can under-represent modes.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 10. Entropy / cross-entropy */
  W.entropy = (el) => {
    const b = U.box(el, "Self-information, entropy, cross-entropy", "Two coins. P is the real coin, Q is what your model believes. Cross-entropy = entropy + KL.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("p", "P(heads) of the real coin", 0.01, 0.99, 0.01, 0.5)}${U.range("q", "Q(heads) believed by model", 0.01, 0.99, 0.01, 0.8)}</div><div class="readout"></div>`);
    const L = Math.log2;
    const draw = (s) => {
      const H = -(s.p * L(s.p) + (1 - s.p) * L(1 - s.p)), CE = -(s.p * L(s.q) + (1 - s.p) * L(1 - s.q)), KL = CE - H;
      b.querySelector(".readout").innerHTML = `Self-information of heads under P: I = −log₂ p = <b>${U.f(-L(s.p), 3)}</b> bits (rare events carry more information)<br>Entropy H(P) = <b>${U.f(H, 4)}</b> bits ${Math.abs(s.p - 0.5) < 0.005 ? "(maximum: a fair coin is the most uncertain)" : ""}<br>Cross-entropy H(P,Q) = −Σ p log₂ q = <b>${U.f(CE, 4)}</b> bits<br>KL(P‖Q) = H(P,Q) − H(P) = <b>${U.f(KL, 4)}</b> bits<br><span class="muted">Minimising cross-entropy with a fixed P is the same as minimising KL(P‖Q). That is why classification uses the cross-entropy loss.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 11. Reparameterization trick sampler */
  W.reparam = (el) => {
    const b = U.box(el, "The reparameterisation trick", "Sampling z ~ N(μ, σ²) directly blocks gradients. Rewrite it as z = μ + σ·ε with ε ~ N(0,1): randomness moves into ε, and μ, σ stay on a differentiable path.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("m", "μ (encoder output)", -2, 2, 0.1, 0.5)}${U.range("lv", "log σ² (encoder output)", -3, 2, 0.1, 0)}</div><div class="row"><button class="btn small" data-act="one">Draw one ε</button><button class="btn quiet small" data-act="many">Draw 300</button><button class="btn quiet small" data-act="clr">Clear</button></div><div class="plot"></div><div class="readout"></div>`);
    let samples = []; const r = U.rng(42); let lastE = null; let st;
    const draw = () => {
      const s = st; const sg = Math.exp(s.lv / 2);
      const z = samples.map((e) => s.m + sg * e);
      const p = U.plot({ x0: -5, x1: 5, y0: 0, y1: Math.max(0.5, U.npdf(0, 0, sg) * 1.15), h: 200 });
      const bins = new Array(40).fill(0); z.forEach((v) => { const k = Math.floor((v + 5) / 0.25); if (k >= 0 && k < 40) bins[k]++; });
      let g = p.frame([-4, -2, 0, 2, 4], [0]);
      if (z.length) bins.forEach((c, k) => { const h = c / (z.length * 0.25); g += `<rect x="${p.X(-5 + k * 0.25) + 1}" y="${p.Y(h)}" width="${p.X(0.25) - p.X(0) - 2}" height="${p.Y(0) - p.Y(h)}" fill="color-mix(in srgb, var(--accent) 35%, transparent)"/>`; });
      g += p.line(p.path((x) => U.npdf(x, s.m, sg)), C1);
      if (lastE != null) g += `<line x1="${p.X(s.m + sg * lastE)}" x2="${p.X(s.m + sg * lastE)}" y1="${p.Y(0)}" y2="${p.padT}" stroke="${C2}" stroke-width="3"/>`;
      b.querySelector(".plot").innerHTML = p.svg(g);
      b.querySelector(".readout").innerHTML = `σ = exp(½·log σ²) = exp(${U.f(s.lv / 2, 3)}) = <b>${U.f(sg, 4)}</b> · variance σ² = ${U.f(sg * sg, 4)}<br>${lastE != null ? `ε = ${U.f(lastE, 3)} → z = μ + σ·ε = ${s.m} + ${U.f(sg, 3)}×${U.f(lastE, 3)} = <b>${U.f(s.m + sg * lastE, 4)}</b><br>` : ""}∂z/∂μ = 1 · ∂z/∂σ = ε (both finite, so backprop reaches the encoder)<br><span class="muted">Why log σ²? The encoder's last layer is linear (no activation), so it may output any real number; exponentiating guarantees a positive variance.</span>`;
    };
    st = U.bind(b, draw);
    b.querySelector('[data-act="one"]').onclick = () => { lastE = U.gauss(r); samples.push(lastE); draw(); };
    b.querySelector('[data-act="many"]').onclick = () => { for (let i = 0; i < 300; i++) samples.push(U.gauss(r)); lastE = samples[samples.length - 1]; draw(); };
    b.querySelector('[data-act="clr"]').onclick = () => { samples = []; lastE = null; draw(); };
    draw();
  };

  /* 12. VAE loss calculator */
  W.vaeloss = (el) => {
    const b = U.box(el, "VAE loss calculator", "Enter the encoder outputs and a reconstruction. This mirrors the lecture's worked example: total loss = reconstruction (MSE) + KL to N(0, I).");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">
      <div class="ctrl"><label>μ (comma-separated)</label><input type="text" data-k="mu" value="0.043, -0.66"></div>
      <div class="ctrl"><label>log σ² (comma-separated)</label><input type="text" data-k="lv" value="0.732, 0.302"></div>
      <div class="ctrl"><label>Input x</label><input type="text" data-k="x" value="5.1, 3.5, 1.4, 0.2"></div>
      <div class="ctrl"><label>Reconstruction x̂</label><input type="text" data-k="xh" value="0.103, 0.257, 0.12, 0.31"></div></div><div class="readout"></div>`);
    const nums = (s) => String(s).split(/[,\s]+/).filter(Boolean).map(Number);
    const draw = (s) => {
      const mu = nums(s.mu), lv = nums(s.lv), x = nums(s.x), xh = nums(s.xh);
      if (mu.length !== lv.length || x.length !== xh.length || [...mu, ...lv, ...x, ...xh].some(isNaN)) { b.querySelector(".readout").innerHTML = "μ and log σ² need the same length, and x and x̂ need the same length."; return; }
      const mse = x.reduce((a, v, i) => a + (v - xh[i]) ** 2, 0) / x.length;
      const terms = mu.map((m, i) => m * m + Math.exp(lv[i]) - lv[i] - 1); const kl = 0.5 * terms.reduce((a, v) => a + v, 0);
      const sig = lv.map((v) => Math.exp(v / 2));
      b.querySelector(".readout").innerHTML = `σ² = e^(log σ²) = [${lv.map((v) => U.f(Math.exp(v), 3)).join(", ")}] · σ = [${sig.map((v) => U.f(v, 3)).join(", ")}]<br>
        Reconstruction (MSE) = <b>${U.f(mse, 4)}</b><br>
        KL = ½ Σ (μ² + σ² − log σ² − 1) = ½ × (${terms.map((t) => U.f(t, 4)).join(" + ")}) = <b>${U.f(kl, 4)}</b><br>
        Total VAE loss = <b>${U.f(mse + kl, 4)}</b><br><span class="muted">KL is exactly 0 when every μ = 0 and every log σ² = 0, i.e. q(z|x) = N(0, I).</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 13. Latent interpolation: pixel space vs latent space */
  W.interp = (el) => {
    const b = U.box(el, "Interpolate in pixel space or in latent space?", "Blend a circle into a 5-point star. Pixel blending cross-fades two images (ghosting). Latent blending changes the shape parameters, so every in-between frame is a valid shape.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("a", "α (0 = circle, 1 = star)", 0, 1, 0.05, 0.5)}</div><div class="row" style="gap:18px"><div><div class="eyebrow">Pixel space: (1−α)x₁ + αx₂</div><canvas width="180" height="180" class="wcanvas c1" style="width:180px;margin-top:6px"></canvas></div><div><div class="eyebrow">Latent space: decode((1−α)z₁ + αz₂)</div><canvas width="180" height="180" class="wcanvas c2" style="width:180px;margin-top:6px"></canvas></div></div><div class="readout"></div>`);
    const shape = (ctx, depth, alpha) => { ctx.beginPath(); for (let i = 0; i <= 200; i++) { const t = (i / 200) * Math.PI * 2; const R = Math.max(18, 62 * (1 - depth * 0.45 * (1 - Math.cos(5 * t)))); const x = 90 + R * Math.sin(t), y = 92 - R * Math.cos(t); if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y); } ctx.closePath(); ctx.globalAlpha = alpha; ctx.fill(); ctx.globalAlpha = 1; };
    const draw = (s) => {
      const acc = U.css("--accent"), bg = U.css("--sheet-2");
      const c1 = b.querySelector(".c1").getContext("2d"), c2 = b.querySelector(".c2").getContext("2d");
      [c1, c2].forEach((c) => { c.fillStyle = bg; c.fillRect(0, 0, 180, 180); c.fillStyle = acc; });
      shape(c1, 0, 1 - s.a); shape(c1, 1, s.a); shape(c2, s.a, 1);
      b.querySelector(".readout").innerHTML = `z₁ = [pointiness 0.0] · z₂ = [pointiness 1.0] · z = ${U.f(1 - s.a, 2)}·z₁ + ${U.f(s.a, 2)}·z₂ = [${U.f(s.a, 2)}]<br><span class="muted">This only works when the latent space is smooth and continuous. A plain autoencoder leaves gaps between codes; the KL term of a VAE packs codes near N(0, I), which makes interpolation meaningful.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 14. Beta-VAE traversal */
  W.betavae = (el) => {
    const b = U.box(el, "β-VAE: entangled vs disentangled latents", "We traverse one latent unit z₁ from −2 to +2 and decode. At β = 1 the unit mixes several factors. As β grows, each unit controls one factor, at the cost of blurrier reconstructions.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("beta", "β (weight on the KL term)", 0.5, 8, 0.5, 1)}</div><canvas width="560" height="110" class="wcanvas cv" style="aspect-ratio:560/110"></canvas><div class="readout"></div>`);
    const draw = (s) => {
      const cv = b.querySelector(".cv"), ctx = cv.getContext("2d"); const acc = U.css("--accent"), bg = U.css("--sheet-2"), ink = U.css("--ink-2");
      ctx.fillStyle = bg; ctx.fillRect(0, 0, 560, 110);
      const ent = Math.max(0, Math.min(1, (6 - s.beta) / 5)); const blur = Math.min(6, (s.beta - 1) * 0.8);
      for (let i = 0; i < 7; i++) {
        const z = -2 + (4 * i) / 6; const size = 18 + 7 * z * 1; const rot = ent * z * 0.5; const hue = ent * z * 0.35;
        ctx.save(); ctx.translate(40 + i * 80, 55); ctx.rotate(rot); ctx.filter = blur > 0 ? `blur(${blur.toFixed(1)}px)` : "none"; ctx.fillStyle = acc; ctx.globalAlpha = 0.65 + hue * 0.4; ctx.fillRect(-size / 2, -size / 2, size, size); ctx.restore();
        ctx.fillStyle = ink; ctx.font = "11px monospace"; ctx.textAlign = "center"; ctx.fillText(`z₁=${z.toFixed(1)}`, 40 + i * 80, 104);
      }
      ctx.filter = "none";
      b.querySelector(".readout").innerHTML = `Loss = reconstruction + <b>β</b>·KL(q(z|x) ‖ N(0, I))<br>Changing z₁ alters: size${ent > 0.15 ? " + rotation + shade (entangled)" : " only (disentangled)"} · reconstruction sharpness: ${s.beta <= 1.5 ? "high" : s.beta < 4 ? "medium" : "low (blurry)"}<br><span class="muted">β = 1 is the ordinary VAE. β &gt; 1 pushes the posterior harder toward the factorised prior, which encourages independent (disentangled) latent factors.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 15. GAN losses */
  W.ganloss = (el) => {
    const b = U.box(el, "GAN loss dials", "D(x) is the discriminator's probability that a real image is real. D(G(z)) is its probability that a fake image is real. Watch each player's loss.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("dx", "D(x) on a real sample", 0.01, 0.99, 0.01, 0.9)}${U.range("dg", "D(G(z)) on a fake sample", 0.01, 0.99, 0.01, 0.1)}</div><div class="plot"></div><div class="readout"></div>`);
    const draw = (s) => {
      const p = U.plot({ x0: 0, x1: 1, y0: -5, y1: 5, h: 230 });
      const g = p.frame([0, 0.25, 0.5, 0.75, 1], [-4, -2, 0, 2, 4], "D(G(z))", "generator objective (minimise)") +
        p.line(p.path((d) => -Math.log(d)), C1) + p.line(p.path((d) => Math.log(1 - d)), C2) +
        `<circle cx="${p.X(s.dg)}" cy="${p.Y(-Math.log(s.dg))}" r="5" fill="${C1}"/><circle cx="${p.X(s.dg)}" cy="${p.Y(Math.log(1 - s.dg))}" r="5" fill="${C2}"/>`;
      b.querySelector(".plot").innerHTML = p.svg(g) + `<div class="legend"><span><i style="background:${C1}"></i>non-saturating: −log D(G(z))</span><span><i style="background:${C2}"></i>minimax: log(1 − D(G(z)))</span></div>`;
      const Ld = -Math.log(s.dx) - Math.log(1 - s.dg);
      b.querySelector(".readout").innerHTML = `Discriminator: L_D = −log D(x) − log(1 − D(G(z))) = ${U.f(-Math.log(s.dx), 3)} + ${U.f(-Math.log(1 - s.dg), 3)} = <b>${U.f(Ld, 4)}</b><br>
        Value V = log D(x) + log(1 − D(G(z))) = <b>${U.f(-Ld, 4)}</b> (D maximises V, G minimises it)<br>
        Generator, minimax form: log(1 − D(G(z))) = <b>${U.f(Math.log(1 - s.dg), 4)}</b> · gradient wrt D(G(z)): ${U.f(-1 / (1 - s.dg), 3)}<br>
        Generator, non-saturating form: −log D(G(z)) = <b>${U.f(-Math.log(s.dg), 4)}</b> · gradient: ${U.f(-1 / s.dg, 3)}<br>
        <span class="muted">Early in training D(G(z)) ≈ 0. The minimax curve is flat there (gradient ≈ −1), the non-saturating one is steep (gradient ≈ −1/D(G(z))). That is why practical GANs train G with −log D(G(z)). At equilibrium D = ½ everywhere and V = −log 4 ≈ −1.386.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 16. 1-D GAN toy with optimal discriminator */
  W.gan1d = (el) => {
    const b = U.box(el, "A 1-D GAN you can train", "Real data ~ N(2, 0.6²). The generator outputs N(μ_g, σ_g²). For any generator the best discriminator is D*(x) = p_data / (p_data + p_g). Press Train and watch D* flatten to ½.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("mg", "Generator μ_g", -3, 4, 0.05, -2)}${U.range("sg", "Generator σ_g", 0.2, 2, 0.05, 1.2)}</div><div class="row"><button class="btn small" data-act="train">Train generator ×10 steps</button><button class="btn quiet small" data-act="reset">Reset</button></div><div class="plot"></div><div class="readout"></div>`);
    const md = 2, sd = 0.6; let st;
    const xs = []; for (let i = 0; i <= 400; i++) xs.push(-5 + (10 * i) / 400);
    const JSD = (m, s) => { let j = 0; const dx = 10 / 400; xs.forEach((x) => { const p = U.npdf(x, md, sd), q = U.npdf(x, m, s), mm = (p + q) / 2; if (p > 1e-12) j += 0.5 * p * Math.log(p / mm) * dx; if (q > 1e-12) j += 0.5 * q * Math.log(q / mm) * dx; }); return j; };
    const draw = () => {
      const s = st; const p = U.plot({ x0: -5, x1: 5, y0: 0, y1: 1.05, h: 220 });
      const g = p.frame([-4, -2, 0, 2, 4], [0, 0.5, 1]) + `<line x1="${p.X(-5)}" x2="${p.X(5)}" y1="${p.Y(0.5)}" y2="${p.Y(0.5)}" stroke="var(--ink-2)" stroke-dasharray="2 3"/>` +
        p.line(p.path((x) => U.npdf(x, md, sd) * 1.4), C3) + p.line(p.path((x) => U.npdf(x, s.mg, s.sg) * 1.4), C2) +
        p.line(p.path((x) => { const a = U.npdf(x, md, sd), q = U.npdf(x, s.mg, s.sg); return a + q < 1e-9 ? 0.5 : a / (a + q); }), C1, 'stroke-dasharray="6 4"');
      b.querySelector(".plot").innerHTML = p.svg(g) + `<div class="legend"><span><i style="background:${C3}"></i>p_data</span><span><i style="background:${C2}"></i>p_g (generator)</span><span><i style="background:${C1}"></i>D*(x)</span></div>`;
      const j = JSD(s.mg, s.sg);
      b.querySelector(".readout").innerHTML = `JS divergence(p_data, p_g) = <b>${U.f(j, 4)}</b> (max ln 2 = 0.693)<br>V(D*, G) = −log 4 + 2·JSD = <b>${U.f(-Math.log(4) + 2 * j, 4)}</b> → minimum −1.386 when p_g = p_data<br><span class="muted">${j < 0.005 ? "Nash equilibrium: D* = ½ everywhere. The discriminator can no longer tell real from fake, and neither player can improve by changing alone." : "The generator descends this value. Where p_g has no overlap with p_data, D* is ≈ 0 or 1 and gradients vanish — one reason vanilla GAN training is unstable."}</span>`;
    };
    st = U.bind(b, draw);
    const setv = (k, v) => { const inp = b.querySelector(`[data-k="${k}"]`); inp.value = v; inp.dispatchEvent(new Event("input")); };
    b.querySelector('[data-act="train"]').onclick = () => { let m = st.mg, s = st.sg; for (let i = 0; i < 10; i++) { const e = 0.02; const gm = (JSD(m + e, s) - JSD(m - e, s)) / (2 * e), gs = (JSD(m, s + e) - JSD(m, s - e)) / (2 * e); m -= 1.2 * gm + 0.08 * Math.sign(md - m) * (Math.abs(gm) < 0.01 ? 1 : 0); s = Math.max(0.2, s - 0.8 * gs); } setv("mg", Math.round(m * 100) / 100); setv("sg", Math.round(s * 100) / 100); };
    b.querySelector('[data-act="reset"]').onclick = () => { setv("mg", -2); setv("sg", 1.2); };
    draw();
  };
})();

/* ===== widgets2.js ===== */
/* Interactive models, part 2: diffusion, sequence models, transformers, LLMs, RAG, evaluation */
(function () {
  "use strict";
  const W = window.WIDGETS; const U = W._util;
  const C1 = "var(--accent)", C2 = "var(--hi)", C3 = "var(--good)", C4 = "var(--bad)";

  /* schedules */
  const schedule = (kind, T) => {
    const beta = [], abar = []; let prod = 1;
    if (kind === "linear") { for (let t = 1; t <= T; t++) { const b = 1e-4 + ((0.02 - 1e-4) * (t - 1)) / (T - 1); beta.push(b); prod *= 1 - b; abar.push(prod); } }
    else { const f = (t) => Math.cos(((t / T + 0.008) / 1.008) * (Math.PI / 2)) ** 2; for (let t = 1; t <= T; t++) { const a = f(t) / f(0); abar.push(a); beta.push(Math.min(0.999, 1 - a / (t === 1 ? 1 : f(t - 1) / f(0)))); } }
    return { beta, abar };
  };

  /* 17. Forward diffusion */
  W.diffusion = (el) => {
    const b = U.box(el, "Forward diffusion: destroy an image on schedule", "x_t = √ᾱ_t · x₀ + √(1 − ᾱ_t) · ε. Slide t from 0 to T = 1000 and compare the linear and cosine noise schedules.");
    b.insertAdjacentHTML("beforeend", `<div class="row">${U.seg("s", [["linear", "Linear β schedule"], ["cosine", "Cosine schedule"]], "linear")}</div><div class="ctrls">${U.range("t", "Time step t", 0, 1000, 10, 250)}</div>
      <div class="row" style="gap:18px;align-items:flex-start"><div><div class="eyebrow">x_t</div><canvas width="128" height="128" class="wcanvas cv" style="width:168px;margin-top:6px;image-rendering:pixelated"></canvas></div><div style="flex:1;min-width:240px"><div class="eyebrow">ᾱ_t (signal kept) over time</div><div class="plot"></div></div></div><div class="readout"></div>`);
    const N = 32; const x0 = []; const r = U.rng(11); const eps = [];
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { let v = -0.85; if (i > 18) v = 0.2; if (Math.hypot(i - 9, j - 22) < 5) v = 0.95; if (i > 12 && i <= 18 && Math.abs(j - 10) < 7 - (18 - i) * 0 && j > 3 && j < 17) v = 0.6; if (i > 6 && i <= 12 && Math.abs(j - 10) < i - 5) v = 0.85; x0.push(v); eps.push(U.gauss(r)); }
    const S = { linear: schedule("linear", 1000), cosine: schedule("cosine", 1000) };
    const draw = (s) => {
      const sc = S[s.s]; const t = Math.max(0, s.t); const ab = t === 0 ? 1 : sc.abar[t - 1]; const bt = t === 0 ? 0 : sc.beta[t - 1];
      const cv = b.querySelector(".cv"), ctx = cv.getContext("2d"); const img = ctx.createImageData(N, N);
      for (let k = 0; k < N * N; k++) { const v = Math.sqrt(ab) * x0[k] + Math.sqrt(1 - ab) * eps[k]; const c = Math.max(0, Math.min(255, (v + 1) * 127.5)); img.data[4 * k] = c * 0.75; img.data[4 * k + 1] = c * 0.85; img.data[4 * k + 2] = c; img.data[4 * k + 3] = 255; }
      const off = document.createElement("canvas"); off.width = N; off.height = N; off.getContext("2d").putImageData(img, 0, 0); ctx.imageSmoothingEnabled = false; ctx.drawImage(off, 0, 0, 128, 128);
      const p = U.plot({ x0: 0, x1: 1000, y0: 0, y1: 1, h: 170 });
      let dL = "", dC = ""; for (let k = 0; k <= 1000; k += 10) { const a1 = k ? S.linear.abar[k - 1] : 1, a2 = k ? S.cosine.abar[k - 1] : 1; dL += (dL ? "L" : "M") + p.X(k) + "," + p.Y(a1); dC += (dC ? "L" : "M") + p.X(k) + "," + p.Y(a2); }
      b.querySelector(".plot").innerHTML = p.svg(p.frame([0, 250, 500, 750, 1000], [0, 0.5, 1]) + p.line(dL, C1, s.s === "linear" ? "" : 'opacity="0.35"') + p.line(dC, C2, s.s === "cosine" ? "" : 'opacity="0.35"') + `<line x1="${p.X(t)}" x2="${p.X(t)}" y1="${p.padT}" y2="${p.Y(0)}" stroke="var(--ink)" stroke-dasharray="3 3"/>`) + `<div class="legend"><span><i style="background:${C1}"></i>linear</span><span><i style="background:${C2}"></i>cosine</span></div>`;
      b.querySelector(".readout").innerHTML = `t = ${t} · β_t = <b>${U.f(bt, 5)}</b> · ᾱ_t = Π(1 − β_s) = <b>${U.f(ab, 4)}</b><br>signal weight √ᾱ_t = ${U.f(Math.sqrt(ab), 3)} · noise weight √(1−ᾱ_t) = ${U.f(Math.sqrt(1 - ab), 3)} · SNR = ᾱ/(1−ᾱ) = ${ab >= 1 ? "∞" : U.f(ab / (1 - ab), 3)}<br><span class="muted">The forward process has no learned parameters. Thanks to the closed form you can jump straight to any t without simulating the steps in between. The cosine schedule destroys information more evenly, so fewer late steps are wasted on pure noise.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 18. Guidance scale */
  W.cfg = (el) => {
    const b = U.box(el, "Classifier-free guidance as vector arithmetic", "The same U-Net predicts noise twice: with the prompt (conditional) and with an empty prompt (unconditional). Guidance extrapolates along their difference.");
    b.insertAdjacentHTML("beforeend", `<div class="ctrls">${U.range("w", "Guidance scale w", 0, 12, 0.5, 7.5)}</div><div class="plot"></div><div class="readout"></div>`);
    const draw = (s) => {
      const p = U.plot({ x0: -1, x1: 9, y0: -1, y1: 5, h: 230 });
      const u = [1.5, 0.8], c = [2.4, 1.6]; const g = [u[0] + s.w * (c[0] - u[0]), u[1] + s.w * (c[1] - u[1])];
      const clamp = (v, a, bb) => Math.max(a, Math.min(bb, v));
      const arrow = (a, col, label) => `<line x1="${p.X(0)}" y1="${p.Y(0)}" x2="${p.X(clamp(a[0], -1, 9))}" y2="${p.Y(clamp(a[1], -1, 5))}" stroke="${col}" stroke-width="3" marker-end="url(#ah)"/><text x="${p.X(clamp(a[0], -1, 8.6)) + 6}" y="${p.Y(clamp(a[1], -1, 4.8)) - 6}" style="fill:${col};font-weight:700">${label}</text>`;
      const svg = `<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink-2)"/></marker></defs>` + p.frame([0, 2, 4, 6, 8], [0, 2, 4]) + arrow(u, C2, "ε(x_t, ∅)") + arrow(c, C3, "ε(x_t, y)") + arrow(g, C1, "ε̃");
      b.querySelector(".plot").innerHTML = p.svg(svg);
      const msg = s.w === 0 ? "w = 0: purely unconditional, the prompt is ignored." : s.w === 1 ? "w = 1: plain conditional prediction, no extra push." : s.w < 1 ? "0 < w < 1: interpolates between the unconditional and conditional predictions." : s.w <= 9 ? "w > 1: extrapolates past the conditional prediction. Samples follow the prompt more closely; diversity drops. Stable Diffusion's default is about 7.5." : "Very large w: oversaturated, distorted images with little diversity.";
      b.querySelector(".readout").innerHTML = `ε̃ = ε(x_t, ∅) + w · (ε(x_t, y) − ε(x_t, ∅)) = [${U.f(g[0], 2)}, ${U.f(g[1], 2)}]<br>${msg}<br><span class="muted">Classifier guidance needs a separately trained noisy-image classifier and adds s·∇log p(y|x_t). Classifier-free guidance needs none: you randomly drop the prompt (about 10–20% of the time) during training so one network learns both predictions.</span>`;
    };
    const st = U.bind(b, draw); draw(st);
  };

  /* 19. U-Net explorer */
  W.unet = (el) => {
    const b = U.box(el, "Tour the denoising U-Net", "Click a block to see what it does in a diffusion model.");
    const blocks = {
      in: ["Input x_t", "The noisy image at step t, same height × width as the output."],
      t: ["Time embedding", "t is turned into a sinusoidal embedding, passed through an MLP and added inside every residual block, so one network knows how much noise to expect."],
      e1: ["Encoder block 1", "Residual conv blocks with GroupNorm; then downsample. Captures edges and fine texture."],
      e2: ["Encoder block 2", "Fewer pixels, more channels. Captures larger structures."],
      bn: ["Bottleneck", "Lowest resolution, widest channels. Self-attention here lets distant regions coordinate. In Stable Diffusion, cross-attention to the text embedding enters at these attention layers."],
      d2: ["Decoder block 2", "Upsample and concatenate the matching encoder features (skip connection)."],
      d1: ["Decoder block 1", "Upsample back to full resolution, again with a skip connection, so fine detail lost in the bottleneck is restored."],
      out: ["Output ε̂_θ(x_t, t)", "Predicted noise, same shape as x_t. The training loss is ‖ε − ε̂_θ(x_t, t)‖²."],
      skip: ["Skip connections", "Copy encoder feature maps straight across to the decoder. This is the defining feature of the U-Net (first proposed for biomedical segmentation; Pix2Pix uses it as its generator too)."]
    };
    b.insertAdjacentHTML("beforeend", `<svg viewBox="0 0 560 230" class="chart" style="max-width:560px">
      <defs><marker id="ua" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ink-2)"/></marker></defs>
      ${[["in", 10, 20, 70, 40], ["e1", 50, 75, 80, 40], ["e2", 120, 130, 80, 40], ["bn", 220, 175, 120, 40], ["d2", 360, 130, 80, 40], ["d1", 430, 75, 80, 40], ["out", 480, 20, 70, 40], ["t", 230, 20, 100, 36]].map(([k, x, y, w, h]) => `<g data-b="${k}" style="cursor:pointer"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="var(--sheet-2)" stroke="var(--accent)" stroke-width="1.5"/><text x="${x + w / 2}" y="${y + h / 2 + 4}" text-anchor="middle" style="fill:var(--ink);font:600 11px var(--f-mono)">${blocks[k][0].split(" ").slice(0, 2).join(" ")}</text></g>`).join("")}
      <path d="M45 60 L80 75 M110 115 L150 130 M180 170 L230 175 M330 175 L390 170 M420 130 L460 115 M490 75 L515 60" stroke="var(--ink-2)" stroke-width="1.5" fill="none" marker-end="url(#ua)"/>
