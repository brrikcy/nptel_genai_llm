<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A 16-hour, interactive preparation system for the NPTEL / IISc course Fundamentals of Generative AI and Large Language Models.">
</head>
<body>
<title>GenAI 16-Hour Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: an engineer's study notebook — a course-map rail on the left,
   one focused "page" in the centre, a live study-clock pinned to the top bar. */
:root {
  --paper: #eef2f6;          /* cool notebook paper, faint blue bias */
  --sheet: #ffffff;          /* raised surfaces */
  --sheet-2: #f6f8fb;        /* inset surfaces */
  --ink: #142030;            /* primary text */
  --ink-2: #4c5b6d;          /* secondary text */
  --rule: #d6dee8;           /* hairlines */
  --accent: #2346c4;         /* ink-blue: actions, links, progress */
  --accent-soft: #e3e9fb;
  --hi: #f2b705;             /* highlighter: curiosity hooks only */
  --hi-soft: #fff4cc;
  --good: #19805a;
  --good-soft: #dff3ea;
  --bad: #c0392f;
  --bad-soft: #fbe4e2;
  --warn: #b26a00;
  --warn-soft: #fdf0db;
  --shadow: 0 1px 2px rgba(20, 32, 48, .06), 0 4px 16px rgba(20, 32, 48, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 10px;
  --rail: 300px;
  --top: 60px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d131a; --sheet: #151e28; --sheet-2: #111922; --ink: #e5ecf4; --ink-2: #9aabbf;
    --rule: #263445; --accent: #87a4ff; --accent-soft: #1c2a4d; --hi: #f5c542; --hi-soft: #3a3115;
    --good: #4cc792; --good-soft: #13342a; --bad: #ff7b70; --bad-soft: #3b1d1b; --warn: #f0a640; --warn-soft: #3a2a12;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d131a; --sheet: #151e28; --sheet-2: #111922; --ink: #e5ecf4; --ink-2: #9aabbf;
  --rule: #263445; --accent: #87a4ff; --accent-soft: #1c2a4d; --hi: #f5c542; --hi-soft: #3a3115;
  --good: #4cc792; --good-soft: #13342a; --bad: #ff7b70; --bad-soft: #3b1d1b; --warn: #f0a640; --warn-soft: #3a2a12;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
#app { min-height: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.7rem, 1.2rem + 2vw, 2.4rem); font-weight: 700; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.15rem; font-weight: 650; }
p { margin: 0; }
.mono, code, .num { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }
code { font-size: .88em; background: var(--sheet-2); border: 1px solid var(--rule); padding: .05em .35em; border-radius: 5px; }
.eyebrow { font: 600 .72rem/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.small { font-size: .875rem; }

/* ---------- app shell ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  height: var(--top); display: flex; align-items: center; gap: 12px;
  padding-inline: 16px; background: var(--sheet); border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; text-align: left; }
.brand-text b { font: 700 1rem var(--f-display); white-space: nowrap; }
.brand-text span { font-size: .72rem; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.clock {
  display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet-2);
}
.clock-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-2); flex: none; }
.clock.on .clock-dot { background: var(--good); box-shadow: 0 0 0 4px var(--good-soft); animation: pulse 2s infinite; }
.clock.idle .clock-dot { background: var(--warn); }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px transparent; } }
.clock-read { display: flex; flex-direction: column; line-height: 1.05; }
.clock-read b { font: 600 .95rem var(--f-mono); font-variant-numeric: tabular-nums; }
.clock-read span { font-size: .68rem; color: var(--ink-2); white-space: nowrap; }
.iconbtn {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--rule); background: var(--sheet);
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.iconbtn:hover { border-color: var(--accent); }
.iconbtn svg { width: 18px; height: 18px; }
.menu-btn { display: none; }

.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100% - var(--top)); }
.rail {
  position: sticky; top: calc(var(--top) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--top));
  overflow-y: auto; border-right: 1px solid var(--rule); background: var(--sheet); padding: 14px 10px 40px;
}
.rail-nav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
.navlink {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 0; background: none;
  cursor: pointer; text-align: left; width: 100%; color: var(--ink);
}
.navlink:hover { background: var(--sheet-2); }
.navlink.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.navlink svg { width: 18px; height: 18px; flex: none; }
.rail h4 { font: 600 .7rem var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 10px 10px 6px; }
.wk { border-radius: 8px; }
.wk-head {
  display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; width: 100%;
  padding: 7px 8px; border: 0; background: none; cursor: pointer; text-align: left; border-radius: 8px;
}
.wk-head:hover { background: var(--sheet-2); }
.wk-n { font: 600 .75rem var(--f-mono); color: var(--ink-2); }
.wk-t { font-size: .9rem; line-height: 1.25; min-width: 0; }
.ring { width: 22px; height: 22px; }
.wk-topics { display: none; padding: 0 0 6px 38px; }
.wk.open .wk-topics { display: block; }
.tlink {
  display: flex; gap: 8px; align-items: flex-start; width: 100%; text-align: left; border: 0; background: none;
  padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: .86rem; color: var(--ink-2); line-height: 1.3;
}
.tlink:hover { background: var(--sheet-2); color: var(--ink); }
.tlink.active { color: var(--accent); font-weight: 600; }
.tick { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--rule); flex: none; margin-top: 2px; display: grid; place-items: center; }
.tick.read { border-color: var(--accent); }
.tick.done { background: var(--good); border-color: var(--good); }
.tick.done::after { content: ""; width: 6px; height: 3px; border: solid #fff; border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg) translate(0.5px, -0.5px); }
.tick.test { border-radius: 3px; }

#main:focus { outline: none; }
.main { min-width: 0; padding: 28px clamp(16px, 4vw, 48px) 80px; }
.page { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.page.wide { max-width: 1080px; }

/* ---------- generic pieces ---------- */
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 18px;
  border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--sheet);
  font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.quiet { background: var(--sheet-2); color: var(--ink); border-color: var(--rule); font-weight: 600; }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: .88rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 .74rem var(--f-mono); padding: 3px 9px; border-radius: 999px; background: var(--sheet-2); color: var(--ink-2); border: 1px solid var(--rule); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.bar { height: 8px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .5s; }
.bar.good > i { background: var(--good); }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi b { font: 700 1.6rem var(--f-display); font-variant-numeric: tabular-nums; }
.kpi span { font-size: .82rem; color: var(--ink-2); }
.callout { border-radius: var(--r); padding: 14px 16px; border: 1px solid var(--rule); background: var(--sheet-2); }
.callout.good { background: var(--good-soft); border-color: transparent; }
.callout.bad { background: var(--bad-soft); border-color: transparent; }
.callout.warn { background: var(--warn-soft); border-color: transparent; }
.callout.acc { background: var(--accent-soft); border-color: transparent; }
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; z-index: 90; font-weight: 600;
  box-shadow: var(--shadow); max-width: calc(100% - 32px);
}

/* ---------- dashboard ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.hero-main { display: flex; flex-direction: column; gap: 14px; }
.hero-main p { color: var(--ink-2); max-width: 60ch; }
.hourglass { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.big-time { font: 700 2.6rem/1 var(--f-display); font-variant-numeric: tabular-nums; }
.big-time small { font-size: 1rem; color: var(--ink-2); font-weight: 500; }
.sessions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.sess { border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; background: var(--sheet); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sess .eyebrow { display: flex; justify-content: space-between; }
.sess p { font-size: .84rem; line-height: 1.35; }
.sess.cur { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.sess.done { opacity: .75; }
.weeks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.wcard { border: 1px solid var(--rule); background: var(--sheet); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; text-align: left; min-width: 0; }
.wcard:hover { border-color: var(--accent); }
.wcard h3 { font-size: 1rem; }
.wcard .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-2); font: 11px var(--f-mono); }

/* ---------- topic page ---------- */
.crumbs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: .85rem; color: var(--ink-2); }
.crumbs button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
.topic-head { display: flex; flex-direction: column; gap: 10px; }
.topic-meta { display: flex; gap: 8px; flex-wrap: wrap; }
.hook {
  position: relative; border-radius: var(--r); padding: 20px 22px; background: var(--hi-soft);
  border: 1px solid color-mix(in srgb, var(--hi) 55%, transparent);
}
.hook .eyebrow { color: var(--warn); }
.hook-q { font: 600 1.15rem/1.45 var(--f-display); margin-top: 8px; }
.hook-a { margin-top: 12px; padding-top: 12px; border-top: 1px dashed color-mix(in srgb, var(--hi) 70%, transparent); }
.lesson { display: flex; flex-direction: column; gap: 14px; }
.lcard { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 80px; }
.lcard.flash { animation: flash 1.6s; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--hi); } 100% { box-shadow: none; } }
.lcard-h { display: flex; gap: 12px; align-items: baseline; }
.lcard-n { font: 600 .78rem var(--f-mono); color: var(--accent); flex: none; }
.prose { display: flex; flex-direction: column; gap: 10px; max-width: 70ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.25em; display: flex; flex-direction: column; gap: 4px; }
.prose table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.prose th, .prose td { border: 1px solid var(--rule); padding: 6px 10px; text-align: left; vertical-align: top; }
.prose th { background: var(--sheet-2); font-weight: 700; }
.tablewrap { overflow-x: auto; max-width: 100%; }
.eq {
  font-family: var(--f-mono); font-size: .95rem; background: var(--sheet-2); border: 1px solid var(--rule);
  border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 6px; overflow-x: auto; white-space: nowrap;
}
.eq.wrap { white-space: normal; }
.analogy { border-left: 3px solid var(--hi); padding: 4px 0 4px 14px; font-style: italic; color: var(--ink-2); }
.ask { border: 1px dashed var(--accent); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--accent-soft); }
.ask .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.ask .opts button { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: .9rem; }
.ask .opts button.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.ask .opts button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.keys ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
.lecs { display: flex; flex-direction: column; gap: 6px; }
.lec { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; text-decoration: none; color: var(--ink); background: var(--sheet); }
.lec:hover { border-color: var(--accent); }
.lec b { font: 600 .78rem var(--f-mono); color: var(--accent); }
.lec span { min-width: 0; font-size: .92rem; line-height: 1.3; }
.lec i { font: normal .78rem var(--f-mono); color: var(--ink-2); }
.next-bar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }

/* ---------- widgets ---------- */
.widget { border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); overflow: hidden; }
.widget-h { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--rule); background: var(--sheet-2); flex-wrap: wrap; }
.widget-h h3 { font-size: 1rem; }
.widget-b { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.ctrls { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 16px; }
.ctrl { display: flex; flex-direction: column; gap: 2px; font-size: .85rem; min-width: 0; }
.ctrl label { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); }
.ctrl label output { font-family: var(--f-mono); color: var(--ink); }
.ctrl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctrl input[type=number], .ctrl input[type=text], .ctrl select, .tinput {
  border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 6px 8px; width: 100%;
}
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--sheet); padding: 6px 12px; cursor: pointer; font-size: .85rem; border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--sheet); font-weight: 700; }
.wcanvas { width: 100%; max-width: 100%; display: block; border-radius: 8px; background: var(--sheet-2); border: 1px solid var(--rule); }
.readout { font: .88rem/1.5 var(--f-mono); background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.readout b { color: var(--accent); }
.grid-cells { display: inline-grid; gap: 2px; font: .75rem var(--f-mono); }
.grid-cells span { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 4px; background: var(--sheet-2); border: 1px solid var(--rule); font-variant-numeric: tabular-nums; }
.grid-cells span.hl { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.grid-cells span.pad { opacity: .45; border-style: dashed; }
.grid-cells span.out { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 700; }
.tokens { display: flex; flex-wrap: wrap; gap: 4px; }
.tok { font: .85rem var(--f-mono); padding: 3px 7px; border-radius: 5px; border: 1px solid var(--rule); background: var(--sheet-2); cursor: pointer; }
.tok.on { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

/* ---------- quiz ---------- */
.quiz { display: flex; flex-direction: column; gap: 16px; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.qdots { display: flex; gap: 5px; flex-wrap: wrap; }
.qdots i { width: 22px; height: 6px; border-radius: 4px; background: var(--rule); }
.qdots i.cur { background: var(--accent); }
.qdots i.ok { background: var(--good); }
.qdots i.no { background: var(--bad); }
.qtext { font: 600 1.1rem/1.5 var(--f-body); }
.qtype { font: 600 .7rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 11px 14px; text-align: left;
  border: 1.5px solid var(--rule); border-radius: 8px; background: var(--sheet); cursor: pointer; width: 100%; line-height: 1.45;
}
.opt:hover { border-color: var(--accent); }
.opt .key { width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--rule); display: grid; place-items: center; font: 600 .78rem var(--f-mono); color: var(--ink-2); }
.opt.multi .key { border-radius: 4px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); border-color: var(--accent); color: var(--sheet); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); border-color: var(--good); color: var(--sheet); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: var(--sheet); }
.opt.missed { border-style: dashed; border-color: var(--good); }
.opt:disabled { cursor: default; }
.natbox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

      reveal: "<p>The spam filter learns <b>p(y | x)</b>: given an email, how likely is the label “spam”. It only needs the boundary between classes. A generative model learns <b>p(x)</b> (or <b>p(x | y)</b>, or the joint <b>p(x, y)</b>): how likely the email itself is. Once you have a distribution over x, you can <i>sample</i> from it, and a sample is a new email.</p>",

    {

      hook: "Stack 100 linear layers, each with millions of weights. A single linear layer can represent everything this monster can. Why?",
      reveal: "<p>A composition of linear maps is linear: W₃(W₂(W₁x)) = (W₃W₂W₁)x = W′x. Without a non-linear <b>activation</b> between layers, depth adds nothing. Activations are what let networks bend decision boundaries and approximate any function.</p>",

          <p>This pairing reappears every week. The autoencoder and VAE numerical examples in Weeks 2–3 use a <b>linear output + MSE</b> for continuous data and <b>sigmoid + BCE</b> for binary or [0, 1] data.</p>`,

          <p>Worked example: y = 1 and ŷ = 0.8 gives BCE = −ln 0.8 = 0.223. If ŷ = 0.1, BCE = −ln 0.1 = 2.303. Confident wrong answers are punished heavily.</p>` }

        { h: "Gradient descent and its batch sizes", b: `<p>The optimizer updates parameters to reduce the loss L(θ):</p><div class="eq">θ ← θ − η · ∇_θ L</div><p>η is the <b>learning rate</b>. The variants differ in how much data each gradient uses:</p>
          <div class="tablewrap"><table><tr><th>Variant</th><th>Gradient computed on</th><th>Trade-off</th></tr><tr><td>Batch GD</td><td>Entire dataset</td><td>Smooth, exact, slow and memory-hungry; one update per epoch</td></tr><tr><td>Stochastic GD (SGD)</td><td>One sample</td><td>Very noisy, fast updates; the noise can escape shallow minima</td></tr><tr><td>Mini-batch SGD</td><td>A batch of B samples (32, 64, 128…)</td><td>The practical default: GPU-friendly, moderate noise</td></tr></table></div>
          <p>With N samples and batch size B there are ⌈N/B⌉ updates per epoch.</p>`,
          ask: { q: "N = 10,000 samples, batch size 50. How many parameter updates in one epoch?", o: ["50", "200", "10,000", "1"], a: 1, x: "10,000 / 50 = 200 updates per epoch." } },
        { h: "Learning rate: the most important knob", b: `<ul><li>Too small: painfully slow, may stall on plateaus.</li><li>Too large: overshoots, oscillates or diverges.</li></ul><p>Use the race below to see a narrow valley: plain gradient descent zig-zags across the steep direction, and diverges once the learning rate is too large for the steepest axis.</p>`, w: "optim" },
        { h: "Momentum: give the ball some mass", b: `<div class="eq">v_t = β·v_(t−1) + η·∇L      θ ← θ − v_t      (β ≈ 0.9)</div>
          <p>The velocity is an exponential moving average of past gradients. Components that keep pointing the same way add up (faster along the valley floor); components that flip sign cancel out (less zig-zag). Nesterov momentum evaluates the gradient at the look-ahead point θ − β·v.</p>` },
        { h: "Adaptive learning rates: AdaGrad, RMSProp, Adam", b: `<div class="tablewrap"><table><tr><th>Optimizer</th><th>Idea</th><th>Update</th></tr>
          <tr><td>AdaGrad</td><td>Divide by the root of the <i>sum</i> of all past squared gradients</td><td>G_t = G_(t−1) + g²;  θ ← θ − η·g / (√G_t + ε)</td></tr>
          <tr><td>RMSProp</td><td>Use an exponential moving <i>average</i> of squared gradients instead</td><td>s_t = ρ·s_(t−1) + (1−ρ)·g²;  θ ← θ − η·g / (√s_t + ε)</td></tr>
          <tr><td>Adam</td><td>Momentum (1st moment) + RMSProp (2nd moment) + bias correction</td><td>m_t = β₁m + (1−β₁)g;  v_t = β₂v + (1−β₂)g²;  m̂ = m/(1−β₁ᵗ), v̂ = v/(1−β₂ᵗ);  θ ← θ − η·m̂/(√v̂ + ε)</td></tr></table></div>
          <p><b>AdaGrad's flaw:</b> G only grows, so the effective learning rate decays towards 0 and training stalls. RMSProp fixes this by forgetting old gradients. Adam's defaults: β₁ = 0.9, β₂ = 0.999, ε = 10⁻⁸, η = 10⁻³. Bias correction matters early, because m and v start at 0.</p>` }
      ],
      keys: ["Update rule θ ← θ − η∇L; η is the learning rate.", "Batch GD = full dataset; SGD = 1 sample; mini-batch = B samples (the practical default).", "Momentum: moving average of gradients, β ≈ 0.9, damps oscillation.", "AdaGrad accumulates squared gradients → its learning rate decays to zero. RMSProp uses a moving average instead.", "Adam = momentum + RMSProp + bias correction (β₁ = 0.9, β₂ = 0.999)."],
      traps: ["Adam's bias correction divides by (1 − βᵗ), not multiplies.", "A smaller batch gives noisier gradients, not more accurate ones.", "AdaGrad works well for sparse features; its problem is the ever-growing denominator."],
      quiz: [
        { q: "Which optimizer's effective learning rate keeps shrinking because it sums all past squared gradients?", o: ["Momentum", "AdaGrad", "RMSProp", "Adam"], a: 1, x: "AdaGrad's accumulator G_t only grows, so η/√G_t → 0. RMSProp replaced the sum with a moving average.", r: 3 },
        { q: "Adam combines which two ideas?", o: ["Dropout and batch normalisation", "Momentum (first moment) and RMSProp-style scaling (second moment)", "AdaGrad and Nesterov", "SGD and L2 regularisation"], a: 1, x: "Adam tracks a moving average of gradients (m) and of squared gradients (v), with bias correction.", r: 3 },
        { q: "With momentum β = 0.9, η = 0.1, previous velocity v = 0.5 and current gradient g = 2, what is the new velocity v_t = β·v + η·g?", a: { n: 0.65, tol: 0.001 }, x: "0.9 × 0.5 + 0.1 × 2 = 0.45 + 0.2 = 0.65.", r: 2 },
        { q: "A dataset has 60,000 images and the batch size is 64. How many mini-batch updates are in one epoch (rounding up)?", a: { n: 938, tol: 0 }, x: "60,000 / 64 = 937.5, so 938 batches (the last one is partial).", r: 0 },
        { q: "Which statements are true? (Select all that apply)", o: ["Stochastic GD uses one sample per update", "A very large learning rate can make the loss diverge", "Batch GD performs many updates per epoch", "Momentum reduces oscillations across steep directions"], a: [0, 1, 3], x: "Batch GD makes exactly one update per epoch, using the full dataset.", r: 1 }
      ]
    },
    {
      id: "w1t4", title: "Convolutions: how a CNN sees", lec: [5], min: 19, w: "conv",
      hook: "Flatten a 200×200 colour photo and feed it to a fully connected layer of 1,000 neurons. How many weights is that, and what did flattening throw away?",
      reveal: "<p>200 × 200 × 3 = 120,000 inputs × 1,000 neurons ≈ <b>120 million weights</b> in one layer. Flattening also destroys <b>spatial structure</b>: pixels that were neighbours end up far apart in the vector, and the network must relearn the same edge detector at every position. A convolution reuses one small filter everywhere and keeps neighbourhoods intact.</p>",
      cards: [
        { h: "Why a fully connected network struggles with images", b: `<ul><li>An image is a matrix of pixel intensities (H × W × C, with C = 3 for RGB, 1 for grayscale).</li><li>An MLP needs a flat vector, which <b>destroys spatial relationships</b> and local dependencies (edges, curves).</li><li>It treats every pixel as an independent feature, though meaning comes from groups of nearby pixels.</li><li>The parameter count explodes (28×28×3 = 2,352 inputs; 200×200×3 = 120,000), which slows training and invites overfitting.</li></ul>
          <p>CNNs borrow from the <b>human visual system</b>: early layers detect lines, edges and corners; deeper layers combine them into shapes and objects.</p>` },
        { h: "The convolution operation", b: `<p>A <b>kernel</b> (filter) is a small learnable matrix, usually odd-sized (3×3, 5×5). It slides over the image; at each position you multiply element-wise and sum. The grid of results is a <b>feature map</b>.</p><p>Kernel values are <b>learned by backpropagation</b>, not hand-designed. Using K different kernels gives K feature maps, each detecting a different pattern.</p>`, w: "conv" },
        { h: "Output size: the formula behind half the numericals", b: `<div class="eq">output = ⌊(n + 2p − f) / s⌋ + 1</div>
          <p>n = input size, f = kernel size, p = padding, s = stride. Apply it separately to height and width.</p>
          <ul><li>6×6 input, 3×3 kernel, p = 0, s = 1 → (6 − 3)/1 + 1 = <b>4×4</b>. The output shrinks and border pixels are visited fewer times.</li><li><b>Padding</b> adds a border of zeros. 'same' padding (p = 1 for a 3×3 kernel) keeps 6×6 → 6×6. 'valid' means no padding.</li><li><b>Stride</b> = how far the kernel jumps. 7×7, f = 3, s = 2 → ⌊4/2⌋ + 1 = <b>3×3</b>.</li><li>A non-integer result is floored.</li></ul>
          <p>Keras: <code>Conv2D(32, (3,3), strides=(2,2), padding='same', activation='relu')</code>. The default stride is 1. Strides can differ per axis, e.g. (2, 3).</p>`,
          ask: { q: "Input 32×32, kernel 5×5, padding 0, stride 1. Output size?", o: ["32×32", "28×28", "27×27", "30×30"], a: 1, x: "(32 − 5)/1 + 1 = 28." } },
        { h: "What CNNs are used for", b: `<ul><li><b>Classification</b>: one label per image (benign vs malignant).</li><li><b>Classification + localisation</b>: the label plus one bounding box.</li><li><b>Object detection</b>: several objects, each with a box and a class.</li><li><b>Semantic segmentation</b>: a class for every pixel; all sheep share one colour.</li><li><b>Instance segmentation</b>: per-pixel masks that also separate individuals (sheep 1, sheep 2, …).</li></ul>` }
      ],
      keys: ["Output size = ⌊(n + 2p − f)/s⌋ + 1.", "Kernel = filter; its weights are learned; K kernels → K feature maps.", "'same' padding keeps the spatial size (p = (f−1)/2 for stride 1); 'valid' = no padding.", "MLPs on images: lose spatial structure, treat pixels independently, and explode in parameters.", "Semantic segmentation labels pixels by class; instance segmentation also separates individual objects."],
      traps: ["Padding p appears as 2p in the formula (both sides).", "A 1×1 kernel does not look at neighbours; it only mixes channels.", "Instance vs semantic segmentation: the difference is separating individuals of the same class."],
      quiz: [
        { q: "An input of size 7×7 is convolved with a 3×3 filter, padding 0, stride 2. What is the output size?", o: ["5×5", "3×3", "4×4", "2×2"], a: 1, x: "⌊(7 + 0 − 3)/2⌋ + 1 = 2 + 1 = 3.", r: 2 },
        { q: "A 64×64 input, 3×3 kernel, stride 1. What padding keeps the output at 64×64?", a: { n: 1, tol: 0 }, x: "64 = (64 + 2p − 3) + 1 ⇒ 2p = 2 ⇒ p = 1 ('same' padding).", r: 2 },
        { q: "Why is a fully connected network a poor choice for raw images? (Select all that apply)", o: ["Flattening destroys spatial relationships between neighbouring pixels", "The number of parameters explodes with image size", "It cannot use activation functions", "It treats each pixel as an independent feature"], a: [0, 1, 3], x: "MLPs can use activations. The problems are lost spatial structure, independent pixel treatment and parameter explosion (slow training, overfitting).", r: 0 },
        { q: "Labelling every pixel with a class, without distinguishing two sheep from each other, is called:", o: ["Object detection", "Instance segmentation", "Semantic segmentation", "Classification with localisation"], a: 2, x: "Semantic segmentation assigns classes per pixel. Instance segmentation would also separate sheep 1 and sheep 2.", r: 3 },
        { q: "Applying a 3×3 kernel [[1,0,−1],[1,0,−1],[1,0,−1]] to the patch [[3,0,1],[1,5,8],[2,7,2]] gives:", a: { n: -5, tol: 0 }, x: "(3 + 1 + 2)·1 + (0 + 5 + 7)·0 + (1 + 8 + 2)·(−1) = 6 − 11 = −5. This is the lecture's first worked value.", r: 1 }
      ]
    },
    {
      id: "w1t5", title: "Inside a full CNN: ReLU, pooling, flatten, dense, ensembles", lec: [6, 7, 8, 9], min: 17, w: "cnncalc",
      hook: "A CNN's convolution layers give you a 7×7×64 block of numbers. A classifier needs one probability per class. What has to happen in between, and which of those steps has zero learnable parameters?",
      reveal: "<p>ReLU, then <b>pooling</b> to shrink it, then <b>flatten</b> to a 3,136-long vector, then <b>fully connected (dense)</b> layers ending in softmax. ReLU, pooling and flatten all have <b>zero parameters</b>; only convolution and dense layers learn weights.</p>",
      cards: [
        { h: "The standard pipeline", b: `<div class="eq wrap">Input → [Conv → ReLU → Pool] × N → Flatten → Dense → … → Dense(softmax)</div>
          <ul><li><b>ReLU</b> after each convolution adds non-linearity and zeroes negative responses.</li><li><b>Pooling</b> down-samples each feature map. <b>Max pooling</b> keeps the largest value in each window; <b>average pooling</b> keeps the mean. A 2×2 pool with stride 2 halves height and width and keeps the depth. It adds some translation invariance and has no parameters.</li><li><b>Flatten</b> turns the H×W×C block into a vector.</li><li><b>Dense</b> layers do the final classification. Softmax at the end for multi-class.</li><li>Optional: batch normalisation, dropout (regularisation).</li></ul>`,
          ask: { q: "Max pooling 2×2 (stride 2) on [[1,3],[2,9]] gives:", o: ["3.75", "9", "15", "1"], a: 1, x: "Max pooling keeps the largest value in the window: 9. Average pooling would give 3.75." } },
        { h: "Counting parameters", b: `<div class="eq">Conv params = (f × f × C_in + 1) × K        Dense params = (inputs + 1) × outputs</div>
          <p>Example: a Conv2D with 32 filters of 3×3 on an RGB image → (3·3·3 + 1)·32 = <b>896</b>. A Dense layer from 128 to 10 → (128 + 1)·10 = <b>1,290</b>. The +1 is the bias per filter or per neuron. Weight sharing is why convolutions are so cheap.</p>`, w: "cnncalc" },
        { h: "Hands-on: Colab, Keras and a real dataset", b: `<ul><li><b>Google Colab</b>: a free hosted Jupyter notebook. Switch the runtime to a GPU (Runtime → Change runtime type), mount Google Drive for data, install packages with <code>!pip</code>.</li><li>Typical Keras flow: load and normalise the data (pixels / 255), build a <code>Sequential</code> model, <code>model.compile(optimizer='adam', loss='categorical_crossentropy', metrics=['accuracy'])</code>, <code>model.fit(..., validation_split=0.2, epochs=...)</code>, then evaluate on the test set.</li><li>Use <code>sparse_categorical_crossentropy</code> when the labels are integers instead of one-hot vectors.</li><li>Watch the training and validation curves: validation loss rising while training loss falls means overfitting. Fix it with dropout, data augmentation or early stopping.</li><li><b>Transfer learning</b>: reuse a network pre-trained on ImageNet (VGG, ResNet), freeze its convolution base, and train a new classification head on your data.</li></ul>` },
        { h: "Ensembles: many models, one vote", b: `<p>An <b>ensemble</b> combines several models to reduce variance and error. Common forms: <b>majority / hard voting</b> (most common class), <b>soft voting</b> (average the predicted probabilities), <b>bagging</b> (models on bootstrap samples, e.g. random forest), <b>boosting</b> (sequential models fixing earlier errors), and <b>stacking</b> (a meta-model learns from the base models' outputs).</p><p>Ensembles help only when the members make <i>different</i> errors.</p>`, w: "ensemble" }
      ],
      keys: ["Pipeline: Conv → ReLU → Pool (repeat) → Flatten → Dense → Softmax.", "Pooling, ReLU and flatten have 0 parameters; 2×2 pooling with stride 2 halves H and W and keeps the depth.", "Conv params = (f·f·C_in + 1)·K; dense params = (in + 1)·out.", "Ensembles: hard voting, soft voting (average probabilities), bagging, boosting, stacking."],
      traps: ["Pooling reduces height and width, never the number of channels.", "Soft voting averages probabilities; hard voting counts labels.", "sparse_categorical_crossentropy takes integer labels; categorical_crossentropy takes one-hot labels."],
      quiz: [
        { q: "How many learnable parameters does a Conv2D layer with 16 filters of size 3×3 have when applied to a grayscale (1-channel) image?", a: { n: 160, tol: 0 }, x: "(3·3·1 + 1)·16 = 10·16 = 160.", r: 1 },
        { q: "A 28×28×32 feature map passes through 2×2 max pooling with stride 2. The output shape is:", o: ["14×14×16", "14×14×32", "28×28×16", "26×26×32"], a: 1, x: "Height and width halve; the channel count is unchanged.", r: 0 },
        { q: "Which layers have no learnable parameters? (Select all that apply)", o: ["Max pooling", "Flatten", "Dense", "ReLU activation"], a: [0, 1, 3], x: "Only convolution and dense layers (and normalisation layers) learn weights.", r: 0 },
        { q: "Averaging the predicted class probabilities of several models and picking the highest is called:", o: ["Hard voting", "Soft voting", "Boosting", "Dropout"], a: 1, x: "Soft voting averages probabilities; hard voting counts predicted labels.", r: 3 },
        { q: "During training, validation loss starts rising while training loss keeps falling. This indicates:", o: ["Underfitting", "Overfitting", "A learning rate that is too small", "Vanishing gradients"], a: 1, x: "The model is memorising the training set. Dropout, augmentation or early stopping help.", r: 2 }
      ]
    }
  ],
  test: [
    { q: "Naive Bayes classifies by modelling p(x | y)·p(y). It is therefore a:", o: ["Discriminative model", "Generative model", "Reinforcement learning model", "Clustering model"], a: 1, x: "Modelling how data is generated for each class makes it generative.", t: "w1t1", r: 0 },
    { q: "A text-to-image system generates pictures from prompts. It learns:", o: ["p(x)", "p(y | x)", "p(x | c), with c the text prompt", "Only a decision boundary"], a: 2, x: "Conditional generation: the prompt is the condition.", t: "w1t1", r: 1 },
    { q: "For multi-class classification with one correct class out of K, the standard output layer and loss are:", o: ["Sigmoid + MSE", "Softmax + categorical cross-entropy", "Linear + BCE", "ReLU + MAE"], a: 1, x: "Softmax gives a probability distribution over K classes; cross-entropy compares it with the one-hot label.", t: "w1t2", r: 2 },
    { q: "Compute the MSE between y = [1, 2, 3] and ŷ = [1, 3, 5].", a: { n: 1.6667, tol: 0.01 }, x: "Squared errors 0, 1, 4 → mean = 5/3 ≈ 1.667.", t: "w1t2", r: 3 },
    { q: "Which optimizer uses bias-corrected estimates m̂ = m/(1−β₁ᵗ) and v̂ = v/(1−β₂ᵗ)?", o: ["SGD", "AdaGrad", "RMSProp", "Adam"], a: 3, x: "Bias correction compensates for m and v being initialised at zero.", t: "w1t3", r: 3 },
    { q: "Which statements about mini-batch SGD are true? (Select all that apply)", o: ["It computes the gradient on a subset of samples", "It gives noisier updates than full-batch gradient descent", "It always reaches the global minimum", "It makes better use of GPU parallelism than single-sample SGD"], a: [0, 1, 3], x: "No variant of SGD guarantees a global minimum on non-convex losses.", t: "w1t3", r: 0 },
    { q: "Input 6×6, filter 3×3, padding 1, stride 1. Output size?", o: ["4×4", "6×6", "8×8", "5×5"], a: 1, x: "(6 + 2 − 3)/1 + 1 = 6. Padding preserved the size.", t: "w1t4", r: 2 },
    { q: "Input 224×224×3, a Conv2D with 64 filters of 7×7, stride 2, padding 3. What is the output height?", a: { n: 112, tol: 0 }, x: "⌊(224 + 6 − 7)/2⌋ + 1 = ⌊223/2⌋ + 1 = 111 + 1 = 112.", t: "w1t4", r: 2 },
    { q: "Parameters in a Dense layer that maps a flattened vector of 512 values to 10 outputs:", a: { n: 5130, tol: 0 }, x: "(512 + 1) × 10 = 5,130.", t: "w1t5", r: 1 },
    { q: "In transfer learning with a pre-trained ResNet, the usual first step is to:", o: ["Re-initialise all weights randomly", "Freeze the pre-trained convolution base and train a new classification head", "Remove all convolution layers", "Train only the first convolution layer"], a: 1, x: "The pre-trained base already extracts general features; the new head adapts them to your classes.", t: "w1t5", r: 2 }

/* ===== content/w02.js ===== */
COURSE.weeks.push({
  id: "w2", n: 2, title: "Autoencoders",
  tagline: "Compress, reconstruct, regularise: denoising, sparse, contractive.",
  intro: "The autoencoder is the first generative-flavoured model in the course: squeeze data through a narrow code and rebuild it. This week covers how it works, the losses, the main types, the three regularised variants, and why its limits lead straight to the VAE. Lectures 10–18.",
  topics: [
    {
      id: "w2t1", title: "Autoencoders: learn by squeezing", lec: [10], min: 19, w: "bottleneck",
      hook: "You must describe a friend's face to a sketch artist using only 10 numbers. Which 10 would you choose, and how would you know they were good choices?",
      reveal: "<p>You would pick the numbers that let the artist <b>redraw the face best</b>. That is exactly the autoencoder's training signal: compress the input to a few numbers (the <b>latent code</b>), reconstruct it, and judge the code by the reconstruction error. No labels are needed.</p>",
      cards: [
        { h: "Three parts: encoder, code, decoder", b: `<div class="eq">x → Encoder f(x) → z (latent / code / bottleneck) → Decoder g(z) → x̂</div>
          <ul><li><b>Encoder</b>: maps the input to a lower-dimensional representation (5 → 4 → 3 in the lecture's example).</li><li><b>Latent space / code / bottleneck</b>: the compressed representation z.</li><li><b>Decoder</b>: maps z back up to the input size (3 → 4 → 5).</li><li><b>Objective</b>: make x̂ ≈ x by minimising a reconstruction loss L(x, x̂).</li></ul>
          <p>Training is unsupervised (more precisely self-supervised): the target is the input itself.</p>` },
        { h: "Undercomplete vs overcomplete", b: `<div class="tablewrap"><table><tr><th></th><th>Undercomplete</th><th>Overcomplete</th></tr>
          <tr><td>Latent size</td><td>smaller than the input</td><td>equal to or larger than the input</td></tr>
          <tr><td>What it learns</td><td>forced to keep only the most salient features</td><td>can learn the identity map and copy the input</td></tr>
          <tr><td>Risk</td><td>too small → information loss, blurry reconstructions</td><td>low error with no useful features</td></tr>
          <tr><td>Remedy</td><td>choose the code size carefully</td><td>regularise: denoising, sparse, contractive</td></tr></table></div>
          <p>An undercomplete AE with linear activations and MSE learns the same subspace as <b>PCA</b>. Non-linear activations make it a non-linear generalisation of PCA.</p>`, w: "bottleneck" },
        { h: "What autoencoders are used for", b: `<ul><li>Dimensionality reduction and feature learning (use the encoder output as features).</li><li>Denoising images or signals.</li><li>Anomaly detection: train on normal data only; inputs that reconstruct badly (high error) are anomalies.</li><li>Compression, and pre-training of encoders.</li><li>A stepping stone to generation: the VAE turns the decoder into a proper generator.</li></ul>`,
          ask: { q: "An AE trained only on normal heartbeats sees an abnormal one. The reconstruction error will most likely be:", o: ["Lower than usual", "Higher than usual", "Exactly zero", "Unchanged"], a: 1, x: "It never learned to reconstruct abnormal patterns, so they reconstruct poorly. That is the basis of AE anomaly detection." } }
      ],
      keys: ["AE = encoder → latent code (bottleneck) → decoder; trained to reconstruct its own input.", "Undercomplete: code smaller than the input, learns salient features. Overcomplete: code ≥ input, can copy the input unless regularised.", "A linear AE with MSE spans the same subspace as PCA.", "Uses: dimensionality reduction, denoising, anomaly detection (high reconstruction error = anomaly)."],
      traps: ["Low reconstruction error alone does not prove the AE learned useful features (it may copy).", "AE training needs no labels; the input is the target.", "The bottleneck is the code layer, not the output layer."],
      quiz: [
        { q: "In an autoencoder, the target output during training is:", o: ["A class label", "The input itself", "Random noise", "The latent code"], a: 1, x: "The loss compares the reconstruction x̂ with the original x.", r: 0 },
        { q: "An autoencoder whose latent dimension is larger than the input dimension is called:", o: ["Undercomplete", "Overcomplete", "Variational", "Contractive"], a: 1, x: "Overcomplete AEs can trivially learn the identity unless regularised.", r: 1 },
        { q: "Why is an overcomplete autoencoder without regularisation risky?", o: ["It cannot be trained with backpropagation", "It may simply copy the input, giving low error but no useful features", "It always has a high reconstruction error", "It needs labelled data"], a: 1, x: "With enough capacity, the identity map gives near-zero loss and teaches nothing.", r: 1 },
        { q: "A linear autoencoder trained with MSE learns a representation equivalent to:", o: ["K-means", "PCA (principal component subspace)", "A decision tree", "Softmax regression"], a: 1, x: "A linear AE with squared error recovers the principal subspace.", r: 1 },
        { q: "Which are valid uses of autoencoders? (Select all that apply)", o: ["Anomaly detection via reconstruction error", "Image denoising", "Dimensionality reduction", "Supervised multi-class classification without any labels"], a: [0, 1, 2], x: "Classification still needs labels; an AE can only supply features for it.", r: 2 }
      ]
    },
    {
      id: "w2t2", title: "Reconstruction losses and AE architectures", lec: [11, 12, 17], min: 17, w: "aenum",
      hook: "Two autoencoders reconstruct the same black-and-white handwriting scan. One ends in a sigmoid and uses BCE, the other ends in a linear layer and uses MSE. Which one matches the data, and what goes wrong with the other?",
      reveal: "<p>Binary or [0, 1] pixels pair with <b>sigmoid + binary cross-entropy</b>: outputs stay in (0, 1) and the loss treats each pixel as a Bernoulli probability. A linear output can produce values like 1.4 or −0.2 that are not valid pixel intensities. MSE with a linear output is the right choice for <i>continuous, unbounded</i> data.</p>",
      cards: [
        { h: "The two reconstruction losses", b: `<div class="eq">MSE: L = (1/n) Σ (x_i − x̂_i)²     → continuous data, linear output</div>
          <div class="eq">BCE: L = −(1/n) Σ [x_i log x̂_i + (1 − x_i) log(1 − x̂_i)]     → binary or [0, 1]-normalised data, sigmoid output</div>
          <p>Probabilistic view: MSE is the negative log-likelihood of a Gaussian decoder; BCE is the negative log-likelihood of a Bernoulli decoder. This reappears in the VAE.</p>`, w: "aenum" },
        { h: "Shallow, deep and convolutional autoencoders", b: `<div class="tablewrap"><table><tr><th>Type</th><th>Structure</th><th>Good for</th></tr>
          <tr><td>Shallow AE</td><td>One hidden (code) layer: input → code → output</td><td>Simple tabular data; close to PCA</td></tr>
          <tr><td>Deep (stacked) AE</td><td>Several dense layers each side, e.g. 784 → 256 → 64 → 32 → 64 → 256 → 784</td><td>More complex, non-linear structure</td></tr>
          <tr><td>Convolutional AE</td><td>Encoder: Conv + pooling/stride. Decoder: upsampling or transposed convolutions (Conv2DTranspose)</td><td>Images: keeps spatial structure, far fewer parameters</td></tr></table></div>
          <p>The decoder is usually a mirror image of the encoder, but it does not have to be.</p>` },
        { h: "The hands-on version in Keras", b: `<ul><li>Load MNIST and scale pixels to [0, 1] (divide by 255). The images are their own targets: <code>model.fit(x_train, x_train, ...)</code>.</li><li>Dense AE: flatten to 784, encode to e.g. 32, decode back to 784 with a sigmoid, loss <code>binary_crossentropy</code> (or <code>mse</code>).</li><li>Convolutional AE: <code>Conv2D</code> + <code>MaxPooling2D</code> down, <code>UpSampling2D</code> or <code>Conv2DTranspose</code> up, last layer <code>Conv2D(1, (3,3), activation='sigmoid', padding='same')</code>.</li><li>Compare original and reconstructed digits side by side; deeper and convolutional AEs give sharper reconstructions.</li></ul>`,

    {
      id: "w2t3", title: "Regularised autoencoders: denoising, sparse, contractive", lec: [13, 14, 15, 18], min: 21,
      hook: "An overcomplete autoencoder can cheat by copying its input. Three fixes: break the input, ration the neurons, or make the code stubborn. Can you guess which name goes with which fix?",
      reveal: "<p><b>Denoising AE</b>: break the input (add noise) but ask for the clean output, so copying no longer works. <b>Sparse AE</b>: ration the neurons, so only a few code units may be active for any input. <b>Contractive AE</b>: make the code stubborn, so small input changes barely move it (penalise the encoder's Jacobian).</p>",
      cards: [
        { h: "Denoising autoencoder (DAE)", b: `<div class="eq">x̃ = x + noise (or masking)  →  encoder → z → decoder → x̂;   loss = L(x, x̂)   (compare with the CLEAN x)</div>
          <ul><li>Corruptions: additive Gaussian noise, masking noise (randomly zero some pixels), salt-and-pepper.</li><li>To undo the noise, the network must learn how neighbouring pixels depend on each other, i.e. the structure of the data, instead of the identity.</li><li>Noise is added only during training. At test time you feed noisy images and get cleaned ones back.</li></ul>`,
          ask: { q: "In a denoising AE, the loss compares the output with:", o: ["The noisy input x̃", "The clean input x", "The latent code", "A label"], a: 1, x: "Corrupt the input, reconstruct the original. Comparing with x̃ would teach it to reproduce the noise." } },
        { h: "Sparse autoencoder", b: `<p>Allow a large code, but force most units to be inactive for any given input. Each unit then specialises in a feature.</p>
          <div class="eq">L = L_recon(x, x̂) + β · Σ_j KL(ρ ‖ ρ̂_j)</div>
          <div class="eq">KL(ρ ‖ ρ̂_j) = ρ·log(ρ/ρ̂_j) + (1−ρ)·log((1−ρ)/(1−ρ̂_j))</div>
          <ul><li>ρ = target sparsity (small, e.g. 0.05); ρ̂_j = average activation of hidden unit j over the batch.</li><li>The penalty is 0 when ρ̂_j = ρ and grows as the unit fires more often.</li><li>Alternative: an L1 penalty λ Σ|h_j| on the activations.</li></ul>
          <p>This is the first time <b>KL divergence</b> shows up as a penalty. It is the centre of the VAE next week.</p>` },
        { h: "Contractive autoencoder (CAE)", b: `<div class="eq">L = L_recon(x, x̂) + λ · ‖J_f(x)‖²_F = L_recon + λ Σ_{i,j} (∂h_j / ∂x_i)²</div>
          <ul><li>J_f is the Jacobian of the <b>encoder</b> with respect to the input; ‖·‖_F is the Frobenius norm.</li><li>The penalty makes the code locally insensitive (it “contracts”) to small perturbations of the input, while reconstruction keeps it sensitive along directions that matter.</li><li>Denoising AE: robust because noise was injected into the data. Contractive AE: robust because the encoder's derivative is penalised analytically.</li></ul>` },
        { h: "Side by side", b: `<div class="tablewrap"><table><tr><th>Variant</th><th>What is changed</th><th>Extra term</th><th>Effect</th></tr>
          <tr><td>Denoising</td><td>The input (corrupted)</td><td>none (clean target)</td><td>Robust features; can clean noisy data</td></tr>

          <tr><td>Contractive</td><td>The loss</td><td>λ ‖∂h/∂x‖²_F</td><td>Code insensitive to small input changes</td></tr></table></div>
          <p>In the practical session all three are trained on MNIST and compared: reconstructions of noisy digits, activation histograms (sparse) and robustness to perturbations (contractive).</p>` }
      ],
      keys: ["Denoising AE: corrupt x → reconstruct the clean x; learns dependencies between neighbouring pixels.", "Sparse AE: adds β Σ KL(ρ‖ρ̂_j); ρ = target average activation (e.g. 0.05), ρ̂_j = actual average activation.", "Contractive AE: adds λ‖J_f(x)‖²_F, the squared Frobenius norm of the encoder Jacobian.", "All three prevent an overcomplete AE from learning the identity."],
      traps: ["Contractive penalises the ENCODER Jacobian, not the decoder's.", "In a sparse AE, ρ̂_j is averaged over training samples for one unit, not over units for one sample.", "Denoising adds noise to the input only; the target stays clean."],

        { q: "The contractive autoencoder adds a penalty on:", o: ["The L2 norm of the decoder weights", "The Frobenius norm of the encoder's Jacobian with respect to the input", "The number of latent units", "The KL divergence to a Gaussian prior"], a: 1, x: "λ‖∂h/∂x‖²_F makes the code insensitive to small input perturbations.", r: 2 },
        { q: "Which statements about the denoising autoencoder are true? (Select all that apply)", o: ["The input is corrupted during training", "The loss compares the output with the clean input", "It must learn dependencies between neighbouring pixels", "It needs labelled noise types"], a: [0, 1, 2], x: "No labels are needed: the clean input is the target.", r: 0 },
        { q: "Compute KL(ρ ‖ ρ̂) for ρ = 0.1 and ρ̂ = 0.2 using natural logs: ρ·ln(ρ/ρ̂) + (1−ρ)·ln((1−ρ)/(1−ρ̂)). Round to 4 decimals.", a: { n: 0.0367, tol: 0.0006 }, x: "0.1·ln(0.5) + 0.9·ln(0.9/0.8) = −0.0693 + 0.9·0.1178 = −0.0693 + 0.1060 = 0.0367.", r: 1 },

    {
      id: "w2t4", title: "An autoencoder by the numbers, and its limits", lec: [16], min: 14, w: "aenum",
      hook: "An autoencoder reconstructs handwritten digits almost perfectly. Pick a random point in its latent space and decode it. Do you get a new digit?",
      reveal: "<p>Usually <b>no</b>: you get a smudge. A plain AE only learns to map training inputs to codes and back. Nothing forces the space <i>between</i> the codes to decode to anything sensible, so the latent space has gaps and no known distribution to sample from. Fixing that is the job of the VAE.</p>",
      cards: [
        { h: "The worked example from the lecture", b: `<p>Architecture <b>5 → 4 → 3 → 4 → 5</b>, ReLU in hidden layers, linear output (continuous inputs), MSE loss.</p>
          <ol><li>Input x = [0.8, 0.4, 0.6, 0.2, 0.5]. First hidden neuron: z = 0.8·0.2 + 0.4·0.5 + 0.6·0.4 + 0.2·0.3 + 0.5·0.1 + 0.01 = 0.71 + 0.01 = <b>0.72</b>; ReLU(0.72) = 0.72.</li>
          <li>Repeat for the other 3 neurons → a 4-vector. Then 4 → 3 gives the <b>latent representation</b> (e.g. [0.760, 0.714, 0.944]).</li>
          <li>Decoder: 3 → 4 (ReLU), then 4 → 5 with a <b>linear</b> activation, so the output is just the weighted sum plus bias.</li>
          <li>Loss: MSE between x and x̂, averaged over the 5 values. Backprop + optimizer update all weights and biases; after training, x̂ ≈ x.</li></ol>
          <p>Every step is “inputs × weights + bias → activation”. Exams test exactly this, one neuron at a time.</p>`, w: "aenum" },
        { h: "Four limitations of plain autoencoders", b: `<ol><li><b>A low reconstruction error does not guarantee meaningful features.</b> You cannot read from the code whether a digit is a 2 or a 9, thick or thin, slanted or upright.</li>
          <li><b>The latent code is not directly usable</b> for classification, clustering or anomaly scoring just because reconstruction is good.</li>
          <li><b>Reconstruction is an approximation</b> from a compressed code, and the AE <b>does not generate new samples</b>: the latent space is irregular, with no known distribution to sample from.</li>
          <li><b>Latent size is a dilemma.</b> Too small: too much information lost, poor reconstruction. Too large: the model may just copy the input, so learning is weak.</li></ol>
          <p><b>The fix:</b> regularise the latent space by adding a KL-divergence term to the loss, which pulls the codes towards a known distribution such as N(0, I). That is the <b>variational autoencoder</b>, next week.</p>`,
          ask: { q: "What does the VAE add to the AE loss to fix the latent space?", o: ["An L1 penalty on the weights", "A KL-divergence term", "A classification loss", "Dropout"], a: 1, x: "KL(q(z|x) ‖ p(z)) regularises the latent space towards a prior, usually N(0, I)." } }
      ],
      keys: ["Each neuron: z = Σ w_i x_i + b, then activation; ReLU in hidden layers, linear at the output for continuous data.", "The output of the last encoder layer is the latent representation.", "The AE limits: no guarantee of meaningful latent features, irregular latent space, cannot sample new data, and the latent-size dilemma.", "The VAE fixes this with a KL regulariser on the latent space."],
      traps: ["The bias is added once per neuron, after summing the weighted inputs.", "Output activation for continuous inputs is linear, so f(a) = a.", "An AE reconstructs; it does not generate."],
      quiz: [
        { q: "A hidden neuron receives x = [1, 2, 3] with weights w = [0.5, −1, 0.5] and bias 0.2, followed by ReLU. Its output is:", a: { n: 0.2, tol: 0.001 }, x: "z = 0.5 − 2 + 1.5 + 0.2 = 0.2; ReLU(0.2) = 0.2.", r: 0 },
        { q: "The same neuron but with bias −0.5. Its ReLU output is:", a: { n: 0, tol: 0.001 }, x: "z = 0.5 − 2 + 1.5 − 0.5 = −0.5; ReLU(−0.5) = 0.", r: 0 },
        { q: "Why can't you simply sample a random latent vector from a plain AE and decode it into a realistic sample?", o: ["The decoder has no weights", "The latent space is irregular and has no known distribution to sample from", "AEs only work on text", "The encoder is non-differentiable"], a: 1, x: "Nothing in the AE loss organises the latent space, so random points fall in gaps.", r: 1 },
        { q: "What happens when the latent space of an AE is made very large?", o: ["Reconstruction always gets worse", "The model may copy the input: low error, weak feature learning", "Training becomes impossible", "It turns into a VAE"], a: 1, x: "Too much capacity allows an identity-like mapping.", r: 1 },
        { q: "For continuous inputs, the lecture's AE uses which activation at the output layer?", o: ["ReLU", "Sigmoid", "Linear", "Softmax"], a: 2, x: "Continuous targets → linear output → MSE loss.", r: 0 }
      ]
    }
  ],
  test: [
    { q: "An autoencoder is trained to minimise:", o: ["Classification error", "Reconstruction error between x and x̂", "The number of latent units", "The KL divergence between two classifiers"], a: 1, x: "Reconstruction error is the AE objective.", t: "w2t1", r: 0 },
    { q: "Which statements are true for an undercomplete autoencoder? (Select all that apply)", o: ["The latent dimension is smaller than the input dimension", "It is forced to capture the most salient features", "It is guaranteed to learn the identity function", "With linear activations and MSE it relates to PCA"], a: [0, 1, 3], x: "The bottleneck prevents an exact identity map.", t: "w2t1", r: 1 },
    { q: "Compute the BCE (natural log, averaged) for targets x = [1, 0] and outputs x̂ = [0.9, 0.2]. Round to 3 decimals.", a: { n: 0.164, tol: 0.003 }, x: "−½[ln 0.9 + ln 0.8] = −½[−0.1054 − 0.2231] = 0.164.", t: "w2t2", r: 0 },
    { q: "Which layer is typically used in the decoder of a convolutional autoencoder to increase spatial size with learnable weights?", o: ["MaxPooling2D", "Conv2DTranspose", "GlobalAveragePooling2D", "Flatten"], a: 1, x: "Transposed convolutions upsample and learn weights.", t: "w2t2", r: 1 },
    { q: "In a denoising AE trained with masking noise, at test time the network:", o: ["Must receive clean images", "Receives a noisy image and outputs a cleaned version", "Generates new images from random noise", "Outputs a class label"], a: 1, x: "It learned to map corrupted inputs to clean ones.", t: "w2t3", r: 0 },
    { q: "A sparse AE's penalty grows when a hidden unit's average activation ρ̂_j…", o: ["equals the target ρ", "moves away from the target ρ", "becomes exactly zero for one sample", "is computed by the decoder"], a: 1, x: "KL(ρ‖ρ̂_j) is 0 at ρ̂_j = ρ and increases as they diverge.", t: "w2t3", r: 1 },
    { q: "The contractive AE penalty λ‖J_f(x)‖²_F encourages:", o: ["Larger weights in the decoder", "A latent code that changes little for small changes of the input", "More active hidden units", "Larger reconstruction error"], a: 1, x: "Small encoder derivatives = locally contractive mapping.", t: "w2t3", r: 2 },
    { q: "Which regularised AE uses KL divergence inside its penalty?", o: ["Denoising", "Contractive", "Sparse", "Undercomplete"], a: 2, x: "The sparsity penalty is Σ KL(ρ‖ρ̂_j).", t: "w2t3", r: 1 },
    { q: "Input to a linear output neuron: activations [0.5, 1.0], weights [2, −1], bias 0.3. The output is:", a: { n: 0.3, tol: 0.001 }, x: "0.5·2 + 1.0·(−1) + 0.3 = 1 − 1 + 0.3 = 0.3. A linear activation passes it through unchanged.", t: "w2t4", r: 0 },
    { q: "Which is NOT a limitation of plain autoencoders discussed in the course?", o: ["Low reconstruction error does not guarantee meaningful latent features", "The latent space cannot be reliably sampled to generate new data", "They cannot be trained with gradient descent", "Choosing the latent size trades information loss against copying"], a: 2, x: "AEs train perfectly well with backpropagation; the issues are about the latent space.", t: "w2t4", r: 1 }
  ]

COURSE.weeks.push({
  id: "w3", n: 3, title: "Variational autoencoders",
  tagline: "KL divergence, probabilistic encoder/decoder, ELBO, reparameterisation.",
  intro: "The VAE turns the autoencoder into a true generative model by making the latent space probabilistic and regularised. First the information-theory tools (entropy, cross-entropy, KL), then the encoder, decoder, ELBO loss and the reparameterisation trick, and finally a full numerical forward pass. Lectures 19–24.",
  topics: [
    {
      id: "w3t1", title: "Information, entropy and KL divergence", lec: [19, 20], min: 21, w: "kl",
      hook: "Weather report A says “sunny in the Sahara today”. Report B says “snow in the Sahara today”. Which carries more information, and can you turn your answer into a number?",
      reveal: "<p>The surprising one. Information measures surprise: <b>I(x) = −log p(x)</b>. A near-certain event (p ≈ 1) carries ≈ 0 bits; a rare event carries many. Average that surprise over a distribution and you get <b>entropy</b>. Measure the extra surprise of using the wrong distribution and you get <b>KL divergence</b>, the regulariser at the heart of the VAE.</p>",
      cards: [
        { h: "Self-information, entropy, cross-entropy", b: `<div class="eq">Self-information: I(x) = −log p(x)</div><div class="eq">Entropy: H(P) = −Σ p(x) log p(x) = E_P[−log p(x)]</div><div class="eq">Cross-entropy: H(P, Q) = −Σ p(x) log q(x)</div>
          <ul><li>log base 2 → bits; natural log → nats.</li><li>Entropy is the average surprise, maximal for a uniform distribution (a fair coin has H = 1 bit) and zero for a certain outcome.</li><li>Cross-entropy is the average surprise when the truth is P but you encode or predict with Q. It is always ≥ H(P).</li></ul>`, w: "entropy" },
        { h: "KL divergence: the price of the wrong distribution", b: `<div class="eq">KL(P ‖ Q) = Σ p(x) log [p(x) / q(x)] = H(P, Q) − H(P)</div>
          <ul><li>KL ≥ 0, and KL = 0 if and only if P = Q (Gibbs' inequality).</li><li><b>Not symmetric:</b> KL(P‖Q) ≠ KL(Q‖P) in general, so it is not a true distance metric.</li><li>With P fixed, minimising cross-entropy is the same as minimising KL(P‖Q). That is why classifiers are trained with cross-entropy.</li></ul>
          <div class="eq">Two Gaussians: KL(N(μ₁,σ₁²) ‖ N(μ₂,σ₂²)) = ln(σ₂/σ₁) + (σ₁² + (μ₁−μ₂)²)/(2σ₂²) − ½</div>`, w: "kl" },
        { h: "Forward vs reverse KL: covering or seeking", b: `<p>Fit a single Gaussian Q to a two-peaked P:</p>
          <ul><li><b>Forward KL(P ‖ Q)</b> (the expectation is over P): Q is punished wherever P has mass and Q doesn't, so Q spreads to cover every mode. <b>Mode covering</b> (mean-seeking), which can put mass in the gap between peaks.</li><li><b>Reverse KL(Q ‖ P)</b> (the expectation is over Q): Q is punished wherever Q has mass and P doesn't, so Q hides inside one mode. <b>Mode seeking</b> (zero-forcing).</li></ul>
          <p>Maximum likelihood corresponds to forward KL. Variational inference (the VAE) minimises the reverse KL between the approximate and true posterior.</p>`, w: "klmodes",
          ask: { q: "Which KL direction tends to lock onto a single mode of a multimodal P?", o: ["KL(P ‖ Q), forward", "KL(Q ‖ P), reverse", "Both equally", "Neither"], a: 1, x: "Reverse KL penalises Q for placing mass where P ≈ 0, so Q settles into one mode." } }
      ],
      keys: ["I(x) = −log p(x); H(P) = −Σ p log p; H(P,Q) = −Σ p log q.", "KL(P‖Q) = Σ p log(p/q) = H(P,Q) − H(P) ≥ 0, equal to 0 only when P = Q.", "KL is asymmetric, so it is not a distance metric.", "Forward KL(P‖Q) is mode covering; reverse KL(Q‖P) is mode seeking.", "Gaussian KL: ln(σ₂/σ₁) + (σ₁² + (μ₁−μ₂)²)/(2σ₂²) − ½."],
      traps: ["Cross-entropy ≥ entropy, and the gap is exactly KL.", "A fair coin has 1 bit of entropy; a coin with p = 1 has 0.", "Which argument the expectation is taken over decides covering vs seeking."],
      quiz: [
        { q: "What is the entropy, in bits, of a fair 4-sided die?", a: { n: 2, tol: 0.001 }, x: "H = −Σ ¼ log₂ ¼ = log₂ 4 = 2 bits.", r: 0 },
        { q: "Which statements about KL divergence are true? (Select all that apply)", o: ["KL(P‖Q) ≥ 0", "KL(P‖Q) = KL(Q‖P) for all P, Q", "KL(P‖Q) = H(P,Q) − H(P)", "KL(P‖Q) = 0 when P = Q"], a: [0, 2, 3], x: "KL is asymmetric in general.", r: 1 },
        { q: "Fitting a unimodal Q to a bimodal P by minimising KL(P‖Q) typically produces a Q that:", o: ["Sits on one of the two peaks", "Spreads to cover both peaks", "Collapses to a point", "Equals P exactly"], a: 1, x: "Forward KL is mode covering.", r: 2 },
        { q: "Compute KL(P‖Q) in bits for P = (0.5, 0.5) and Q = (0.25, 0.75). Round to 3 decimals.", a: { n: 0.208, tol: 0.003 }, x: "0.5·log₂(0.5/0.25) + 0.5·log₂(0.5/0.75) = 0.5·1 + 0.5·(−0.585) = 0.5 − 0.2925 = 0.2075.", r: 1 },
        { q: "The self-information of an event with probability 1/8, in bits, is:", a: { n: 3, tol: 0.001 }, x: "−log₂(1/8) = 3 bits.", r: 0 }
      ]
    },
    {
      id: "w3t2", title: "The VAE: probabilistic encoder, decoder and ELBO", lec: [21, 22], min: 25,
      hook: "A plain autoencoder maps each image to one point. What if the encoder instead said “this image lives somewhere in this cloud”, and every cloud were pulled towards the same standard normal? What would that buy you at generation time?",
      reveal: "<p>Because every training cloud overlaps around N(0, I), you can sample z ~ N(0, I) and decode it into something realistic: the space between training codes is filled in. That is the VAE's deal: a probabilistic encoder q_φ(z|x), a decoder p_θ(x|z), and a loss that balances reconstruction against staying close to the prior.</p>",
      cards: [
        { h: "The generative story", b: `<p>Assume each data point x is produced by first drawing a latent z from a simple <b>prior</b> p(z) = N(0, I), then drawing x from a <b>likelihood</b> p_θ(x | z) given by the decoder network.</p>
          <div class="eq">p_θ(x) = ∫ p_θ(x | z) p(z) dz       (the evidence: intractable to compute)</div>
          <p>The true posterior p(z | x) = p(x|z)p(z)/p(x) is therefore intractable too. The VAE approximates it with an <b>encoder network q_φ(z | x)</b>. This is <b>variational inference</b>: approximate an intractable posterior with a tractable family.</p>` },
        { h: "Probabilistic encoder: output a distribution, not a point", b: `<div class="eq">q_φ(z | x) = N(z; μ_φ(x), diag(σ²_φ(x)))</div>
          <ul><li>The encoder's final layer has two heads: <b>μ</b> and <b>log σ²</b>, each of size d (the latent dimension).</li><li>These heads use <b>no activation</b> (linear): μ may be negative, and log σ² can be any real number. Then σ² = exp(log σ²) > 0 is guaranteed.</li><li>Then z is <i>sampled</i> from this Gaussian, so the same x can give different z.</li></ul>`,
          ask: { q: "Why does the encoder output log σ² instead of σ² directly?", o: ["It is faster to compute", "So an unconstrained linear output always maps to a positive variance via exp", "Because the decoder needs logs", "To make the KL term zero"], a: 1, x: "exp(log σ²) is always positive, and the network can output any real number." } },
        { h: "Probabilistic decoder", b: `<p>The decoder p_θ(x | z) maps z to the parameters of a distribution over x:</p><ul><li>Continuous data → Gaussian: the decoder outputs the mean (linear activation); the negative log-likelihood is MSE up to constants.</li><li>Binary or [0, 1] data → Bernoulli: a sigmoid output; the negative log-likelihood is BCE.</li></ul><p>In practice the decoder's output (the mean) <b>is</b> the reconstruction x̂, as in the lecture's numerical example.</p>` },
        { h: "The ELBO, and the VAE loss", b: `<div class="eq">log p_θ(x) ≥ ELBO = E_{q_φ(z|x)}[log p_θ(x | z)] − KL(q_φ(z | x) ‖ p(z))</div>
          <div class="eq">log p(x) − ELBO = KL(q_φ(z|x) ‖ p(z|x)) ≥ 0</div>
          <p>Maximise the ELBO (Evidence Lower BOund) ⇔ minimise the VAE loss:</p>
          <div class="eq">L_VAE = Reconstruction loss (MSE or BCE)  +  KL(q_φ(z | x) ‖ N(0, I))</div>
          <div class="eq">KL closed form (diagonal Gaussian vs N(0, I)) = ½ Σ_j (μ_j² + σ_j² − log σ_j² − 1)</div>
          <ul><li>The reconstruction term makes codes informative.</li><li>The KL term pulls every q(z|x) towards N(0, I): a smooth, continuous, sampleable latent space. Too strong and you get <b>posterior collapse</b> (z ignored, blurry outputs).</li><li>Generation: sample z ~ N(0, I) and decode. The encoder is not needed.</li></ul>`, w: "vaeloss" }
      ],
      keys: ["Prior p(z) = N(0, I); encoder q_φ(z|x) = N(μ, diag σ²) approximates the intractable posterior p(z|x).", "Encoder heads μ and log σ² have no activation; σ² = exp(log σ²), σ = exp(½ log σ²).", "ELBO = E_q[log p(x|z)] − KL(q(z|x)‖p(z)) ≤ log p(x); the gap is KL(q(z|x)‖p(z|x)).", "L_VAE = reconstruction + ½Σ(μ² + σ² − log σ² − 1).", "Generate by sampling z ~ N(0, I) and running only the decoder."],
      traps: ["You MAXIMISE the ELBO, which means MINIMISING the loss = −ELBO.", "The KL in the loss is to the prior p(z), not to the true posterior.", "The KL term is zero only when μ = 0 and σ² = 1 for every dimension."],
      quiz: [
        { q: "In a VAE, the encoder outputs:", o: ["A single deterministic code z", "The parameters (μ, log σ²) of q(z | x)", "The class label", "The reconstruction x̂"], a: 1, x: "The encoder parameterises a Gaussian over z.", r: 1 },
        { q: "The ELBO is a lower bound on:", o: ["The KL divergence", "The log-likelihood log p(x)", "The reconstruction error", "The entropy of z"], a: 1, x: "log p(x) ≥ ELBO, with the gap being KL(q(z|x) ‖ p(z|x)).", r: 3 },
        { q: "Compute the KL term ½ Σ (μ² + σ² − log σ² − 1) for a 1-D latent with μ = 1 and log σ² = 0.", a: { n: 0.5, tol: 0.001 }, x: "σ² = e⁰ = 1, so ½(1 + 1 − 0 − 1) = 0.5.", r: 3 },
        { q: "Which statements about the VAE loss are true? (Select all that apply)", o: ["It has a reconstruction term and a KL term", "The KL term pushes q(z|x) towards the prior N(0, I)", "Minimising the loss maximises the ELBO", "The KL term is computed between the decoder output and the input"], a: [0, 1, 2], x: "The KL is between the approximate posterior and the prior, in latent space.", r: 3 },
        { q: "To generate a new sample from a trained VAE you:", o: ["Encode a training image and decode it", "Sample z ~ N(0, I) and pass it through the decoder", "Run the encoder on random noise", "Sample x from the prior"], a: 1, x: "The KL regulariser makes N(0, I) a valid place to sample codes from.", r: 3 },
        { q: "Why do the μ and log σ² layers of the encoder use no activation function?", o: ["To speed up training", "Because μ may be negative and log σ² may be any real number; ReLU would clip them", "Because activations are not differentiable", "Because they are frozen"], a: 1, x: "The lecture stresses this: applying ReLU would wrongly turn a negative mean into 0.", r: 1 }
      ]

    {
      id: "w3t3", title: "The reparameterisation trick", lec: [23], min: 14, w: "reparam",
      hook: "Backpropagation needs a derivative at every step. Somewhere in the middle of the VAE is the operation “draw a random sample”. What is the derivative of rolling a die with respect to which die you picked?",
      reveal: "<p>There isn't one: sampling is not a differentiable function of μ and σ, so gradients can't reach the encoder. The trick moves the randomness <i>outside</i> the path: draw ε ~ N(0, 1) independently, then compute <b>z = μ + σ ⊙ ε</b>. That is a plain differentiable formula in μ and σ.</p>",
      cards: [
        { h: "The problem", b: `<p>z ~ N(μ_φ(x), σ²_φ(x)) is a stochastic node. The loss depends on z, but there is no gradient ∂z/∂μ through a sampling operation, so the encoder parameters φ could not be trained by backprop.</p>` },
        { h: "The trick", b: `<div class="eq">ε ~ N(0, I)      z = μ + σ ⊙ ε      with σ = exp(½ · log σ²)</div>
          <ul><li>All randomness now lives in ε, which does not depend on any parameter.</li><li>z is a deterministic, differentiable function of μ and σ: ∂z/∂μ = 1, ∂z/∂σ = ε.</li><li>The distribution of z is unchanged: μ + σε ~ N(μ, σ²).</li><li>The same x gives a different z each time you draw a new ε, which is how a VAE produces variations.</li></ul>`, w: "reparam" },
        { h: "Worked numbers", b: `<p>Encoder gives μ = [0.043, −0.66] and log σ² = [0.732, 0.302].</p><ul><li>σ² = [e^0.732, e^0.302] = [2.079, 1.353]; σ = [1.442, 1.163].</li><li>Draw ε = [0.5, −0.2]: z₁ = 0.043 + 1.442 × 0.5 = <b>0.764</b>; z₂ = −0.66 + 1.163 × (−0.2) = <b>−0.893</b>.</li><li>Another ε gives another z from the same distribution.</li></ul>
          <p>Exam recipe: log σ² → (exp) σ² → (sqrt) σ → z = μ + σε.</p>`,
          ask: { q: "μ = 2, log σ² = 0, ε = −1. z = ?", o: ["1", "2", "3", "0"], a: 0, x: "σ = e⁰ = 1, z = 2 + 1·(−1) = 1." } }
      ],
      keys: ["Sampling blocks gradients; the fix is z = μ + σ ⊙ ε with ε ~ N(0, I).", "ε is independent of the parameters; μ and σ sit on a differentiable path.", "σ = exp(½ log σ²), σ² = exp(log σ²).", "The same input yields different z for different ε."],
      traps: ["Add σ·ε, not σ²·ε.", "ε comes from the standard normal N(0, 1), not from N(μ, σ²).", "The trick is used during training too, not only at generation time."],

        { q: "Given μ = 0.5, log σ² = 0.693 (so σ² ≈ 2) and ε = 1, compute z = μ + σ·ε. Round to 3 decimals.", a: { n: 1.914, tol: 0.004 }, x: "σ = √2 ≈ 1.414; z = 0.5 + 1.414 = 1.914.", r: 2 },
        { q: "Why is the reparameterisation trick necessary?", o: ["To reduce the latent dimension", "To make sampling differentiable with respect to μ and σ so gradients reach the encoder", "To remove the KL term", "To speed up the decoder"], a: 1, x: "Moving randomness into ε turns z into a differentiable function of μ and σ.", r: 0 },
        { q: "For z = μ + σε, the derivative ∂z/∂σ equals:", o: ["1", "μ", "ε", "σ"], a: 2, x: "z is linear in σ with coefficient ε.", r: 1 },
        { q: "μ = −1, σ = 0.5, ε = 2. Compute z.", a: { n: 0, tol: 0.001 }, x: "−1 + 0.5 × 2 = 0.", r: 2 }
